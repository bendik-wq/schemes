.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}

<script>
const POSTS = [{"n": 1, "t": "Stop growing one customer at a time", "b": "If your business does somewhere between $1M and $10M, the next $1M of profit probably won't come from growth.\n\nIt'll come from a purchase.\n\nHere's the trap.\n\nEvery new dollar of revenue costs you more ads, another hire and more of your own hours. Margins don't scale the way they did at the start. Next year looks like this year, a bit bigger and a bit more tiring.\n\nMost owners think there are two ways out.\n\nGrind harder: more spend, more staff, hope revenue outruns costs. It works, slowly, over years.\n\nRaise money: bring in investors, give away a slice of what you built, and answer to someone else.\n\nThere's a third way, and it's the one I use.\n\nYou buy a business that's already built. A competitor, or an owner in your industry who wants to retire.\n\nIts customers, its team and its profit join yours on day one.\n\nAnd the purchase is paid by the bank and the seller, out of that business's own cash flow. Not your savings. Not your current business.\n\nSay a competitor makes $500K a year in profit and you agree $1.5M. A lender funds most of the price. The seller carries part as a note, paid back over time from the profit. The lender adds a working-capital line on top. You end up with more funding than the price.\n\nOne rule we don't break: the business you buy has to earn about 1.5 times what it owes each year. So the deal pays for itself with a buffer, and it never leans on the business you already own.\n\nThat's how owners double, sometimes triple, in one move instead of five years.\n\nThe hard part isn't the money. It's knowing which business to buy, how to approach the owner, and how to structure the paper so the bank says yes.\n\nThat's what we do with owners in 90 days, from first audit to a signed letter of intent.\n\nIf your business does $1M+ a year, answer 10 quick questions and see if you qualify. Takes about two minutes.\n\napply.grosfjeld-li.com\n\nResults aren't typical and depend on your business, market and the deals available. Not financial advice.", "s": 1}, {"n": 2, "t": "The first 90 days after you buy", "b": "Most acquisitions don't fail at the deal.\n\nThey fail in the first 90 days after it.\n\nThe paperwork is the easy part. You sign, the money moves, the keys change hands.\n\nThen Monday comes. Twenty people you didn't hire are wondering if their jobs are safe. The best one is taking a recruiter's call. Customers are waiting to see if anything changes.\n\nHere's what I'd focus on, in order.\n\n1. Keep the people who carry the relationships. Find the two or three staff the customers actually call. Meet them in week one. Tell them what stays the same. Give them a reason to stay through the handover. The money you spend keeping one key person is nothing next to the revenue that leaves with them.\n\n2. Change nothing customers can see for 90 days. No new pricing, no new branding, no new systems on the front line. Customers leave over change, not ownership.\n\n3. Fix the back office first, quietly. Payroll, invoicing, debtors, suppliers. That's where the cash is, and nobody outside notices.\n\n4. Make the hard calls once. If someone has to go, decide in the first 90 days, do it properly and do it once. Slow, drip-fed cuts kill a culture faster than one clear decision.\n\n5. Build the layer under you. The goal of buying a second business isn't to work twice as hard. It's to build a management layer so the group doesn't depend on you.\n\nThis is why integration planning starts on day one of our process, not after settlement. We help owners pick a business their team can actually absorb, before they sign anything.\n\nIf you run a $1M+ business and you've thought about buying a competitor, see if you qualify. 10 questions, about two minutes.\n\napply.grosfjeld-li.com\n\nNot financial or legal advice. Get your own advice on employment matters.", "s": 1}, {"n": 3, "t": "I bought two businesses with no money down", "b": "I've bought two businesses. Both were 100% seller-financed.\n\nNo bank. No investors. No deposit.\n\nThe first one I bought at 25. I was unemployed, had no savings and no industry experience.\n\nIt was a physio clinic. The seller was paid over seven years at 4%, principal and interest, out of the clinic's own profit. There was a nine-month payment holiday at the start, so the business could find its feet before the first repayment.\n\nBefore that deal I had four deals fall over and made about 1,000 cold calls.\n\nSo I'm not telling you it's easy. I'm telling you the structure works.\n\nHere's why a seller says yes to being paid over time.\n\nA lot of owners in traditional industries are ready to retire. Their kids don't want the business. Their managers can't afford to buy it. A bank-funded buyer takes months and might fall over.\n\nWhat they actually want is three things: the right successor, their staff looked after, and a steady income they can count on.\n\nSeller finance gives them all three. And because they're paid over time, they can often get a higher total price than a cash buyer would pay.\n\nNow here's the part that matters if you already own a business.\n\nI did it with nothing. No track record, no team, no profit.\n\nYou've got all three. A team, systems, a history of profit, and you already know the industry.\n\nTo a retiring owner, you're the obvious successor. To a lender, you're the buyer who already knows how to run the asset.\n\nMost first-time buyers spend years building the credibility you already have. You just haven't used it yet.\n\nIf your business does $1M+ a year, answer 10 questions and see if an acquisition makes sense for you.\n\napply.grosfjeld-li.com\n\nJosh's own deals. Results aren't typical. Not financial advice.", "s": 1}, {"n": 4, "t": "Why a big loan can be easier than a small one", "b": "This sounds backwards, but a bank will often move faster on a big acquisition loan than a small one.\n\nHere's why.\n\nA bank spends roughly the same time and money assessing a $500K loan as a $5M one. Same credit team, same valuations, same lawyers. So the bigger loan is simply a better use of their time.\n\nBigger businesses are also easier to lend against.\n\n- They tend to own more: equipment, vehicles, stock, receivables. That's security.\n- They don't depend on one person. If the owner leaves, there's a team.\n- They have years of clean financials, not a shoebox of receipts.\n- On larger deals, the lender will often take security over the business's assets instead of asking you for a personal guarantee. It depends on the lender and the deal, but it's common.\n\nNow flip it around.\n\nIf you own a $1M+ business, you're not a first-time buyer with a dream and a spreadsheet. You're an operator with a track record, buying something in your own industry.\n\nThat's the profile banks actually want to fund.\n\nThe question isn't whether a bank will lend. It's whether the deal is structured so the bank can say yes. That comes down to one number: the business you buy has to earn about 1.5 times its yearly repayments.\n\nGet that right, add seller finance and a seller who keeps a stake, and the bank is funding the safest part of the deal.\n\nWe line up the financing with owners before they sign the letter of intent, so you know the structure works before you commit.\n\nIf you run a $1M+ business, see if you qualify for an acquisition strategy call. About two minutes.\n\napply.grosfjeld-li.com\n\nGeneral information, not financial advice. Every lender and deal is different.", "s": 1}, {"n": 5, "t": "The 60/40 deal", "b": "The 60/40 deal has no deposit, no seller finance and no personal guarantee.\n\nHere's how it works.\n\n60% of the price is commercial debt from a bank. 40% is seller rollover: the seller keeps a 40% stake in the business instead of taking that part in cash.\n\nYou put in nothing.\n\nThe bank is comfortable for three reasons.\n\n1. It's only funding 60%, not 90%.\n2. It takes security over 100% of the business's assets.\n3. The seller still owns 40%, so they're motivated to make the handover work.\n\nThe seller is comfortable because they get a big cheque on day one, keep a share of the profit, and get a second payday when the business sells again, usually bigger.\n\nA friend of mine, Jason Nagy, bought his first business this way: a $5.5M radiology business, zero down, 60/40. Seven years later the group sold to private equity for $200M.\n\nThat's the part people miss. The 40% stake isn't a cost. It's a partner with skin in the game while you grow.\n\nTwo things to get right:\n\n- Control. The shareholders' agreement needs drag-along rights, and no voting control or veto for the minority. Set it up properly from day one.\n- The exit. You can build in an option to buy the seller out later, say after three years at a fixed price or multiple.\n\nThis is one of three structures we use with owners. Which one fits depends on the seller, the lender and the business.\n\nIf your business does $1M+ and you want to know which structure fits your first acquisition, answer 10 questions.\n\napply.grosfjeld-li.com\n\nResults aren't typical; records on file. Not financial or legal advice.", "s": 1}, {"n": 6, "t": "The jackpot exit", "b": "Billionaires don't get rich from profit. They get rich from the multiple.\n\nHere's the maths most owners never run.\n\nA small business with $500K profit might sell for 3 to 4 times profit. Call it $1.5M to $2M.\n\nA group of businesses with $5M profit, proper management, and no single owner holding it together can sell for 8, 10, sometimes more times profit.\n\nSame type of business. Same industry. Different multiple.\n\nSo if you buy businesses at around 4 times profit, combine them, build the team that runs them, and sell the group, every dollar of profit you bought is suddenly worth twice as much or more.\n\nThat gap is the jackpot. It's called multiple arbitrage, and it's how private equity has made money for decades.\n\nYou don't need ten businesses to start using it.\n\nYour first acquisition does two things at once. It adds the new business's profit to yours. And a bigger, more diversified business is usually valued at a higher multiple than a small one.\n\nSo you're adding profit and lifting what every dollar of it is worth, in the same move.\n\nThat's why an acquisition can grow your exit value far faster than organic growth ever could.\n\nThe owners who win this game don't work harder than you. They just stopped thinking about next year's profit and started thinking about what the whole thing sells for.\n\nIf your business does $1M+ a year and you'd like to see what your first acquisition could do to your exit, apply for a strategy call.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Outcomes depend on the deals and the market. Not financial advice.", "s": 1}, {"n": 7, "t": "100% seller finance, step by step", "b": "You can buy a business where the seller funds the whole price.\n\nNo bank. No investors. No cash from you.\n\nIt's called 100% seller finance, or vendor finance. The seller is paid over time out of the business's own cash flow.\n\nHere's how it gets done.\n\nStep 1. Find the right seller. It's an owner who cares more about who takes over, their staff and a steady income than about a lump sum on day one. Usually someone close to retirement, with no succession plan.\n\nStep 2. Never say \"vendor finance\". Say \"getting paid over time\". Same thing, but one sounds like a risk and the other sounds like a pension.\n\nStep 3. Size the payments to the profit. Take the business's profit and divide by 1.5. That's the most you can pay each year and still have a buffer. A business making $250K profit can pay the seller about $166K a year. Over 10 years, that's $1.66M. Higher than most cash offers.\n\nStep 4. Put it in writing. A short offer letter: price, term, rate, any payment holiday, what security the seller holds. Two pages, not twenty.\n\nStep 5. Protect both sides. The seller usually takes security over the business until they're paid out. You build in a payment holiday at the start so the business can absorb the change.\n\nMy first deal was exactly this: seven years at 4%, a nine-month payment holiday, no deposit.\n\nThe reason owners don't do this isn't the money. It's that nobody showed them how to have the conversation, or how to put a number in front of a seller that's higher than they expected.\n\nIf you own a $1M+ business and want to buy a competitor or a retiring owner's business, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative example. Not financial or legal advice.", "s": 1}, {"n": 8, "t": "Rich vs wealthy", "b": "Most business owners are rich. Very few are wealthy.\n\nRich is income. Wealthy is assets that pay you whether you turn up or not.\n\nHere's how to tell which one you are.\n\nTake four weeks off. No calls, no email.\n\nIf revenue holds, you own an asset. If it drops, you own a job that pays well.\n\nMost $1M to $10M businesses are the second kind. Great income, built around the owner. Which means two things.\n\nYou can't stop. And when you go to sell, a buyer pays less, because the profit walks out the door with you.\n\nWealthy owners think in a different order.\n\nThey don't ask \"how do I make more this year?\" They ask \"what is this whole thing worth, and how do I make it worth more?\"\n\nAnd the fastest way to make it worth more isn't another year of growing one customer at a time. It's buying.\n\nWhen you buy a second business, you add its profit to yours, you build a team that runs both, and the group gets valued at a higher multiple than either business alone. Your income goes up. More importantly, the asset goes up.\n\nThat's the move from rich to wealthy. From a business that pays you to a group that's worth something without you.\n\nYou don't need to have the cash to start. The businesses I've bought were funded by the sellers, out of the businesses' own cash flow.\n\nIf your business does $1M+ a year and you want to turn income into an asset, answer 10 questions and see if you qualify.\n\napply.grosfjeld-li.com\n\nNot financial advice. Results depend on your business and the deals available.", "s": 1}, {"n": 9, "t": "Why most acquisitions fail", "b": "Most acquisitions that fail don't fail because of the price.\n\nThey fail for one of four reasons, and all four are visible before you sign.\n\n1. The debt was too heavy. The buyer agreed a price the business couldn't carry. Repayments ate the profit, then the cash, then the owner's sleep. The fix is one rule: the business has to earn about 1.5 times its yearly repayments. If it doesn't, change the terms or walk.\n\n2. The profit wasn't real. \"Adjusted\" profit included the owner's car, a one-off that happens every year, and a price rise that hadn't happened yet. Buy on the profit that survives due diligence, not the profit on the sales sheet.\n\n3. The owner was the business. The relationships, the quotes and the know-how sat in one head. When they left, so did the revenue. Find out who the customers call before you sign.\n\n4. The buyer couldn't absorb it. They bought something their team couldn't run alongside the existing business. Six months later, both businesses are worse.\n\nNotice what's not on the list. Not having enough cash.\n\nCash is the problem everyone worries about, and it's the one the structure solves. Seller finance, seller rollover and bank debt fund the price. The deal is over-financed so working capital and closing costs are covered.\n\nThe four real risks are judgement calls. They're what you need someone in the room for.\n\nIf you run a $1M+ business and want to buy one that won't blow up, apply for a strategy call. If we can't help, we'll tell you straight.\n\napply.grosfjeld-li.com\n\nNot financial or legal advice.", "s": 1}, {"n": 10, "t": "Your valuation is probably wrong", "b": "Your business is probably worth less than you think. Or more. Almost never what you think.\n\nHere's why.\n\nOwners value their business on what the accounts say plus what they know. Buyers value it on what survives due diligence.\n\nTake a business doing $4.2M revenue with $560K of reported profit. The owner adds back their own salary, their spouse's wage, the cars, a legal bill, a bad debt and a price rise from next month.\n\nTheir adjusted profit: about $968K.\n\nA buyer goes line by line.\n\n- The owner's salary? Someone has to run the business. Only the amount above a manager's wage comes back.\n- The spouse? She does the books. Replacing her costs money.\n- The bad debt? Same customer is still 21% of revenue.\n- The price rise? Not earned yet.\n- And the owner is on the tools two days a week, so that's a technician to hire.\n\nThe buyer's number: about $614K.\n\nAt four times profit, that's a $1.4M gap on one business.\n\nNow here's why this matters to you as a buyer, not a seller.\n\nEvery business you look at will come with a seller's number. The skill isn't negotiating the multiple. It's knowing which add-backs are real before you make an offer.\n\nGet that right and you pay for the business you're actually buying. Get it wrong and you've overpaid by a seven-figure sum before day one.\n\nIf your business does $1M+ and you're looking at buying a competitor, see if you qualify for a strategy call. We'll look at the numbers with you.\n\napply.grosfjeld-li.com\n\nIllustrative example of a fictional business. Not financial advice.", "s": 1}, {"n": 11, "t": "The best businesses are never listed", "b": "The best businesses you could buy will never appear on a listing site.\n\nHere's why.\n\nA whole generation of owners in traditional industries is getting ready to retire. Plumbing, clinics, accounting, logistics, trades. Most have no succession plan. The kids don't want it. The managers can't afford it.\n\nMost of them never go to a broker. They don't want an auction, a stranger, or their staff finding out from a listing.\n\nThey're waiting for someone to ask one question:\n\n\"Have you ever thought about selling?\"\n\nThat's it. Not an offer. Not a pitch. A question about their plans.\n\nWhen they do decide to sell, they rarely pick the highest bidder. They pick the buyer they trust to look after their staff, their customers and their name.\n\nWhich is why an owner in the same industry beats a private equity fund to these deals all the time.\n\nYou speak their language. You've hired the same kind of people. You know what their customers expect. You're not a spreadsheet; you're a successor.\n\nOff-market deals also come with less competition and more room on structure. An owner who isn't in an auction is far more open to being paid over time, or keeping a stake.\n\nMost owners I talk to have three or four of these businesses within an hour's drive. They've just never picked up the phone.\n\nIn our process, weeks three to eight are exactly this: outreach to owners on and off market, with our scripts, while we coach every conversation.\n\nIf your business does $1M+ a year, answer 10 questions and see if you qualify.\n\napply.grosfjeld-li.com\n\nResults depend on your market and the deals available.", "s": 1}, {"n": 12, "t": "Borrow a track record on LinkedIn", "b": "When I was 25 I had no track record, no network and no money.\n\nSo I borrowed a track record.\n\nHere's how.\n\nA seller asks one silent question: \"Can this person run my business and pay me?\" A bank asks the same question with more paperwork.\n\nIf you can't answer it with your own history, you answer it with the people around you.\n\nI built a board. Experienced operators who'd run businesses bigger than the one I wanted to buy. I didn't pay them cash. I offered them a small founders' stake, usually somewhere between 2% and 10% each.\n\nI found every one of them through LinkedIn and cold outreach. No introductions.\n\nThen I added a top-tier external team: proper lawyers and accountants.\n\nWhen I walked into a seller's office or a bank, I wasn't a 25-year-old with an idea. I was a company with a board and advisers. Today one of my shareholders is the founder of the Australian Institute of Fitness, and I still own 73% of my company.\n\nHere's the point for you.\n\nIf you already own a $1M+ business, you've got most of this already. A track record, a team, an accountant, a bank relationship.\n\nWhat most owners are missing is the deal experience in the room: someone who's structured acquisitions before and can sit across from a seller and a lender with you.\n\nThat's the first thing we put in place with owners. Capabilities first, then capital, then closing.\n\nIf your business does $1M+, see if you qualify for a strategy call.\n\napply.grosfjeld-li.com\n\nJosh's own experience. Results aren't typical.", "s": 1}, {"n": 13, "t": "Why most no-money-down deals fail", "b": "Most people who try to buy a business with no money down fail for one reason.\n\nNot money. Credibility.\n\nThey ring a seller, and the seller hears: \"I have no money, no experience, and I'd like your life's work. Can you lend me the price?\"\n\nThe seller says no. The bank says no. The buyer decides \"no money down\" is a scam.\n\nIt isn't. They just tried it without the one thing that makes it work.\n\nA seller who agrees to be paid over time is taking a bet on you. A bank lending against a business is taking a bet on you. Neither bet makes sense if they can't see why you'll succeed.\n\nSo credibility comes first. A track record, a team, deal experience, a clear plan for the business.\n\nHere's the twist.\n\nMost people chasing no-money-down deals are employees with none of that. They spend years building it.\n\nIf you already own a business doing $1M+ a year, you have it already. You've run payroll. You've kept customers. You've got financials a bank can read. You know the industry the seller is in.\n\nYou're the buyer these deals were designed for. Not the guy on YouTube with a spreadsheet.\n\nThe bit you're probably missing is the structure and the process: how to approach the owner, what to offer, and how to put the paper together so the bank says yes.\n\nThat's what the 90 days are for. Audit and target in weeks one and two, outreach in three to eight, negotiation and financing in nine to thirteen, then a signed letter of intent.\n\nIf your business does $1M+, answer 10 questions. Two minutes.\n\napply.grosfjeld-li.com\n\nResults aren't typical. Not financial advice.", "s": 1}, {"n": 14, "t": "What my first deal paid me in year one", "b": "In the first 12 months after my first acquisition, I pulled $150K out of it.\n\nI hadn't put a dollar in.\n\nHere's how that's possible, because it isn't magic and it isn't luck.\n\nThe deal was 100% seller-financed. The seller was paid over seven years at 4%, out of the clinic's own profit. There was a nine-month payment holiday at the start.\n\nThat holiday is the part people skip.\n\nFor nine months, the business wasn't paying the seller anything. It was building cash, getting used to a new owner, and settling in. When repayments started, the business could carry them.\n\nAnd the payments were sized so the business earned more than it owed. That's the rule: about 1.5 times the yearly repayments. The difference is yours.\n\nSo year one looked like this: the business ran, the seller was paid on schedule, and the surplus came to me. Over time, as the debt came down, the equity went up. That first deal is now worth mid six figures in equity to me.\n\nI'm not saying you'll get the same. Every deal is different, and plenty of things can go wrong.\n\nI'm saying the structure exists. The seller and the business fund the purchase, and the surplus is yours.\n\nIf you already own a business doing $1M+ a year, you're starting from a much stronger place than I was at 25.\n\nSee if you qualify for an acquisition strategy call. 10 questions.\n\napply.grosfjeld-li.com\n\nJosh's own deal; records on file. Results aren't typical. Not financial advice.", "s": 1}, {"n": 15, "t": "What brokers won't tell you", "b": "When a business goes to a broker, the price goes up and your options go down.\n\nThat's not a criticism of brokers. It's their job.\n\nA broker is paid by the seller, usually as a percentage of the sale price. Their job is to get the highest price, as cash, from the most buyers, as fast as possible.\n\nSo a listed business comes with:\n\n- An auction. You're competing against other buyers, sometimes private equity.\n- A price anchored on the seller's best-case \"adjusted\" profit.\n- Little appetite for creative structure. Seller finance and rollover reduce the broker's cash at settlement.\n- A timeline set by someone else.\n\nOff-market is a different game.\n\nSame business, no auction. You talk to the owner directly. You ask what they actually want: who takes over, what happens to their staff, how they'd like to be paid.\n\nOften the answer isn't \"the most cash today\". It's \"a fair price, paid reliably, to someone I trust\".\n\nThat's where seller finance works. A business making $250K profit can comfortably pay a seller about $166K a year. Over ten years, that's $1.66M, often more than the broker's cash price.\n\nThe seller gets more. You put in nothing. The business pays for itself.\n\nI became the youngest person in Australia to close a no-money-down healthcare deal, and I didn't do it through a broker.\n\nIf your business does $1M+ and you want to find deals before they're listed, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Not financial advice.", "s": 1}, {"n": 16, "t": "Why the wealthy use holding companies", "b": "Wealthy owners almost never own their businesses directly.\n\nThey own a company that owns the businesses.\n\nHere's why that matters more as soon as you buy your second one.\n\nRisk stays where it belongs. Each business sits in its own company. If one has a bad year, a lawsuit or a lender problem, it doesn't drag the others down.\n\nCash moves where it's needed. Profit from one business can fund the next acquisition, or a slow month somewhere else, without you taking it out personally first.\n\nThe exit is cleaner. A buyer can purchase one business, or the whole group. Private equity likes buying a group with one structure, one board and one set of numbers.\n\nShared costs get cheaper. One finance team, one payroll, one IT setup serving several businesses. That's margin you didn't have to sell for.\n\nMost owners set this up too late, after the second deal, when restructuring costs money and tax.\n\nThe better order: decide what the group looks like before you buy, and buy into that structure from day one.\n\nThis is part of what we map with owners on the strategy call. Not just \"which business to buy\", but how it sits in a group that's worth more than its parts when you sell.\n\nIf your business does $1M+ a year and you're thinking about a second one, answer 10 questions and see if you qualify.\n\napply.grosfjeld-li.com\n\nGeneral information. Not financial, legal or tax advice; get your own advice on structure.", "s": 1}, {"n": 17, "t": "Start with money in the bank", "b": "The best acquisitions start with money in the bank, not a hole in it.\n\nIt's called an over-financed acquisition.\n\nHere's how it works.\n\nThe price is covered by three sources: commercial debt from a bank, seller finance paid over time, and seller rollover where the seller keeps a stake.\n\nThen the lender adds a working-capital line on top.\n\nSo the total funding is more than the price. The extra pays the closing costs (lawyers, accountants, stamp duty) and leaves working capital in the business from day one.\n\nSay you agree $1.5M for a competitor making $500K profit. The bank, the seller's note and the rollover cover the $1.5M. The working-capital line covers costs and gives the business a buffer for its first few months under you.\n\nYou put in nothing, and you start with cash.\n\nWhy does the lender agree?\n\nBecause the business can carry it. The rule is about 1.5 times: the business has to earn $1.50 for every $1 it owes each year. The buffer isn't a gift; it's what makes the first year safe for everyone, including the bank.\n\nCompare that to how most people buy a business: drain their savings for a deposit, then discover in month two that the debtors take 60 days to pay and payroll is due on Friday.\n\nWe line up the financing with owners before they sign the letter of intent, so you know the structure works before you commit.\n\nIf your business does $1M+, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative example. Not financial advice. Every lender and deal is different.", "s": 1}, {"n": 18, "t": "Buying without a personal guarantee", "b": "Most owners assume buying a business means putting their house on the line.\n\nIt doesn't have to.\n\nA personal guarantee is the bank asking: \"If the business can't pay, can you?\" They ask because they don't feel secure enough without it.\n\nSo the way to avoid one is simple in principle: give the lender better security somewhere else.\n\nThree ways that usually happens:\n\n1. Security over the business's assets. The lender takes a charge over 100% of what the business owns: equipment, vehicles, receivables, stock.\n2. Less senior debt. If the bank funds 60% instead of 90%, its risk drops a lot.\n3. A seller who stays in. When the seller keeps a meaningful stake, the bank knows the person who built the business still wants it to work.\n\nThat's exactly what our 60/40 structure does: 60% commercial debt, 40% seller rollover, security over the business's assets, and no personal guarantee from you.\n\nLarger deals often don't need one at all, especially in asset-rich businesses. It depends on the lender and the deal, but it's far more common than owners think.\n\nWhy this matters: the fear of losing the house is the main reason good operators never buy a second business. They'd rather grow slowly than risk everything.\n\nYou don't have to choose between the two.\n\nIf you run a $1M+ business and want to buy one without risking your home, see if you qualify for a strategy call.\n\napply.grosfjeld-li.com\n\nGeneral information, not financial or legal advice. Every lender and deal is different.", "s": 1}, {"n": 19, "t": "Make the seller your partner", "b": "The cheapest money in an acquisition isn't the bank's.\n\nIt's the seller's stake.\n\nIt's called seller rollover. Instead of taking the whole price in cash, the seller keeps a slice of the business, say 10% or 40%, and rolls it into the new company.\n\nHere's why it works for everyone.\n\nFor you: that part of the price doesn't need to be funded. No cash, no extra debt.\n\nFor the bank: the person who built the business still owns part of it, so the handover is in their interest too.\n\nFor the seller: they keep a share of the profit, stay involved as long as they like, and get a second payday when the business sells again. If you grow it and sell the group at a higher multiple, their slice can be worth more than the cash they gave up.\n\nTwo questions owners always ask.\n\n\"Can I buy them out later?\" Yes. Build in an option, for example after three years at a fixed price or a fixed multiple. It can trigger on time or on the size of the business.\n\n\"Can a minority holder block me?\" Not if it's set up properly. Drag-along rights in the shareholders' agreement, and no voting control or veto for the minority. Do it on day one, with a good lawyer.\n\nDone right, rollover turns the seller from someone you're paying off into a partner who wants you to win.\n\nIf your business does $1M+ and you're looking at a competitor or a retiring owner, answer 10 questions and see if you qualify.\n\napply.grosfjeld-li.com\n\nNot financial or legal advice. Get your own advice on shareholder agreements.", "s": 1}, {"n": 20, "t": "The 1.5 rule", "b": "There's one number that decides whether an acquisition makes you money or keeps you up at night.\n\n1.5.\n\nIt's the debt service coverage ratio, or DSCR. The business's cash profit divided by its yearly loan repayments.\n\nAt 1.5, the business earns $1.50 for every $1 it owes. The deal pays for itself, with a 50% buffer for a bad month, a lost customer or a slow quarter.\n\nHere's how to use it.\n\nTake the profit of the business you want to buy. Divide by 1.5. That's the most it can repay each year, across the bank and the seller combined.\n\nA business making $500K profit can carry about $333K a year in repayments.\n\nNow work backwards. If you agree $1.5M, split between the bank, a seller note and a seller stake, do the yearly repayments come in under $333K? If yes, the deal works. If not, you change the terms (longer seller note, more rollover, a payment holiday) or you walk.\n\nWhat you don't do is make up the gap from the business you already own.\n\nThat's the mistake. Owners buy a second business and quietly prop it up with the first. Now neither is safe.\n\nAt 1.5, the new business stands on its own. Lenders are comfortable. Sellers get paid. And the surplus is yours.\n\nIt's the one rule we never break with owners.\n\nIf your business does $1M+ a year and you want to see what a fundable acquisition looks like for you, see if you qualify. 10 questions, two minutes. And if you join and it isn't right for you in the first 7 days, you get a full refund.\n\napply.grosfjeld-li.com\n\nIllustrative example. Not financial advice.", "s": 1}, {"n": 21, "t": "The cold call that finds off-market deals", "b": "The best acquisition you'll ever make probably starts with a 20-second phone call.\n\nMost owners never make it. Or they make it badly: two minutes of small talk, then a price to sound serious.\n\nHere's the call, word for word.\n\n\"Hi [name], this is [your name] with [your company]. I'm building a company in [industry] and wanted to introduce myself. Have you ever thought about selling [business]?\"\n\nThat's it.\n\nName and company, so you sound like a business. \"Building a company in your industry\", so you sound like a buyer with a plan. \"Wanted to introduce myself\", which says relationship, not one-off.\n\nThen the question. It's soft on purpose.\n\n\"Are you looking to sell?\" is a yes-or-no about today, and today the answer is nearly always no.\n\n\"Have you ever thought about selling?\" lets them tell you about the bad year, the sore back, the kids who don't want it.\n\nThree answers come back.\n\nYes, actually. Don't pitch. Ask \"What's got you thinking about it?\" and stop talking.\n\nNot right now. \"No problem. I'm building relationships in the industry. Mind if I check back in six months?\" Put the date in your diary.\n\nNo. \"No worries, thanks for your time.\" Next call.\n\nAnd never say a number on the first call. The first number you say becomes the number.\n\nIf you already run a $1M+ business in the industry, you're the most credible person who could make this call. You're not a broker or a fund. You're the obvious successor.\n\nIn our 90 days, weeks three to eight are exactly this, with our scripts and us coaching every conversation.\n\nIf your business does $1M+ a year, answer 10 questions and see if you qualify.\n\napply.grosfjeld-li.com\n\nResults depend on your market and the deals available.", "s": 2}, {"n": 22, "t": "One cold call to a $3.8M business", "b": "One cold call. No broker. A signed NDA on a $3.8M business.\n\nSaul, one of our Owners Academy members, rang the owner of an electrical and air-con business directly. 25 staff, about $3.8M in revenue, owner retiring in two years.\n\nThe business wasn't listed. There was no auction. Nobody else was in the room.\n\nHere's what happened, in the order the owner saw it.\n\n1. The call. Short. Who you are, why you're calling, one question: \"Have you ever thought about selling?\"\n\n2. The NDA. When the owner said maybe, the NDA went out the same day. Not next week. An owner's interest cools fast. And an owner who won't sign a simple NDA probably isn't ready to sell.\n\n3. The document request. Three years of financials, the matching tax returns, and revenue broken down by year. An owner who sends them is serious.\n\n4. The conversation about what they want. Not price first. Who takes over, what happens to the staff, how they'd like to be paid.\n\n5. The offer. Only after the documents.\n\nThe deal is in early due diligence. It hasn't closed, and I'm not pretending it has. That's the point. This is what the start looks like, and most people never get here because they're scrolling listing sites.\n\nThe best businesses get bought, not found on a website.\n\nIf you already own a $1M+ business, you have an advantage Saul had to build: you're in the industry, with a team and a track record. A retiring owner sees a successor, not a stranger.\n\nIf your business does $1M+ a year, see if you qualify for an acquisition strategy call.\n\napply.grosfjeld-li.com\n\nMember's deal shared with permission. In due diligence, not closed. Results aren't typical.", "s": 2}, {"n": 23, "t": "How to pick the industry for a roll-up", "b": "The industry you pick decides most of your roll-up before you buy anything.\n\nPick well and banks lend, sellers say yes, and the group sells at a higher multiple. Pick badly and you fight the industry every year.\n\nHere's what I look for.\n\n1. Lots of small owners. You want a fragmented industry with hundreds of businesses doing $1M to $10M. That's your pipeline.\n\n2. Owners getting ready to retire. A generation in traditional industries is ready to step back, with no succession plan. They're the sellers who say yes to being paid over time.\n\n3. Boring, steady demand. Health, trades, accounting, maintenance. People need it in a good year and a bad one. Banks love that.\n\n4. Something to lend against. Equipment, vehicles, receivables, contracts. Asset-rich businesses give a lender security without a personal guarantee from you.\n\n5. A reason the group is worth more than the parts. Shared back office, shared buying, a brand, a manager layer. That's what lets you buy at around 4 times profit and sell the group for more.\n\n6. You understand it. If you already run a business in the industry, you know what a good one looks like from the inside. That's worth more than any spreadsheet.\n\nMost owners already sit in an industry that ticks four or five of these. They just think of their competitors as competition, not as a pipeline.\n\nI built my group in healthcare. The same logic works in plumbing, HVAC, accounting, vet clinics, cleaning and plenty more.\n\nIf your business does $1M+ a year and you want to know whether your industry suits a roll-up, answer 10 questions.\n\napply.grosfjeld-li.com\n\nGeneral information. Not financial advice.", "s": 2}, {"n": 24, "t": "Buy your competitor", "b": "The fastest way to double your business is usually sitting a few kilometres away.\n\nIt's your competitor.\n\nBuying a competitor means their revenue, their team and their customers join yours in one move. No five-year plan. One deal.\n\nAnd it's often cheaper than it looks, because two businesses in the same industry share more than you think.\n\nWhere the money comes from:\n\n- One back office. One payroll, one bookkeeper, one software stack instead of two.\n- Better buying. Twice the volume with the same suppliers.\n- Fuller schedules. Your team and theirs, routed together.\n- Cross-selling. Their customers buy your services, yours buy theirs.\n- A higher multiple. A bigger, more diversified business is usually valued at more times profit than either one alone.\n\nHow to approach them:\n\nNot as a rival. As a successor. \"I'm building a group in the industry. Have you ever thought about what happens to the business when you step back?\"\n\nCompetitors often respect each other more than they let on. Many would rather hand over to someone who knows the trade than to a fund.\n\nHow it's paid for:\n\nSenior debt from a bank, seller finance paid over time, and seller rollover where they keep a stake. Little or none of your own cash. The business you buy has to carry its own repayments, about 1.5 times over, so it never leans on yours.\n\nThe owners who grow fastest stopped seeing competitors as competition. They see them as the pipeline.\n\nIf your business does $1M+ a year and there's a competitor you've always wondered about, see if you qualify for a strategy call.\n\napply.grosfjeld-li.com\n\nResults depend on the deal and the market. Not financial advice.", "s": 2}, {"n": 25, "t": "Questions to ask a seller before you make an offer", "b": "The questions you ask a seller decide what you'll pay more than any negotiation ever will.\n\nAsk these before you say a number. Five areas.\n\n1. Why are you selling?\nRetirement, health, burnout, a partner leaving. The real reason tells you how flexible they'll be on price, timing and how they get paid. \"I'm tired\" is a very different seller to \"I need the cash by June.\"\n\n2. How reliable are the earnings?\nThree years of financials and the matching tax returns. If the two don't agree, ask why before you go any further.\n\n3. How much does the business depend on you, and on any one customer?\nWho do the top clients call? Who quotes the jobs? What share of revenue is the biggest customer? Above about 30% is a risk you'll need to deal with in the structure.\n\n4. What's going on that I can't see yet?\nLeases, disputes, contracts that end if the business changes hands, equipment that's overdue for replacement, staff entitlements owed.\n\n5. How would you like to be paid?\nThis is the one most buyers skip. Plenty of owners care more about the right successor, their staff and a steady income than a lump sum on day one. If they'd consider being paid over time, or keeping a stake, the deal changes completely.\n\nThen listen. The seller will tell you how to buy their business if you let them.\n\nThe mistake is going in with a price. The win is going in with questions.\n\nIf your business does $1M+ and you're ready to start these conversations, see if you qualify. We coach every one of them with you.\n\napply.grosfjeld-li.com\n\nGeneral information. Not financial or legal advice.", "s": 2}, {"n": 26, "t": "Never name a price before these 3 documents", "b": "The P&L says $500K profit. The tax return says $350K.\n\nAt four times profit, that gap is $600K of price.\n\nWhich is why I have one rule when buying a business: no documents, no number.\n\nThe first number you say becomes the anchor for the whole deal. Say it too early and every conversation after is you climbing down from it.\n\nBefore any price, ask for three things.\n\n1. Three years of financials. Profit and loss plus balance sheet. One year can be a fluke: a big contract, a bad winter, an insurance payout. Three shows the pattern. The balance sheet tells you what the business owes: tax, staff entitlements, equipment loans. Those become your problem on settlement day.\n\n2. The matching tax returns. This is the one that sets the price. The financials are what the owner tells you. The tax return is what the owner told the government. If they don't match, one of them is wrong, and banks only lend against what can be proven.\n\n3. Revenue broken down by year. By service line and by customer if you can get it. It shows you what's growing, what's shrinking, and how much depends on one client.\n\nAnd the way a seller sends them tells you more than anything they say on the phone. Fast and complete: a serious seller. Slow and partial: a story you'll be paying for.\n\nMost buyers think naming a number early shows they're serious. It doesn't. It shows the seller you'll pay for a story.\n\nIf your business does $1M+ and you're looking at a competitor, see if you qualify. We'll go through the numbers with you before you offer anything.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Not financial advice.", "s": 2}, {"n": 27, "t": "Steal this offer structure", "b": "The offer that gets a 100% seller-financed deal signed fits on two pages.\n\nNot a 40-page contract. Two pages.\n\nHere's what's on them.\n\n1. The price. One number, based on profit you've verified, not the seller's adjusted figure.\n\n2. How it's paid. This is where most buyers get it wrong. They write \"$1.5M\" and stop. Write the shape instead: how much at settlement, how much paid over time, over how many years, at what rate, and whether there's a payment holiday at the start.\n\n3. The security. What the seller holds until they're paid out, usually security over the business itself. This is what makes \"paid over time\" feel safe to them.\n\n4. The handover. How long they'll stay, in what role, and what they're paid for it.\n\n5. Conditions and timing. Due diligence, finance, a target settlement date, exclusivity while you do the work.\n\nNow the bit that gets it signed.\n\nSize the payments to the profit. Take the business's profit and divide by 1.5. That's what it can pay each year and still have a buffer. A business making $250K profit can pay about $166K a year. Over ten years, $1.66M. Often more than a cash buyer would offer.\n\nAnd never write \"vendor finance\" in the letter. Write \"paid over time\". One sounds like a risk. The other sounds like a pension.\n\nMy own first deal was this shape: seven years at 4%, a nine-month payment holiday, no deposit.\n\nIf your business does $1M+ and you want help writing your first offer, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative example. Not financial or legal advice. Get a lawyer on every offer.", "s": 2}, {"n": 28, "t": "The letter of intent", "b": "The letter of intent is the most important document in a business purchase, and most buyers treat it as a formality.\n\nAn LOI is a short document where buyer and seller agree the main terms before full due diligence and contracts. Price, funding, timing, exclusivity, key conditions.\n\nMost of it isn't binding. But it sets the frame for everything after it. Whatever isn't in the LOI, you'll be fighting for later, from a weaker position.\n\nWhat goes in mine:\n\n- Price and how it's calculated. A multiple of verified profit, so if diligence finds less profit, the price moves with it.\n- The funding shape. Bank debt, seller finance, seller rollover. The seller should see exactly how they get paid.\n- Working capital. What level of debtors, stock and creditors comes with the business, so the seller can't empty it before settlement.\n- Exclusivity. 60 to 90 days where they can't shop your deal to someone else. This part is usually binding.\n- Conditions. Due diligence, finance approval, key staff and lease transfers.\n- The handover. How long the seller stays and what they do.\n- Confidentiality. Also usually binding.\n\nHere's why it matters so much. An LOI with clear structure gets you a seller who's mentally sold, a lender who can see the deal, and 60 to 90 days of exclusivity to do the work properly.\n\nA vague LOI gets you a seller who's still shopping.\n\nThe whole point of our 90 days is getting owners to a signed LOI on an acquisition that can double or triple their business, with the financing lined up before they sign.\n\nIf your business does $1M+ a year, see if you qualify.\n\napply.grosfjeld-li.com\n\nNot legal advice. Have a lawyer review every LOI.", "s": 2}, {"n": 29, "t": "Due diligence red flags", "b": "Due diligence isn't about finding a perfect business. There isn't one.\n\nIt's about finding out what the business is actually worth before you've paid for what the seller says it's worth.\n\nThe red flags I look for first:\n\n1. Earnings that don't match the bank statements. If the P&L says one thing and the deposits say another, stop.\n\n2. Add-backs with no evidence. \"That was a one-off\" should come with paperwork. If it happens every year, it isn't a one-off.\n\n3. One customer carrying the business. Above about 30% of revenue from one client is a risk you price or structure for.\n\n4. The owner is the business. If the top clients call the owner's mobile, the relationships may walk out with them.\n\n5. Contracts that end on a sale. Some customer contracts and leases have change-of-control clauses. Read them.\n\n6. Deferred spending. Vans that should have been replaced two years ago. That cost lands on you in year one.\n\n7. Debts you weren't told about. Tax owed, staff leave owed, equipment finance, disputes. On settlement day, they're yours unless the deal says otherwise.\n\n8. Profit that isn't turning into cash. If debtor days are stretching every year, the profit is sitting in other people's bank accounts.\n\nA red flag isn't always a reason to walk. Often it's a reason to change the price, the structure, or who carries the risk.\n\nThat's the skill. Not spotting the problem, but knowing what to do with it.\n\nIf your business does $1M+ and you want someone in the room for this part, see if you qualify.\n\napply.grosfjeld-li.com\n\nGeneral information. Not financial or legal advice.", "s": 2}, {"n": 30, "t": "Three negotiation mistakes that cost $500K", "b": "Two buyers look at the same business. $300K profit. The seller asks both for $2.5M.\n\nOne pays it. The other says \"No worries. Good luck.\" and ends up with the better deal.\n\nOn this business, $500K of price is the difference between covering the repayments 1.5 times and 1.2 times. At 1.5, a slow year is uncomfortable. At 1.2, you're borrowing to pay the seller.\n\nHere are the three mistakes that cost the first buyer half a million.\n\n1. One deal in the pipeline.\nHe'd spent three months on it. Told his partner. Pictured day one. When the seller asked for more, he heard himself say \"I'll see what I can do.\"\n\nA buyer with five live deals can leave, and sellers can tell. Never fewer than three live conversations.\n\n2. No number before the meeting.\nNegotiating isn't a personality. The buyer who wins did the maths first: profit divided by 1.5 is the most the business can repay each year. That sets your ceiling. Write it down before you walk in.\n\n3. No time limit.\nThe best tactic in a negotiation is walking away. The second best is a deadline. \"This offer stands for 24 hours.\" Open-ended offers get shopped to the next buyer.\n\nWalk-away power isn't a tactic on the day. It's a position you build before the meeting: a pipeline, a number, and people around you who'll say \"this one's not it\" when you're too close.\n\nIf your business does $1M+ and you want someone beside you when a seller pushes, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Not financial advice.", "s": 2}, {"n": 31, "t": "Two deals in 23 days", "b": "My good friend Cam closed two acquisitions in 23 days.\n\nBoth 100% vendor finance. Interest-only for ten years, with balloon payments in years three and ten. And $500K of working capital from the bank on top.\n\nPeople hear that and think he rushed. He didn't. Speed like that is built before day one.\n\nHere's what made it possible.\n\n1. The buyer question was already answered. Before any number, a seller asks: who is this person? A credible team, a one-page summary, a proper offer on letterhead. When that's sorted before the first call, a seller can decide in days.\n\n2. The right documents on the first serious call. Three years of financials, matching tax returns, revenue by year. Diligence starts that week, not a month later.\n\n3. The offer was shaped for the seller. Interest-only payments keep the business's repayments low while it settles in. Balloons in years three and ten give the seller lump sums to look forward to.\n\n4. The money was lined up before it was needed. The bank conversation happened early, so the working capital wasn't a question mark at the end.\n\nWhy it matters: a bank-funded deal often takes 6 to 16 weeks. Vendor finance can close in 2 to 4. Every extra week is a week for the seller to cool off, staff to hear rumours, or another buyer to turn up.\n\nIf you already run one business, you don't have months of spare evenings to drag a deal out. You need the preparation done so you can move when a seller says yes.\n\nIf your business does $1M+ a year, see if you qualify for an acquisition strategy call.\n\napply.grosfjeld-li.com\n\nA friend's deals, shared with permission. Results aren't typical; records on file. Not financial advice.", "s": 2}, {"n": 32, "t": "The offer that pays a seller for life", "b": "Some sellers don't want a price. They want an income.\n\nA friend of mine in the US, Elliot, built offers around that idea. He sent about 40 of them. Three sellers signed letters of intent. All 100% seller finance, on 99-year terms.\n\nOne example: a business making $500K a year, and the seller paid $350K a year for life.\n\nThink about it from a 65-year-old owner's side.\n\nOption A: a lump sum. Say four times profit. Then a new job at 65: investing it, protecting it, making it last. Most of them have never managed a pile of money. They've managed a business that paid them.\n\nOption B: an income for life, paid out of profit, the way they've been paid for thirty years.\n\nA lot of them pick B.\n\nFor the buyer: no deposit, no bank, and a business that pays for itself from day one. Every dollar of growth above the payment is yours.\n\nThe catch is real. Over a long life you can pay out far more in total than a cash price. So this is for operators who will grow the business, not hold it flat. And it isn't for a seller who needs cash now.\n\nBut notice what changed. Not the business. Not the buyer. The shape of the offer.\n\nMost buyers send a price, a deposit and a wait for the bank. The market has moved. A generation of owners wants out, and they want to be looked after.\n\nIf your business does $1M+ and you want to know which offer shape fits the owners in your industry, see if you qualify.\n\napply.grosfjeld-li.com\n\nA friend's deals. Results aren't typical. Not financial or legal advice.", "s": 2}, {"n": 33, "t": "The bank funded all of it", "b": "Christian Dawes was unemployed. No higher education. A criminal record.\n\nHis first acquisition was $2.4M, and the bank funded all of it. More than all of it.\n\nI share his story because it kills the most common excuse I hear: \"Banks won't lend to someone like me.\"\n\nBanks don't lend to your past. They lend to a business's cash flow.\n\nHere's what a credit team actually reads, in order.\n\n1. The ask. How much, over how long, for what. A vague ask reads as a vague buyer.\n\n2. Serviceability. Can the business repay the debt from its own cash, with room to spare? My rule is the business earns at least 1.5 times its yearly repayments. That one ratio does more for an application than anything on a CV.\n\n3. Security. What the bank can hold: equipment, receivables, the business itself.\n\n4. Management. Who's running it. A credible team around you answers this.\n\n5. The extra. A working-capital line on top of the price, so the business starts with cash.\n\nNow apply that to you.\n\nIf you already own a business doing $1M+ a year, you walk into that bank with more than Christian had. A track record, financials, a team, an existing banking relationship.\n\nThe question isn't whether a bank will lend to you. It's whether you put the right deal in front of them, structured the right way.\n\nIf your business does $1M+, see if you qualify. We line up the financing with you before you sign the LOI.\n\napply.grosfjeld-li.com\n\nAn example I use, not a client. Results aren't typical. Not financial advice.", "s": 2}, {"n": 34, "t": "A board in under 30 days", "b": "Jy Kingston came from IT. No finance background. No deal experience.\n\nHe built a board in under 30 days.\n\nThen he had accountants and lawyers on board within about two weeks, and 12 deals active. He's working through his first close now.\n\nJy is one of my students. I share his story because most people think credibility takes years. It doesn't. It takes a plan and a LinkedIn account.\n\nHere's the method.\n\n1. Write a one-page executive summary. What you're building, which industry, what you're looking for. One page, not a business plan.\n\n2. Find experienced operators. People who've run businesses bigger than the one you want to buy. LinkedIn, cold emails, mutual contacts.\n\n3. Offer equity, not cash. A small founders' stake, usually between 2% and 10% each, for their name, their advice and their time when it matters.\n\n4. Add a proper external team. Lawyers and accountants who've done acquisitions before.\n\nWhen you walk into a seller's office or a bank with that behind you, you're not a person with an idea. You're a company with a board.\n\nNow, if you already own a $1M+ business, you're starting a long way ahead of Jy. You have the track record already. What you usually don't have is acquisition experience in the room. That's the gap we fill first.\n\nIf your business does $1M+ a year, see if you qualify for a strategy call.\n\napply.grosfjeld-li.com\n\nA student's progress, shared with permission. Results aren't typical.", "s": 2}, {"n": 35, "t": "The structure most retiring owners like", "b": "There's one deal structure that retiring owners say yes to more than any other.\n\n70/20/10.\n\n70% of the price is commercial debt from a bank. 20% is seller finance, paid over a few years from the business's cash flow. 10% is seller rollover: the seller keeps a 10% stake.\n\nYou put in nothing.\n\nWhy sellers like it:\n\n- 70% in cash on settlement day. Most of their money, straight away.\n- 20% paid over time, with interest. A steady income for the next few years.\n- 10% still theirs. A share of the profit, and a second payday when the business sells again.\n\nWhy banks like it:\n\n- They're funding 70%, not 100%.\n- The seller has 30% still riding on the business, so they want the handover to work.\n\nWhy you like it:\n\n- No deposit.\n- The seller stays motivated through the handover.\n- Lenders often add a working-capital line on top, so the deal is over-financed and the business starts with cash.\n\nThe rule that holds it together: the business you buy has to earn about 1.5 times its yearly repayments to the bank and the seller combined. If it doesn't, change the split or the term before you sign.\n\nWe use three structures with owners: 70/20/10, 60/40, and 100% vendor finance. Which one fits depends on the seller, the lender and the business. Picking the right one is half the deal.\n\nIf your business does $1M+ and you want to know which structure fits your first acquisition, see if you qualify.\n\napply.grosfjeld-li.com\n\nGeneral information. Not financial advice. Every lender and deal is different.", "s": 2}, {"n": 36, "t": "A 10% price rise vs 10% more customers", "b": "On a $2M business, 10% more customers adds about $80K of profit.\n\nA 10% price rise adds about $200K.\n\nSame revenue. More than double the profit.\n\nHere's the maths.\n\nOption A: win 10% more customers. Revenue goes from $2M to $2.2M. But every new job has a delivery cost. At a 40% gross margin, $200K of new revenue leaves $80K. Then you pay to win those customers. Say 40 new customers at $2K each to acquire: another $80K. In year one, the volume play nets close to nothing.\n\nOption B: raise prices 10%. Same $2.2M of revenue. Same jobs, same crews, same materials. The extra $200K lands almost entirely as profit. You go from $250K to about $450K.\n\nAnd for the sceptic: at a 40% gross margin, a 10% price rise still breaks even if one in five customers walks. Most businesses lose far fewer.\n\nNow the part that matters if you're buying businesses.\n\nProfit sets the price of a business, not revenue. At four times profit, $200K of extra profit is $800K of extra value. And it makes every repayment to the bank and the seller safer from the first month.\n\nThat's why professional buyers look at the price list before they look at marketing. A lot of boring businesses are sitting on prices from years ago while costs rise every year. Buy one of those, fix the price list, and the deal you did at four times looks a lot cheaper.\n\nIf your business does $1M+ and you want to buy one with room to grow like this, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Not financial advice.", "s": 2}, {"n": 37, "t": "One customer is 30% of the revenue", "b": "You find a great business. Good margins, good staff, $600K of profit.\n\nThen you see it. One customer is 30% of the revenue.\n\nMost buyers do one of two things. They walk away, or they ignore it and hope.\n\nBoth are wrong. Concentration isn't a reason to walk. It's a reason to structure.\n\nHere's why it matters. If that customer leaves, a business with $600K of profit can fail its debt repayments the month they go. The bank knows it. So should you.\n\nThree checks first.\n\n1. Top-two customer share. Above about 30%, it's a risk you deal with in the deal.\n2. Contract and term left. Is the big customer under a signed contract, and for how many months?\n3. Who holds the relationship. Does the customer call the business, or the owner's mobile?\n\nThen structure for it.\n\n- Tie part of the price to the customer staying. If they renew, the seller gets paid in full. If they leave, the price adjusts.\n- Keep the seller in. A rollover stake, or a paid handover where the seller introduces you properly. The person who holds the relationship has a reason to keep it.\n- Size the debt to the business without that customer. If the deal still covers its repayments in the bad case, you can sleep.\n\nDone well, the risk the seller is worried about becomes the reason they accept your structure.\n\nIf your business does $1M+ and you're looking at a competitor with a big customer, see if you qualify. We'll help you work out the structure.\n\napply.grosfjeld-li.com\n\nIllustrative example. Not financial or legal advice.", "s": 2}, {"n": 38, "t": "Profit doesn't pay the seller. Cash does.", "b": "You can buy a profitable business and still run out of money in month three.\n\nBecause profit doesn't pay the seller. Cash does.\n\nHere's where it hides.\n\nTake a business with $2M of revenue where customers take 60 days to pay. At any moment, they owe the business about $330K.\n\nGet that down to 30 days and they owe about $165K.\n\nThat's $165K of cash released, once, without winning a single new customer. If you're paying the seller around $16,700 a month, that's about ten months of payments sitting in your customers' bank accounts.\n\nHow to get it back:\n\n1. Invoice the day the job's done, not at the end of the month.\n2. Shorter terms for new customers. 14 days where the market allows.\n3. Deposits on bigger jobs.\n4. Someone who owns collections, with a weekly list of who owes what.\n5. Card or direct debit for repeat customers.\n\nNone of it is clever. Most owners just never had the time to do it, because they were busy running the business.\n\nThis is one of the first things I look at after an acquisition. It's quiet, customers barely notice, and it turns into cash that makes every repayment safer.\n\nIt's also why a good deal is over-financed with a working-capital line on top. The business starts with cash in the bank, not a hole in it.\n\nIf your business does $1M+ and you want to buy one the right way, see if you qualify.\n\napply.grosfjeld-li.com\n\nIllustrative numbers. Not financial advice.", "s": 2}, {"n": 39, "t": "Decide at 60%", "b": "Your biggest problem probably isn't skills. It's waiting to feel ready.\n\nThere is never a perfect moment to buy a business.\n\nThe market's uncertain. Rates might move. Your team's stretched. The kids are young. Next year will be better.\n\nNext year has the same list.\n\nHere's the rule I use: decide at 60%.\n\nAt 60% of the information, you can make a good decision. Waiting for 100% means the deal's gone, or someone else bought it.\n\nAnd there are two kinds of risk.\n\nActive risk is the one you can see. You buy a business and it might not work. That one you can manage: due diligence, the 1.5 rule, a structure that doesn't lean on your existing business, people around you who've done it before.\n\nPassive risk is the one nobody talks about. You don't buy anything. You keep growing one customer at a time. Five years pass. A competitor buys the business you should have bought. Your business is a bit bigger and you're a lot more tired.\n\nMost owners only count the first one.\n\nThe owners I've seen do well weren't the smartest or the richest. They were the ones who made a decision before they felt ready, and then made it work.\n\nIf your business does $1M+ a year, the first decision is small. Answer 10 questions and see if you qualify. If we can help, we'll show you how. If we can't, we'll tell you straight.\n\napply.grosfjeld-li.com\n\nResults depend on your business and the deals available.", "s": 2}, {"n": 40, "t": "How many offers have you sent?", "b": "You've been watching content about buying businesses for months.\n\nHow many offers have you sent?\n\nI'm not having a go. Everything you need to learn this is out there for free. I'll say that openly. The model isn't a secret.\n\nBut there are three things that decide whether it works for you, and information is only one of them.\n\nTime. A few focused hours a week, protected, every week. Not \"when things calm down\".\n\nMoney. Less than you'd think. The structures exist so the deal funds itself.\n\nEnergy. This is the one that decides it. Where your energy goes decides whether this works.\n\nI've watched people pay serious money for advice and still never send an offer. I've watched people with nothing make a thousand calls and close.\n\nThe difference isn't knowledge. It's that someone made them do the next thing, then the next.\n\nThat's what the 90 days are for.\n\nWeeks one and two: we audit your business with you and set the target profile.\nWeeks three to eight: you run outreach to owners with our scripts while we coach every conversation.\nWeeks nine to thirteen: we're in the room as you negotiate, we line up the financing with you, and you sign the letter of intent.\n\nDone with you, not for you. You're the buyer, so sellers and lenders need to deal with you.\n\nAnd if you join and decide in the first 7 days it isn't for you, you get a full refund.\n\nIf your business does $1M+ a year, stop watching and answer 10 questions. Two minutes.\n\napply.grosfjeld-li.com\n\nResults aren't typical and depend on your business, market and the deals available.", "s": 2}];
const LINK = "apply.grosfjeld-li.com";
let store = {};
try { store = JSON.parse(localStorage.getItem("posted") || "{}"); } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem("posted", JSON.stringify(store)); } catch (e) {} };
let set = 0, q = "";

function withoutLink(b){ return b.split("\n").filter(l => l.trim() !== LINK).join("\n").replace(/\n{3,}/g, "\n\n").trim(); }

async function copy(text, btn, label){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  btn.textContent = ok ? "Copied" : "Select the text to copy";
  btn.classList.toggle("copied", ok);
  setTimeout(() => { btn.textContent = label; btn.classList.remove("copied"); }, 1600);
}

function render(){
  const list = document.getElementById("list"); list.textContent = "";
  const shown = POSTS.filter(p => (!set || p.s === set) && (!q || (p.t + " " + p.b).toLowerCase().includes(q)));
  document.getElementById("count").textContent = shown.length + " of " + POSTS.length;
  if (!shown.length) { const d = document.createElement("p"); d.className = "empty"; d.textContent = "No posts match that search."; list.appendChild(d); return; }
  for (const p of shown){
    const card = document.createElement("article"); card.className = "card" + (store[p.n] ? " posted" : "");
    const words = p.b.split(/\s+/).length;
    card.innerHTML = `<div class="head"><span class="num">#${String(p.n).padStart(2,"0")}</span><h2 class="ttl"></h2><span class="meta">${words} words · ${p.b.length.toLocaleString()} chars</span></div>
      <pre class="post"></pre>
      <div class="actions">
        <button type="button" class="btn primary" data-a="all">Copy post</button>
        <button type="button" class="btn" data-a="nolink">Copy without link</button>
        <button type="button" class="btn" data-a="link">Copy link for reply</button>
        <button type="button" class="more" data-a="more">Show all</button>
        <label class="chk"><input type="checkbox" id="posted-${p.n}" ${store[p.n] ? "checked" : ""}> Posted</label>
      </div>`;
    card.querySelector(".ttl").textContent = p.t;
    card.querySelector(".post").textContent = p.b;
    card.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const a = b.dataset.a;
      if (a === "all") copy(p.b, b, "Copy post");
      if (a === "nolink") copy(withoutLink(p.b), b, "Copy without link");
      if (a === "link") copy("https://" + LINK, b, "Copy link for reply");
      if (a === "more") { const o = card.classList.toggle("open"); b.textContent = o ? "Show less" : "Show all"; }
    });
    card.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) store[p.n] = 1; else delete store[p.n];
      card.classList.toggle("posted", e.target.checked); save();
    });
    list.appendChild(card);
  }
}
document.getElementById("sets").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  set = Number(b.dataset.set);
  for (const x of document.querySelectorAll("#sets button")) x.setAttribute("aria-pressed", String(x === b));
  render();
});
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
render();
</script>
