<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Funnel HQ</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/admin.js" defer></script>
  <script src="/assets/funnel-map.js" defer></script>
</head>
<body data-page="hq">
  <div class="app">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon" type="button" data-action="toggle-nav" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
      </button>
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">Funnel HQ</span>
      <span class="spacer"></span>
      <span class="topbar-tab" id="topbar-tab"></span>
    </header>

    <aside class="side" id="side" aria-label="Sections">
      <div class="side-brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <div class="brand-name">Funnel HQ</div>
          <div class="brand-sub">Asymmetrical AI Solutions</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="nav-item" type="button" data-action="theme" id="theme-btn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none"/></svg>
          <span id="theme-label">Theme: System</span>
        </button>
        <button class="nav-item" type="button" data-action="logout">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10.5 5l3 3-3 3M13.5 8h-7"/></svg>
          <span>Log out everywhere</span>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="page-title">Funnel HQ</h1>
          <p class="page-sub" id="page-sub"></p>
        </div>
        <div class="head-actions" id="head-actions"></div>
      </div>
      <div class="filters" id="filters" role="toolbar" aria-label="Filters"></div>
      <div class="view" id="view" aria-live="polite"><div class="loading">Loading</div></div>
    </main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
