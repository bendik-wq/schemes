name: Betting-algo på GitHub Pages

on:
  push:
    branches: [claude/laughing-fermat-5hjec9, claude/bold-euler-vwv152]
    paths: ["betting/**", ".github/workflows/betting-pages.yml"]
  schedule:
    - cron: "17 5 * * *"   # oppdater resultatdata hver morgen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester
        working-directory: betting
        run: python -m unittest tests/test_betting.py tests/test_sources.py
      - name: Bygg siden
        working-directory: betting
        run: python build_site.py --out ../_site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
