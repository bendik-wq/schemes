<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0810">
<title>Spøkelsesshowet · Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Mobilen er en buzzer i lomma: én stor handling om gangen, lagfargen overalt. */
:root {
  color-scheme: dark;
  --night: #0d0810; --crypt: #191120; --crypt-2: #241a2d; --crypt-3: #31243b;
  --bone: #f2e8d5; --ash: #a898ab; --pumpkin: #ff7b1c; --slime: #a6e05a; --blood: #e0435a;
  --hex: #a77bff; --ghost: #6fd0ea; --candle: #f2c94c; --line: rgba(242, 232, 213, .13); --ink: #1a0f06;
  --tc: var(--pumpkin);
  --f-display: "Creepster", Impact, fantasy;
  --f-body: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(120% 70% at 50% 0%, #2a1630, var(--night) 65%) fixed, var(--night); color: var(--bone); font: 16px/1.45 var(--f-body); overscroll-behavior: none; }
.wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 14px; max-width: 560px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand { font-family: var(--f-display); color: var(--pumpkin); font-size: 1.4rem; line-height: 1; }
.me { font: 600 .85rem/1.2 var(--f-body); text-align: right; color: var(--ash); min-width: 0; }
.me b { color: var(--tc); display: block; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { display: grid; align-content: start; gap: 16px; min-width: 0; }
.eyebrow { font: 500 .72rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--slime); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 2.6rem; line-height: .95; margin: 0; color: var(--bone); text-wrap: balance; }
.q { font: 800 1.35rem/1.25 var(--f-body); margin: 0; text-wrap: balance; }
.lede { color: var(--ash); margin: 0; }
.card { background: rgba(25, 17, 32, .9); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
input[type=text], input[type=number] { font: 600 1.15rem var(--f-body); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: 100%; }
input[type=number] { font-family: var(--f-mono); font-size: 1.5rem; }
.btn { font: 800 1.1rem/1 var(--f-body); border: 0; border-radius: 14px; padding: 18px; cursor: pointer; background: var(--pumpkin); color: var(--ink); width: 100%; }
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }
.teams { display: grid; gap: 8px; }
.team { font: 800 1.15rem/1 var(--f-body); padding: 16px; border-radius: 14px; border: 2px solid var(--c); background: transparent; color: var(--bone); text-align: left; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.team[aria-pressed="true"] { background: var(--c); color: var(--ink); }
.team span { font: 500 .85rem var(--f-mono); opacity: .8; }
.buzzer { width: min(78vw, 340px); aspect-ratio: 1; max-width: 100%; margin: 6px auto; border-radius: 50%; border: 0; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tc) 70%, white), var(--tc) 45%, color-mix(in srgb, var(--tc) 55%, black)); color: var(--ink); font-family: var(--f-display); font-size: 4.2rem; box-shadow: 0 14px 0 color-mix(in srgb, var(--tc) 45%, black), 0 0 60px color-mix(in srgb, var(--tc) 45%, transparent); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.buzzer:active { transform: translateY(10px); box-shadow: 0 4px 0 color-mix(in srgb, var(--tc) 45%, black); }
.buzzer:disabled { filter: grayscale(.85) brightness(.55); }
.status { text-align: center; font: 800 1.3rem/1.2 var(--f-body); min-height: 1.6em; }
.big-msg { font-family: var(--f-display); font-size: 3rem; line-height: .95; text-align: center; color: var(--tc); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vote { font: 800 1.3rem/1 var(--f-body); padding: 26px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; }
.vote.t[aria-pressed="true"] { background: var(--slime); color: var(--ink); border-color: var(--slime); }
.vote.f[aria-pressed="true"] { background: var(--blood); color: var(--bone); border-color: var(--blood); }
.four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { font: 600 1.1rem/1 var(--f-mono); padding: 18px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; }
.rate[aria-pressed="true"] { background: var(--slime); color: var(--ink); }
.skulls { display: flex; gap: 4px; justify-content: space-between; }
.skulls button { font-size: 2rem; line-height: 1; background: none; border: 0; padding: 4px; cursor: pointer; filter: grayscale(1) brightness(.4); }
.skulls button.on { filter: none; }
.list { display: grid; gap: 6px; }
.li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--crypt); border-left: 4px solid var(--c); }
.li .n { font-family: var(--f-display); color: var(--ash); font-size: 1.3rem; }
.li .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .sc { font: 500 1.05rem var(--f-mono); font-variant-numeric: tabular-nums; }
.li.mine { background: var(--crypt-2); }
.photo { width: 100%; border-radius: 14px; aspect-ratio: 3 / 4; object-fit: cover; max-width: 100%; }
.note { font-size: .85rem; color: var(--ash); margin: 0; }
.conn { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); font: 500 .75rem var(--f-mono); background: var(--blood); color: var(--bone); padding: 6px 12px; border-radius: 999px; }
.emoji { font-size: 3.4rem; text-align: center; line-height: 1.1; }
#drink { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--blood); color: var(--bone); }
#drink h2 { font-family: var(--f-display); font-weight: 400; font-size: 5rem; line-height: .9; margin: 0; }
#drink p { font: 800 1.3rem/1.3 var(--f-body); margin: 12px 0 0; }
#drink.on { animation: pulse .35s ease-in-out 6 alternate; }
@keyframes pulse { to { background: #7a0018; } }
.opt { font: 800 1.1rem/1.25 var(--f-body); text-align: left; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; width: 100%; }
.opt[aria-pressed="true"] { background: var(--tc); color: var(--ink); border-color: var(--tc); }
.opts { display: grid; gap: 8px; }
textarea { font: 600 1.15rem/1.35 var(--f-body); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: 100%; min-height: 6.5em; resize: none; }
.react { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; padding: 24px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.react.wait { background: #000; color: var(--ash); }
.react.go { background: var(--blood); color: var(--bone); }
.react.idle { background: var(--crypt); color: var(--bone); }
.react .big { font-family: var(--f-display); font-size: 5rem; line-height: .9; }
.react p { font: 700 1.2rem var(--f-body); margin: 10px 0 0; }
.canvas-wrap { background: var(--bone); border-radius: 16px; overflow: hidden; touch-action: none; aspect-ratio: 1; max-width: 100%; }
.canvas-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.word { font-family: var(--f-display); font-size: 2.4rem; line-height: 1; color: var(--candle); text-align: center; }
.tools { display: flex; gap: 8px; }
.tools button { flex: 1; font: 700 .95rem var(--f-body); padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); }
.high { font-family: var(--f-display); font-size: 2.8rem; line-height: 1; text-align: center; }
.bids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bids button { font: 600 1.1rem var(--f-mono); padding: 18px 4px; border-radius: 12px; border: 0; background: var(--slime); color: var(--ink); }
.bids button:disabled { opacity: .35; }
#scare { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; background: #000; font-size: 60vw; line-height: 1; animation: strobe .1s steps(2) infinite; }
@keyframes strobe { 50% { background: #6a0010; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">Spøkelsesshowet</div><div class="me" id="me"></div></header>
  <main id="main"><div class="card"><p class="lede">Kobler til rommet …</p></div></main>
</div>
<div id="conn" class="conn" hidden>Mistet kontakten. Prøver igjen …</div>

<script>
(() => {
"use strict";
const COLORS = ["#ff7b1c", "#a6e05a", "#a77bff", "#e0435a", "#6fd0ea", "#f2c94c"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("nb-NO");
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("ss-" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("ss-" + k, JSON.stringify(v)); } catch (e) {} }
};

const params = new URLSearchParams(location.search);
let code = (params.get("rom") || location.hash.slice(1) || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
const S = {
  pid: store.get("pid") || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),
  name: store.get("name") || "",
  team: -1,
  joined: false,
  teams: [], phase: { mode: "watch" }, buzz: null,
  myVotes: {}, editing: false, react: null
};
store.set("pid", S.pid);
const savedTeam = store.get("team-" + code);
if (Number.isInteger(savedTeam)) S.team = savedTeam;

let ws = null, retry = 0;
function connect() {
  if (code.length !== 4) { renderCode(); return; }
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${code}?role=player&pid=${encodeURIComponent(S.pid)}`);
  ws.onopen = () => { retry = 0; $("#conn").hidden = true; if (S.joined) send({ t: "join", name: S.name, team: S.team }); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } handle(m); };
  ws.onclose = () => { $("#conn").hidden = false; setTimeout(connect, Math.min(8000, 500 * 2 ** retry++)); };
}
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

function handle(m) {
  if (m.t === "welcome") {
    S.teams = m.teams || []; S.phase = m.phase || { mode: "watch" }; S.buzz = m.buzz;
    if (S.name && S.team >= 0 && S.team < S.teams.length) { S.joined = true; send({ t: "join", name: S.name, team: S.team }); }
    render();
  }
  if (m.t === "teams") { S.teams = m.teams; if (S.team >= S.teams.length) { S.joined = false; S.team = -1; } if (!S.editing) render(); else renderMe(); }
  if (m.t === "phase") {
    const newKey = m.phase.key !== S.phase.key || m.phase.mode !== S.phase.mode;
    S.phase = m.phase; S.buzz = m.buzz;
    if (newKey) S.editing = false;
    if (!S.editing) render();
  }
  if (m.t === "buzzed") {
    S.buzz = { key: m.key, winner: { team: m.team, name: m.name, pid: m.pid } };
    if (m.pid === S.pid) { vibrate([80, 40, 200]); tone(880, .2); tone(1320, .3, .15); }
    render();
  }
  if (m.t === "pour" && S.joined && (m.teams || []).includes(S.team)) drink(m);
  if (m.t === "scare") scare();
  if (m.t === "react") { S.react = { key: m.key, state: m.state, result: null }; if (m.state === "go") vibrate(120); render(); }
  if (m.t === "pressAck") { if (S.react && S.react.key === m.key) { S.react.result = m; render(); } }
}

/* Lyd og vibrasjon (lyd fungerer etter første trykk) */
let ac = null;
function tone(f, d, at = 0, type = "square", vol = .15) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function drink(m) {
  document.getElementById("drink")?.remove();
  const d = document.createElement("div"); d.id = "drink"; d.className = "on";
  d.innerHTML = `<div><h2>Drikk!</h2><p>${esc(m.text || "")}</p><p style="font-weight:600;opacity:.8">Trykk for å lukke</p></div>`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
  vibrate([300, 100, 300, 100, 600]); tone(220, .4, 0, "sawtooth", .12); tone(165, .6, .3, "sawtooth", .12);
  setTimeout(() => d.remove(), 7000);
}
function scare() {
  document.getElementById("scare")?.remove();
  const d = document.createElement("div"); d.id = "scare"; d.textContent = "💀"; document.body.appendChild(d);
  vibrate([500, 50, 500]);
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth"; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1500, t + 1.2); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.3); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.4); } catch (e) {}
  setTimeout(() => d.remove(), 1300);
}

/* Visninger */
const myTeam = () => S.teams[S.team];
function renderMe() {
  const t = myTeam();
  document.documentElement.style.setProperty("--tc", COLORS[S.team] || COLORS[0]);
  $("#me").innerHTML = S.joined && t ? `${esc(S.name)}<b>${esc(t.name)} · ${fmt(t.score)}</b>` : code ? `Rom ${esc(code)}` : "";
}
function render() {
  renderMe();
  const main = $("#main");
  if (!S.joined) { main.innerHTML = joinView(); return; }
  const p = S.phase, v = VIEWS[p.mode] || VIEWS.watch;
  if (p.mode === "draw" && S.team === p.team && $("#pad") && pad.key === padId(p)) { renderMe(); return; }
  main.innerHTML = v(p);
  if (p.mode === "draw") setupPad();
}
function renderCode() {
  $("#main").innerHTML = `<div class="card"><div class="eyebrow">Bli med</div><h1>Skriv romkoden</h1><p class="lede">Koden står på storskjermen.</p>
    <input type="text" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"><button class="btn" data-act="code">Bli med</button></div>`;
}
function joinView() {
  if (!S.teams.length) return `<div class="card"><div class="eyebrow">Rom ${esc(code)}</div><h1>Venter på verten</h1><p class="lede">Lagene er ikke klare ennå. Siden oppdaterer seg selv.</p></div>`;
  return `<div class="card">
    <div class="eyebrow">Rom ${esc(code)}</div>
    <h1>Hvem er du?</h1>
    <input type="text" id="name" maxlength="24" placeholder="Navnet ditt" value="${esc(S.name)}" autocomplete="nickname">
    <div class="eyebrow" style="margin-top:6px">Velg lag</div>
    <div class="teams">${S.teams.map((t, k) => `<button class="team" style="--c:${COLORS[k]}" data-act="pick" data-k="${k}" aria-pressed="${k === S.team}">${esc(t.name)}<span>${fmt(t.score)}</span></button>`).join("")}</div>
    <button class="btn" data-act="join" ${S.team < 0 ? "disabled" : ""}>Bli med</button>
  </div>`;
}
function board() {
  const ranked = S.teams.map((t, k) => ({ ...t, k })).sort((a, b) => b.score - a.score);
  return `<div class="list">${ranked.map((t, i) => `<div class="li ${t.k === S.team ? "mine" : ""}" style="--c:${COLORS[t.k]}"><span class="n">${i + 1}</span><span class="nm">${esc(t.name)}</span><span class="sc">${fmt(t.score)}${t.shots ? ` · 🥃${t.shots}` : ""}</span></div>`).join("")}</div>`;
}
const VIEWS = {
  choice(p) {
    if ((p.out || []).includes(S.pid)) return `<div class="card" style="text-align:center"><div class="big-msg" style="color:var(--blood)">Du er ute!</div><p class="lede">Hei hei. Hei hei! Heie på laget ditt.</p></div>${board()}`;
    const mine = S.myVotes[p.key];
    const opts = (p.options || []).filter(o => o.pid !== S.pid);
    return `<div class="card"><div class="eyebrow">${esc(p.round || "")}</div><p class="q">${esc(p.text || "")}</p></div>
      <div class="opts">${opts.map(o => `<button class="opt" data-act="choose" data-id="${esc(String(o.id))}" data-num="${typeof o.id === "number" ? 1 : 0}" aria-pressed="${String(mine) === String(o.id)}">${esc(o.label)}</button>`).join("")}</div>
      <p class="note">Du kan ombestemme deg helt til verten avslører.</p>`;
  },
  write(p) {
    const mine = S.myVotes[p.key];
    return `<div class="card"><div class="eyebrow">Løgn fra graven</div><p class="q">${esc(p.text || "").replace("___", "<u>&nbsp;?&nbsp;</u>")}</p>
      <p class="lede">Skriv et svar som høres sant ut. Lurer du andre, får laget poeng.</p>
      <textarea id="lie" maxlength="60" placeholder="Din løgn">${esc(mine || "")}</textarea>
      <button class="btn" data-act="lie">${mine ? "Oppdater løgnen" : "Send løgnen"}</button>${mine ? `<p class="note">Sendt: «${esc(mine)}»</p>` : ""}</div>`;
  },
  react(p) {
    const r = S.react && S.react.key === p.key ? S.react : null;
    if (r && r.result) return `<div class="react idle"><div><div class="big" style="color:${r.result.early ? "var(--blood)" : "var(--slime)"}">${r.result.early ? "Tjuvstart!" : r.result.ms + " ms"}</div><p>${r.result.early ? "Det blir straff." : "Sjekk storskjermen."}</p></div></div>`;
    if (r && r.state === "wait") return `<div class="react wait" data-act="press"><div><div class="big">Vent …</div><p>Ikke trykk ennå!</p></div></div>`;
    if (r && r.state === "go") return `<div class="react go" data-act="press"><div><div class="big">Trykk!</div></div></div>`;
    return `<div class="card" style="text-align:center"><div class="eyebrow">Refleksen</div><div class="big-msg">Gjør deg klar</div><p class="lede">Når skjermen blir rød: trykk hvor som helst. Trykker du før, er det tjuvstart.</p></div>`;
  },
  draw(p) {
    if (p.team !== S.team) {
      const w = S.buzz && S.buzz.key === p.key ? S.buzz.winner : null;
      let status = "Gjett hva de tegner, og buzz!";
      if (w) status = w.pid === S.pid ? "Du var først! Si svaret!" : `${esc(S.teams[w.team]?.name || "Et lag")} var først`;
      return `<div class="card"><div class="eyebrow">Tegn monsteret</div><p class="q">${esc(S.teams[p.team]?.name || "Et lag")} tegner. Se storskjermen!</p></div>
        <button class="buzzer" data-act="buzz" ${w ? "disabled" : ""}>Buzz!</button><div class="status">${status}</div>`;
    }
    return `<div class="card"><div class="eyebrow">Du tegner! Ikke si ordet.</div><div class="word">${esc(p.word || "")}</div>
      <div class="canvas-wrap"><canvas id="pad" width="360" height="360"></canvas></div>
      <div class="tools"><button data-act="pen" data-c="#1a0f06">Svart</button><button data-act="pen" data-c="#c4213a">Blod</button><button data-act="pen" data-c="#e86a10">Oransje</button><button data-act="clear">Visk ut</button></div></div>`;
  },
  bid(p) {
    const max = (p.max || [])[S.team] || 0, h = p.high, mine = h && h.team === S.team;
    const min = (h ? h.amount : 0) + 50;
    return `<div class="card"><div class="eyebrow">Gravrøverauksjonen · ${esc(p.item || "")}</div>
      <div class="high" style="color:${h ? COLORS[h.team] : "var(--ash)"}">${h ? fmt(h.amount) : "Ingen bud"}</div>
      <p class="lede" style="text-align:center">${h ? (mine ? "Laget ditt leder!" : `${esc(S.teams[h.team]?.name || "")} leder`) : "Vær først!"} · dere kan by opptil ${fmt(max)}</p>
      <div class="bids">${[min, min + 50, min + 150].map(v => `<button data-act="bid" data-v="${v}" ${v > max ? "disabled" : ""}>${fmt(v)}</button>`).join("")}</div>
      <p class="note">Budet betales uansett hva som ligger i kista.</p></div>${board()}`;
  },
  watch(p) {
    return `<div class="card"><div class="eyebrow">Nå på scenen</div><h1>${esc(p.round || "Spøkelsesshowet")}</h1>${p.text ? `<p class="q">${esc(p.text)}</p>` : `<p class="lede">Følg med på storskjermen. Buzzeren våkner når det trengs.</p>`}</div>${board()}`;
  },
  buzz(p) {
    const w = S.buzz && S.buzz.key === p.key ? S.buzz.winner : null;
    let status = "Trykk når du vet svaret!";
    if (w) status = w.pid === S.pid ? "Du var først! Svar nå!" : w.team === S.team ? `${esc(w.name)} på laget ditt var først!` : `${esc(S.teams[w.team]?.name || "Et annet lag")} var først`;
    return `<div class="card"><div class="eyebrow">${esc(p.round || "")}</div>${p.text ? (/\p{Extended_Pictographic}/u.test(p.text) && p.text.length < 20 ? `<div class="emoji">${esc(p.text)}</div>` : `<p class="q">${esc(p.text)}</p>`) : ""}</div>
      <button class="buzzer" data-act="buzz" ${w ? "disabled" : ""} aria-label="Buzz">Buzz!</button>
      <div class="status">${status}</div>`;
  },
  tf(p) {
    const mine = S.myVotes[p.key];
    return `<div class="card"><div class="eyebrow">Sant eller skrøne</div><p class="q">«${esc(p.text)}»</p></div>
      <div class="two"><button class="vote t" data-act="tf" data-v="1" aria-pressed="${mine === true}">Sant</button><button class="vote f" data-act="tf" data-v="0" aria-pressed="${mine === false}">Skrøne</button></div>
      <p class="note">Flertallet på laget ditt bestemmer. Du kan ombestemme deg til fasiten vises.</p>`;
  },
  tfresult(p) {
    const mine = S.myVotes[p.key];
    const right = mine === p.correct;
    return `<div class="card"><div class="eyebrow">Fasit</div><div class="big-msg" style="color:${p.correct ? "var(--slime)" : "var(--blood)"}">${p.correct ? "Sant!" : "Skrøne!"}</div><p class="q">«${esc(p.text)}»</p>
      ${mine == null ? `<p class="lede">Du stemte ikke.</p>` : `<p class="lede">${right ? "Du hadde rett." : "Du tok feil. Skam deg."}</p>`}</div>${board()}`;
  },
  wager(p) {
    const max = (p.max || [])[S.team] || 300, mine = S.myVotes[p.key];
    return `<div class="card"><div class="eyebrow">Finalen</div><h1>Hvor mye satser dere?</h1>
      <p class="lede">Laget kan satse opptil ${fmt(max)}. Bli enige, så sender én av dere. Siste innsending gjelder.</p>
      <input type="number" id="wager" inputmode="numeric" min="0" max="${max}" step="50" value="${mine ?? ""}" placeholder="0">
      <button class="btn" data-act="wager" data-max="${max}">Send innsatsen</button>
      ${mine != null ? `<p class="note">Sendt: ${fmt(mine)}</p>` : ""}</div>`;
  },
  rate(p) {
    const perf = S.teams[p.team], mine = S.myVotes[p.key];
    if (p.team === S.team) return `<div class="card"><div class="eyebrow">${esc(p.text || "Utfordring")}</div><div class="big-msg">Det er dere!</div><p class="lede">Gi alt. Publikum dømmer.</p></div>`;
    return `<div class="card"><div class="eyebrow">${esc(p.text || "Utfordring")}</div><h1>Hvor bra var ${esc(perf?.name || "laget")}?</h1>
      <div class="four">${[0, 100, 200, 300].map(v => `<button class="rate" data-act="rate" data-v="${v}" aria-pressed="${mine === v}">${v}</button>`).join("")}</div>
      <p class="note">Verten deler ut snittet av alle stemmene.</p></div>`;
  },
  costume(p) {
    const others = S.teams.map((t, k) => ({ t, k })).filter(x => x.k !== S.team);
    return `<div class="card"><div class="eyebrow">Kostymekåringen</div><h1>Last opp kostymet</h1>
      <p class="lede">Ta et bilde av laget ditt. Det vises på storskjermen.</p>
      <label class="btn ghost" style="text-align:center">Ta bilde<input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
      <p class="note" id="photo-status"></p></div>
      <div class="card"><div class="eyebrow">Stem på de andre</div>
      ${others.map(({ t, k }) => { const v = S.myVotes[p.key + ":" + k] || 0; return `<div><b style="color:${COLORS[k]}">${esc(t.name)}</b><div class="skulls">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= v ? "on" : ""}" data-act="skull" data-k="${k}" data-n="${n}" aria-label="${n} av 5">💀</button>`).join("")}</div></div>`; }).join("")}
      </div>`;
  },
  end() {
    const ranked = S.teams.map((t, k) => ({ ...t, k })).sort((a, b) => b.score - a.score);
    const place = ranked.findIndex(r => r.k === S.team) + 1;
    return `<div class="card" style="text-align:center"><div class="eyebrow">Kåringen</div><div class="big-msg" style="color:${COLORS[ranked[0].k]}">${esc(ranked[0].name)}</div><p class="lede">${place === 1 ? "Dere vant! Dere er kveldens monstre." : `Laget ditt kom på ${place}. plass.`}</p></div>${board()}`;
  }
};

/* Handlinger */
document.addEventListener("pointerdown", e => {
  const r = e.target.closest('[data-act="press"]');
  if (r && S.react && !S.react.pressed) { e.preventDefault(); S.react.pressed = true; send({ t: "press", key: S.react.key }); vibrate(30); return; }
  const b = e.target.closest('[data-act="buzz"]'); if (!b || b.disabled) return;
  e.preventDefault(); send({ t: "buzz" }); vibrate(40); tone(440, .08);
  b.disabled = true; $(".status").textContent = "Sendt …";
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, p = S.phase;
  if (a === "code") { const v = ($("#code").value || "").toUpperCase().replace(/[^A-Z]/g, ""); if (v.length === 4) { code = v; history.replaceState(null, "", "?rom=" + v); connect(); } }
  if (a === "pick") { S.name = ($("#name").value || "").trim(); S.team = +b.dataset.k; render(); }
  if (a === "join") {
    S.name = ($("#name").value || "").trim() || "Navnløs"; if (S.team < 0) return;
    store.set("name", S.name); store.set("team-" + code, S.team); S.joined = true;
    send({ t: "join", name: S.name, team: S.team }); tone(660, .1); render();
  }
  if (a === "tf") { const v = b.dataset.v === "1"; S.myVotes[p.key] = v; send({ t: "vote", key: p.key, value: v }); vibrate(20); render(); }
  if (a === "rate") { const v = +b.dataset.v; S.myVotes[p.key] = v; send({ t: "vote", key: p.key, value: v }); vibrate(20); render(); }
  if (a === "skull") { const k = +b.dataset.k, n = +b.dataset.n; S.myVotes[p.key + ":" + k] = n; send({ t: "vote", key: p.key, sub: k, value: n }); vibrate(20); render(); }
  if (a === "choose") { const v = b.dataset.num === "1" ? +b.dataset.id : b.dataset.id; S.myVotes[p.key] = v; send({ t: "vote", key: p.key, value: v }); vibrate(20); render(); }
  if (a === "lie") { const v = ($("#lie").value || "").trim().slice(0, 60); if (!v) return; S.myVotes[p.key] = v; S.editing = false; send({ t: "vote", key: p.key, value: v }); vibrate(30); render(); }
  if (a === "bid") { send({ t: "vote", key: p.key, value: +b.dataset.v }); vibrate(30); tone(660, .08); }
  if (a === "pen") pad.color = b.dataset.c;
  if (a === "clear") { const c = $("#pad"); if (c) { c.getContext("2d").fillStyle = "#f2e8d5"; c.getContext("2d").fillRect(0, 0, c.width, c.height); pad.dirty = true; } }
  if (a === "wager") {
    const max = +b.dataset.max, v = Math.max(0, Math.min(max, Math.round(+$("#wager").value || 0)));
    S.myVotes[p.key] = v; S.editing = false; send({ t: "vote", key: p.key, value: v }); vibrate(30); render();
  }
});
const EDIT_IDS = ["wager", "name", "lie"];
document.addEventListener("focusin", e => { if (EDIT_IDS.includes(e.target.id)) S.editing = true; });
document.addEventListener("focusout", e => { if (EDIT_IDS.includes(e.target.id)) setTimeout(() => { S.editing = false; }, 200); });

/* Tegneflaten: tegnes lokalt, sendes som bilde til storskjermen et par ganger i sekundet */
const padId = p => `${p.team}:${p.word}`;
const pad = { color: "#1a0f06", drawing: false, last: null, dirty: false, key: null };
function setupPad() {
  const c = $("#pad"); if (!c || c.dataset.ready) return;
  c.dataset.ready = "1";
  const x = c.getContext("2d");
  const id = padId(S.phase);
  if (pad.key !== id || !pad.snapshot) { x.fillStyle = "#f2e8d5"; x.fillRect(0, 0, c.width, c.height); pad.key = id; pad.snapshot = null; }
  else { const im = new Image(); im.onload = () => x.drawImage(im, 0, 0); im.src = pad.snapshot; }
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener("pointerdown", e => { e.preventDefault(); c.setPointerCapture(e.pointerId); pad.drawing = true; pad.last = pt(e); });
  c.addEventListener("pointermove", e => {
    if (!pad.drawing) return; const p = pt(e);
    x.strokeStyle = pad.color; x.lineWidth = 7; x.lineCap = "round"; x.lineJoin = "round";
    x.beginPath(); x.moveTo(pad.last[0], pad.last[1]); x.lineTo(p[0], p[1]); x.stroke(); pad.last = p; pad.dirty = true;
  });
  ["pointerup", "pointercancel"].forEach(ev => c.addEventListener(ev, () => { pad.drawing = false; }));
}
setInterval(() => {
  const c = $("#pad"); if (!c || !pad.dirty) return;
  pad.dirty = false; const data = c.toDataURL("image/jpeg", .6); pad.snapshot = data;
  send({ t: "draw", data });
}, 450);
document.addEventListener("change", e => {
  if (e.target.id !== "photo" || !e.target.files[0]) return;
  const st = $("#photo-status"); st.textContent = "Krymper bildet …";
  const img = new Image(), url = URL.createObjectURL(e.target.files[0]);
  img.onload = () => {
    const s = Math.min(1, 520 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let q = .75, data = c.toDataURL("image/jpeg", q);
    while (data.length > 110000 && q > .3) { q -= .1; data = c.toDataURL("image/jpeg", q); }
    send({ t: "photo", data }); st.textContent = "Bildet er sendt til storskjermen.";
  };
  img.onerror = () => { st.textContent = "Klarte ikke å lese bildet. Prøv igjen."; };
  img.src = url;
});

if (code.length === 4) connect(); else renderCode();
renderMe();
})();
</script>
</body>
</html>
