<title>Spøkelsesshowet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English+SC&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: et TV-studio om natta. Topplinje med rundene, scenen i midten, poengtavla som en rampe nederst. */
:root {
  color-scheme: dark;
  --night: #0d0810;
  --crypt: #191120;
  --crypt-2: #241a2d;
  --crypt-3: #31243b;
  --bone: #f2e8d5;
  --ash: #a898ab;
  --pumpkin: #ff7b1c;
  --slime: #a6e05a;
  --blood: #e0435a;
  --hex: #a77bff;
  --ghost: #6fd0ea;
  --candle: #f2c94c;
  --wood: #3a2418;
  --wood-2: #24150d;
  --line: rgba(242, 232, 213, .13);
  --glass: rgba(242, 232, 213, .14);
  --ink-on-bright: #1a0f06;
  --f-display: "Creepster", "Impact", "Haettenschweiler", fantasy;
  --f-fell: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2a1630 0%, var(--night) 60%) fixed, var(--night);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#flash { position: fixed; inset: 0; background: var(--bone); opacity: 0; pointer-events: none; z-index: 50; }
#flash.on { animation: lightning .9s ease-out; }
@keyframes lightning { 0%{opacity:0} 6%{opacity:.85} 12%{opacity:.1} 20%{opacity:.6} 100%{opacity:0} }
body.quake .app { animation: quake .6s linear; }
@keyframes quake { 10%,50%,90% { transform: translate(-10px, 4px) rotate(-.5deg); } 30%,70% { transform: translate(10px, -4px) rotate(.5deg); } }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* Topplinje */
header.top { border-bottom: 1px solid var(--line); background: rgba(13, 8, 16, .75); backdrop-filter: blur(6px); }
.top-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand . tools" "nav nav nav"; align-items: center; gap: 8px 12px; padding-block: 10px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { grid-area: brand; justify-self: start; font-family: var(--f-display); font-size: 1.6rem; color: var(--pumpkin); letter-spacing: .04em; white-space: nowrap; background: none; border: 0; cursor: pointer; padding: 0; line-height: 1; }
nav.rounds { grid-area: nav; display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
nav.rounds::-webkit-scrollbar { display: none; }
.tab { font: 600 .85rem/1 var(--f-body); color: var(--ash); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--f-mono); font-size: .75rem; opacity: .7; }
.tab:hover { color: var(--bone); border-color: var(--line); }
.tab[aria-current="true"] { color: var(--ink-on-bright); background: var(--pumpkin); }
.tools { grid-area: tools; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: end; }
.icon-btn { font: 500 .8rem/1 var(--f-mono); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
.icon-btn:hover { background: var(--crypt-3); }
.icon-btn[aria-pressed="true"] { border-color: var(--slime); color: var(--slime); }
.icon-btn.witch { border-color: var(--hex); color: var(--hex); }
.icon-btn.scare { border-color: var(--blood); color: var(--blood); }
.timer-pill { font: 500 1rem/1 var(--f-mono); padding: 8px 12px; border-radius: 8px; background: var(--crypt-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: center; }
.timer-pill.low { background: var(--blood); color: var(--bone); border-color: var(--blood); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

/* Scenen */
main.stage { overflow-y: auto; overflow-x: hidden; }
.stage-inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--slime); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.round-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: .95; color: var(--bone); letter-spacing: .02em; }
.round-title .accent { color: var(--pumpkin); }
.lede { color: var(--ash); max-width: 62ch; margin: 0; }
.head { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.center { justify-content: center; }

.btn { font: 700 1rem/1 var(--f-body); border-radius: 12px; padding: 14px 20px; cursor: pointer; border: 2px solid transparent; color: var(--ink-on-bright); background: var(--pumpkin); transition: transform .12s ease, filter .12s; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--bone); }
.btn.slime { background: var(--slime); }
.btn.blood { background: var(--blood); color: var(--bone); }
.btn.hex { background: var(--hex); }
.btn.small { font-size: .85rem; padding: 9px 12px; border-radius: 9px; }
.btn.big { font-size: 1.2rem; padding: 18px 28px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible, label.toggle:focus-within { outline: 3px solid var(--candle); outline-offset: 2px; }

/* Oppsett */
.hero { display: grid; gap: 14px; padding-block: 12px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.4rem, 11vw, 8rem); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 40px rgba(255, 123, 28, .35); letter-spacing: .02em; }
.hero h1 span { display: block; color: var(--bone); font-size: .42em; text-shadow: none; letter-spacing: .08em; }
.setup-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 24px; min-width: 0; }
.panel { background: rgba(25, 17, 32, .85); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.1rem; font-weight: 800; }
.team-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 50%; }
.team-row input { font: 600 1rem var(--f-body); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.round-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.round-list li { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
.round-list .num { font-family: var(--f-display); font-size: 1.7rem; color: var(--pumpkin); line-height: 1; }
.round-list b { display: block; }
.round-list span { color: var(--ash); font-size: .9rem; }
.keys { font: .8rem/1.7 var(--f-mono); color: var(--ash); margin: 0; }
.keys kbd { font: inherit; color: var(--bone); background: var(--crypt-3); border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); }
.toggle { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; cursor: pointer; padding: 10px 12px; border-radius: 12px; background: var(--crypt-2); border: 1px solid var(--line); }
.toggle input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--crypt-3); position: relative; cursor: pointer; margin: 0; border: 1px solid var(--line); transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ash); transition: transform .15s, background .15s; }
.toggle input:checked { background: var(--pumpkin); }
.toggle input:checked::after { transform: translateX(18px); background: var(--bone); }
.toggle b { display: block; font-weight: 700; }
.toggle span { color: var(--ash); font-size: .88rem; }
.note { font-size: .85rem; color: var(--ash); margin: 0; }

/* Showåpning */
.intro { position: relative; min-height: min(70vh, 640px); display: grid; place-items: center; text-align: center; overflow: hidden; border-radius: 24px; background: radial-gradient(60% 50% at 50% 60%, rgba(255, 123, 28, .08), transparent 70%); }
.beam { position: absolute; bottom: -10%; width: 40%; height: 140%; background: linear-gradient(to top, rgba(242, 232, 213, .16), transparent 80%); clip-path: polygon(45% 100%, 55% 100%, 100% 0, 0 0); transform-origin: 50% 100%; pointer-events: none; }
.beam.l { left: 5%; animation: sweepL 6s ease-in-out infinite alternate; }
.beam.r { right: 5%; animation: sweepR 6s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(-28deg); } to { transform: rotate(18deg); } }
@keyframes sweepR { from { transform: rotate(28deg); } to { transform: rotate(-18deg); } }
.intro-stage { position: relative; display: grid; gap: 14px; justify-items: center; padding: 24px; }
.intro-line { font-family: var(--f-fell); font-size: clamp(1.6rem, 4.5vw, 3rem); line-height: 1.1; color: var(--bone); animation: fadeUp .9s ease-out both; }
.intro-title { font-family: var(--f-display); font-size: clamp(3.4rem, 13vw, 9rem); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 60px rgba(255, 123, 28, .55); animation: slamIn .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.intro-team { font-family: var(--f-display); font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; padding: 8px 22px; border-radius: 14px; color: var(--ink-on-bright); animation: slamIn .5s cubic-bezier(.2, 1.6, .4, 1) both; overflow-wrap: anywhere; max-width: 100%; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } }
@keyframes slamIn { from { opacity: 0; transform: scale(2.4) rotate(-4deg); } }

/* Skrekk-tavla */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; min-width: 640px; }
.cat { font: 800 .95rem/1.15 var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--candle); text-align: center; padding: 14px 8px; border-bottom: 2px solid var(--pumpkin); display: flex; align-items: end; justify-content: center; min-height: 3.6rem; text-wrap: balance; }
.board.b2 .cat { border-color: var(--blood); }
.tile { font-family: var(--f-display); font-size: clamp(1.8rem, 3.6vw, 2.8rem); color: var(--pumpkin); background: linear-gradient(180deg, var(--crypt-2), var(--crypt)); border: 1px solid var(--line); border-radius: 14px; aspect-ratio: 16 / 10; max-width: 100%; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
.board.b2 .tile { color: var(--blood); }
.tile:hover { transform: translateY(-3px) rotate(-.6deg); border-color: var(--pumpkin); box-shadow: 0 10px 30px rgba(255, 123, 28, .2); }
.tile.used { color: transparent; background: rgba(25, 17, 32, .4); cursor: default; border-style: dashed; transform: none; box-shadow: none; position: relative; }
.tile.used::after { content: "✝"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--crypt-3); font-family: var(--f-body); font-size: 1.6rem; }
.progress { font: .85rem var(--f-mono); color: var(--ash); }

/* Spørsmålskort */
.card { background: linear-gradient(180deg, rgba(36, 26, 45, .95), rgba(25, 17, 32, .95)); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); min-width: 0; }
.card.devil { border-color: var(--blood); box-shadow: 0 0 0 1px var(--blood), 0 0 80px rgba(224, 67, 90, .35); }
.devil-tag { font-family: var(--f-display); font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1; color: var(--blood); animation: rise .4s ease-out; }
.card .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 500 .85rem var(--f-mono); color: var(--ash); letter-spacing: .08em; text-transform: uppercase; }
.card .meta b { color: var(--pumpkin); font-weight: 500; }
.q { font: 800 clamp(1.5rem, 3.6vw, 2.6rem)/1.15 var(--f-body); text-wrap: balance; margin: 0; }
.answer { font: 700 clamp(1.2rem, 2.8vw, 1.8rem)/1.25 var(--f-body); color: var(--slime); padding: 16px 20px; border-radius: 14px; background: rgba(166, 224, 90, .08); border: 1px dashed rgba(166, 224, 90, .45); animation: rise .35s ease-out; }
.answer small { display: block; font: 400 .95rem/1.45 var(--f-body); color: var(--ash); margin-top: 6px; }
@keyframes rise { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.award { display: grid; gap: 10px; }
.award-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.award-team { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.award-team .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chipbtn { font: 600 .85rem/1 var(--f-mono); border-radius: 8px; padding: 9px 10px; border: 0; cursor: pointer; white-space: nowrap; }
.chipbtn.plus { background: var(--slime); color: var(--ink-on-bright); }
.chipbtn.minus { background: var(--crypt-3); color: var(--bone); }

/* Emoji */
.emoji-stage { font-size: clamp(3.4rem, 12vw, 8rem); line-height: 1.1; text-align: center; letter-spacing: .08em; padding-block: 10px; filter: drop-shadow(0 0 30px rgba(167, 123, 255, .35)); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.hint { text-align: center; color: var(--candle); font-weight: 600; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--crypt-3); border: 0; padding: 0; cursor: pointer; }
.dot.done { background: var(--hex); }
.dot.cur { background: var(--pumpkin); transform: scale(1.3); }

/* Lyden fra krypten */
.speaker { display: grid; place-items: center; gap: 18px; padding-block: 10px; }
.play { width: clamp(120px, 22vw, 170px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; background: var(--pumpkin); color: var(--ink-on-bright); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(255, 123, 28, .15), 0 0 60px rgba(255, 123, 28, .35); transition: transform .15s; }
.play:hover { transform: scale(1.05); }
.play svg { width: 42%; height: 42%; }
.eq { display: flex; gap: 6px; align-items: end; height: 56px; }
.eq i { width: 10px; height: 10%; border-radius: 3px; background: var(--hex); }
.eq.on i { animation: eq .5s ease-in-out infinite alternate; }
.eq.on i:nth-child(2n) { animation-duration: .38s; background: var(--pumpkin); }
.eq.on i:nth-child(3n) { animation-duration: .62s; background: var(--slime); }
@keyframes eq { from { height: 12%; } to { height: 100%; } }

.value-big { font-family: var(--f-display); font-size: clamp(2rem, 5vw, 3rem); color: var(--slime); line-height: 1; }

/* Sant eller skrøne */
.verdict { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 6rem); line-height: 1; text-align: center; animation: rise .35s ease-out; }
.verdict.true { color: var(--slime); }
.verdict.false { color: var(--blood); }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.vote { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.vote .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vote button { font: 600 .85rem/1 var(--f-body); border-radius: 8px; padding: 9px 10px; border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; }
.vote button.sel-t { background: var(--slime); color: var(--ink-on-bright); border-color: var(--slime); }
.vote button.sel-f { background: var(--blood); color: var(--bone); border-color: var(--blood); }
.vote.right { border-color: var(--slime); }
.vote.wrong { opacity: .55; }

/* Det forbannede gresskaret */
.potato { display: grid; place-items: center; gap: 18px; padding-block: 10px; text-align: center; }
.potato .pk { font-size: clamp(7rem, 24vw, 14rem); line-height: 1; filter: drop-shadow(0 0 40px rgba(255, 123, 28, .5)); }
.potato.live .pk { animation: throb var(--beat, .8s) ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.12) rotate(3deg); filter: drop-shadow(0 0 70px rgba(224, 67, 90, .8)); } }
.potato .boom { font-family: var(--f-display); font-size: clamp(5rem, 18vw, 11rem); color: var(--blood); line-height: .9; animation: slamIn .4s cubic-bezier(.2, 1.6, .4, 1) both; }
.cat-big { font: 800 clamp(1.6rem, 4.2vw, 2.8rem)/1.15 var(--f-body); text-wrap: balance; }

/* Hjulet */
.wheel-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.wheel-box { position: relative; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--bone); filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); z-index: 2; }
.team-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.team-pick button { font: 700 .9rem/1 var(--f-body); padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--bone); cursor: pointer; }
.team-pick button[aria-pressed="true"] { color: var(--ink-on-bright); }
.result { display: grid; gap: 12px; padding: 20px; border-radius: 18px; background: var(--crypt); border: 1px solid var(--line); animation: rise .35s ease-out; min-width: 0; }
.result h3 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: 1; color: var(--pumpkin); }
.result p { margin: 0; color: var(--bone); }

/* Kostymekåringen */
.costumes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.costume { padding: 16px; border-radius: 16px; background: var(--crypt); border: 1px solid var(--line); display: grid; gap: 10px; }
.costume .nm { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; overflow-wrap: anywhere; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.crit span { font-size: .9rem; color: var(--ash); }
.skulls { display: flex; gap: 2px; }
.skulls button { font-size: 1.35rem; line-height: 1; padding: 2px; border: 0; background: none; cursor: pointer; filter: grayscale(1) brightness(.45); transition: transform .1s, filter .1s; }
.skulls button.on { filter: none; }
.skulls button:hover { transform: scale(1.2); }
.costume .tot { font: 500 1.1rem var(--f-mono); color: var(--candle); }

/* Shot-ruletten */
.roulette { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.glasses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.glass { aspect-ratio: 3 / 4; max-width: 100%; perspective: 700px; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit; }
.glass[disabled] { cursor: default; }
.glass-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3, 1.4, .5, 1); }
.glass.flipped .glass-inner { transform: rotateY(180deg); }
.glass.shaking .glass-inner { animation: shake .09s linear infinite; }
@keyframes shake { 25% { transform: translate(-3px, 1px) rotate(-2deg); } 75% { transform: translate(3px, -1px) rotate(2deg); } }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: grid; place-items: center; }
.face.front { background: radial-gradient(80% 60% at 50% 100%, rgba(255, 123, 28, .12), transparent 70%); }
.shotglass { position: relative; width: 62%; height: 74%; clip-path: polygon(4% 0, 96% 0, 82% 100%, 18% 100%); background: linear-gradient(to top, var(--glass) 0 14%, var(--liq, var(--pumpkin)) 14% 70%, var(--glass) 70% 100%); box-shadow: inset 0 0 0 2px rgba(242, 232, 213, .3); }
.shotglass::after { content: ""; position: absolute; top: 4%; left: 18%; width: 9%; height: 60%; background: rgba(255, 255, 255, .28); border-radius: 4px; }

(() => {

];
const roundName = id => id === "roulette" && !state.shotMode ? "Godteri-ruletten" : ROUNDS.find(r => r.id === id).name;

const nextOf = id => { const a = activeRounds(), i = a.findIndex(r => r.id === id); return i >= 0 && a[i + 1] ? a[i + 1].id : i < 0 ? (a[0] ? a[0].id : "end") : "end"; };

const BOARD1 = [

        ctx.quadraticCurveTo(b.x - b.s * .7, b.y - flap * .2, b.x, b.y + b.s * .2);

    x.fillStyle = eg; x.beginPath(); x.arc(ex, ey + 10, 30, 0, Math.PI * 2); x.fill();
  });
  // nese
  x.fillStyle = "#000"; x.beginPath(); x.moveTo(400, 420); x.lineTo(370, 490); x.lineTo(430, 490); x.closePath(); x.fill();
  // munn
  x.fillStyle = "#000"; x.beginPath(); x.ellipse(400, 610, 150, 120, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#e8e0c8";
  for (let i = 0; i < 9; i++) { const tx = 270 + i * 30; x.beginPath(); x.moveTo(tx, 505); x.lineTo(tx + 26, 505); x.lineTo(tx + 13, 560 + (i % 2) * 20); x.fill(); x.beginPath(); x.moveTo(tx, 718); x.lineTo(tx + 26, 718); x.lineTo(tx + 13, 665 - (i % 2) * 18); x.fill(); }
  // blod
  x.fillStyle = "#8a0010";
  for (let i = 0; i < 6; i++) { const bx = 300 + Math.random() * 200; x.fillRect(bx, 700, 8 + Math.random() * 8, 40 + Math.random() * 100); }
  sfx.scream(); osend({ t: "scare" });
  setTimeout(() => box.remove(), 1500);
}

/* ================================================================== Timer */
const timer = { end: 0, id: 0, onEnd: null };
function startTimer(sec, onEnd) {
  stopTimer(); timer.end = Date.now() + sec * 1000; timer.onEnd = onEnd || null;
  const el = $("#timer"); el.hidden = false; let last = -1;
  const step = () => {
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 5 && left > 0);
    const bt = $("#bigtimer"); if (bt) bt.textContent = el.textContent;
    if (left !== last) { if (left <= 5 && left > 0) sfx.tick(); last = left; }
    if (left === 0) { stopTimer(true); sfx.gong(); lightning(); if (timer.onEnd) timer.onEnd(); }
  };
  step(); timer.id = setInterval(step, 200);
}
function stopTimer(keep) { clearInterval(timer.id); timer.id = 0; const el = $("#timer"); el.classList.remove("low"); if (!keep) el.hidden = true; }

/* ================================================================== Poeng og shots */
function floater(i, text, cls) {
  const chip = document.querySelector(`.score[data-i="${i}"]`); if (!chip) return null;
  const f = document.createElement("span"); f.className = "floater " + cls; f.textContent = text;
  chip.appendChild(f); setTimeout(() => f.remove(), 1200); return chip;
}
function addScore(i, d, quiet) {
  if (!state.teams[i] || !d) return;
  state.teams[i].score += d; save(); renderScores();
  const chip = floater(i, (d > 0 ? "+" : "") + fmt(d), d > 0 ? "pos" : "neg");
  if (chip) { chip.classList.remove("up", "down"); void chip.offsetWidth; chip.classList.add(d > 0 ? "up" : "down"); }
  if (!quiet) (d > 0 ? sfx.correct : sfx.wrong)();
}
function pour(who, n = 1, headline, pids) {
  const list = (Array.isArray(who) ? who : [who]).filter(i => state.teams[i]);
  if (!list.length) return;
  list.forEach(i => { state.teams[i].shots = (state.teams[i].shots || 0) + n; });
  save(); renderScores();
  list.forEach(i => floater(i, `+${n} ${icon()}`, "shot"));
  sfx.pour();
  const txt = headline || (list.length === 1 ? `${state.teams[list[0]].name}: ${shotWord(n)}!` : `${shotWord(n)} til ${list.length} lag!`);
  banner(state.shotMode ? txt.toUpperCase() : txt, list.length === 1 ? tc(list[0]) : "var(--candle)", 2800);
  osend({ t: "pour", teams: list, n, text: txt, pids: pids || null });
}
const allTeams = () => state.teams.map((_, k) => k);
function leaderIdx() { let b = -Infinity, bi = -1; state.teams.forEach((t, i) => { if (t.score > b) { b = t.score; bi = i; } }); return bi; }
function lastIdx() { let b = Infinity, bi = -1; state.teams.forEach((t, i) => { if (t.score < b) { b = t.score; bi = i; } }); return bi; }
function buzz(i, who) {
  if (!state.teams[i]) return;
  sfx.buzz(); banner(who ? `${who} · ${state.teams[i].name}` : state.teams[i].name + "!", tc(i));
  document.querySelectorAll(".score").forEach(n => n.classList.toggle("buzzed", n.dataset.i == i));
  setTimeout(() => document.querySelectorAll(".score.buzzed").forEach(n => n.classList.remove("buzzed")), 4000);
  if (state.screen === "potato" && state.potState === "live") { /* buzz under gresskaret gjør ingenting */ }
}

    return head("costume", "Kostyme", "kåringen", "Hvert lag paraderer gjennom rommet til uhyggelig musikk. Publikum hyler, verten deler ut dødningehoder. Hvert hode er verdt 20 poeng, maks 300 per lag.") + `
    <div class="row"><button class="btn ghost small" data-act="drone">Slå på uhyggelig musikk til catwalken</button><button class="btn ghost small" data-act="timer" data-s="30">30 sek per lag</button></div>
    <div class="costumes">${state.teams.map((t, k) => `
      <div class="costume" style="border-top:4px solid ${tc(k)}">
        <div class="nm" style="color:${tc(k)}">${esc(t.name)}</div>
        ${online.photos[k] ? `<img src="${online.photos[k]}" alt="Kostymet til ${esc(t.name)}">` : ""}
        ${crowdCostume(k) ? `<span class="crowd">Publikum: ${crowdCostume(k).avg.toLocaleString("nb-NO")} av 5 fra ${crowdCostume(k).n} stemmer</span>` : ""}
        ${COSTUME_CRIT.map(c => { const v = (state.costume[k] || {})[c.k] || 0; return `<div class="crit"><span>${c.n}</span><div class="skulls">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= v ? "on" : ""}" data-act="skull" data-k="${k}" data-c="${c.k}" data-n="${n}" aria-label="${c.n}: ${n} av 5" ${state.costumeApplied ? "disabled" : ""}>💀</button>`).join("")}</div></div>`; }).join("")}

      </div>`).join("")}</div>
    <div class="row spread">
      ${state.costumeApplied ? `<span class="progress">Poengene er delt ut.</span>` : `<div class="row">${state.teams.some((_, k) => crowdCostume(k)) ? `<button class="btn ghost" data-act="crowdcostume">Bruk publikumsstemmene</button>` : ""}<button class="btn big" data-act="costumeapply">Kår vinneren og del ut poeng</button></div>`}
      ${nextBtn("costume")}
    </div>`;
  },

  roulette() {
    const R = state.roul, ti = R.team, t = state.teams[ti] || state.teams[0];
    const left = R.glasses.length - Object.keys(R.flipped).length;
    const last = R.last != null ? GLASS_KINDS[R.glasses[R.last]] : null;
    let actions = "";
    if (last && !R.resolved && R.glasses[R.last] === "give") actions = state.teams.map((x, k) => k === R.lastTeam ? "" : `<button class="btn hex small" data-act="glassgive" data-k="${k}">${esc(x.name)}</button>`).join("");
    const name = roundName("roulette").split("-");
    return head("roulette", name[0] + "-", name[1], state.shotMode
      ? "Tolv glass står på bordet. Noen er bare vann. Laget som har tur peker på et glass, og showet avslører hva som var i det. Laget som får «Et shot til deg» velger selv hvem som skal drikke."
      : "Tolv glass står på bordet. Noen er trygge, andre gir sure godterier. Laget som har tur peker på et glass.") + `
    <div class="roulette">
      <div class="glasses">${R.glasses.map((k, n) => { const g = GLASS_KINDS[k], f = R.flipped[n]; return `
        <button class="glass ${f ? "flipped" : ""}" data-act="glass" data-n="${n}" ${f || !R.resolved ? "disabled" : ""} aria-label="${f ? esc(T(g.title)) : "Glass " + (n + 1)}">
          <div class="glass-inner">
            <div class="face front"><div class="shotglass" style="--liq:${LIQUIDS[n % LIQUIDS.length]}"></div><span class="num">${n + 1}</span></div>
            <div class="face back" style="--k:${g.color}">${T(g.short)}</div>
          </div>
        </button>`; }).join("")}</div>
      <div style="display:grid;gap:16px;min-width:0">
        <div class="whose" style="border-color:${tc(ti)}">
          <div class="eyebrow">Neste til å velge</div>
          <div class="big" style="color:${tc(ti)}">${esc(t.name)}</div>
          <div class="team-pick">${state.teams.map((x, k) => `<button data-act="roulteam" data-k="${k}" aria-pressed="${k === ti}" style="border-color:${tc(k)};${k === ti ? `background:${tc(k)}` : ""}">${esc(x.name)}</button>`).join("")}</div>
          <span class="progress">${left} av ${R.glasses.length} glass igjen</span>
        </div>
        ${last ? `<div class="result" style="border-color:${last.color}"><div class="eyebrow">${esc(state.teams[R.lastTeam]?.name || "")} drakk glass ${R.last + 1}</div><h3 style="color:${last.color}">${esc(T(last.title))}</h3><p>${esc(T(last.text))}</p>${actions ? `<div class="row">${actions}</div>` : ""}</div>` : ""}
        <div class="row">
          ${left === 0 ? `<button class="btn" data-act="refill">Fyll glassene på nytt</button>` : `<button class="btn ghost small" data-act="refill">Fyll på nytt og stokk</button>`}
          ${nextBtn("roulette")}
        </div>
      </div>
    </div>`;
  },

  final() {
    const F = FINALS[state.finalIdx], st = state.finalStage;
    const h = head("final", "Den siste ", "vandringen", "");
    if (st === "wager") return h + `
    <div class="card">
      <p class="lede">Hvert lag skriver i hemmelighet ned hvor mye de satser, og verten fører det inn her. Du kan satse opptil hele poengsummen din. Lag med under 300 poeng kan likevel satse 300.${state.shotMode ? " Lag som svarer feil tar i tillegg ett shot." : ""}</p>
      <div class="wager-grid">${state.teams.map((t, k) => { const max = Math.max(t.score, 300); return `
        <label class="wager" style="border-top:4px solid ${tc(k)}"><span class="nm">${esc(t.name)}</span><span class="sub">Har ${fmt(t.score)} · maks ${fmt(max)}</span>
        <input id="wager-${k}" type="number" inputmode="numeric" min="0" max="${max}" step="50" data-wager="${k}" value="${state.wagers[k] ?? 0}"></label>`; }).join("")}</div>
      <div class="row"><button class="btn big" data-act="finalq">Vis finalespørsmålet</button>
        <button class="btn ghost small" data-act="finalswap">Bytt spørsmål (${state.finalIdx + 1}/${FINALS.length})</button></div>
    </div>`;
    if (st === "question") return h + `
    <div class="card">
      <div class="meta"><span>Finalespørsmål</span><span>45 sekunder</span></div>
      <p class="q">${esc(F.q)}</p>
      <div class="big-timer" id="bigtimer">0:45</div>
      <div class="row"><button class="btn" data-act="finalreveal">Vis svaret</button><button class="btn ghost" data-act="finaltimer">Start klokka på nytt</button></div>

    return h + `
    <div class="card">
      <p class="q">${esc(F.q)}</p>
      <div class="answer">${esc(F.a)}${F.x ? `<small>${esc(F.x)}</small>` : ""}</div>
      <div class="eyebrow">Hvem svarte riktig?</div>
      <div class="vote-grid">${state.teams.map((t, k) => { const m = state.finalMarks[k], w = wagerOf(k); return `
        <div class="vote" style="border-left:4px solid ${tc(k)}"><span class="nm">${esc(t.name)} · ${fmt(w)}</span>
        <button class="${m === true ? "sel-t" : ""}" data-act="finalmark" data-k="${k}" data-v="1" ${state.finalApplied ? "disabled" : ""}>Riktig</button>
        <button class="${m === false ? "sel-f" : ""}" data-act="finalmark" data-k="${k}" data-v="0" ${state.finalApplied ? "disabled" : ""}>Feil</button></div>`; }).join("")}</div>
      <div class="row">${state.finalApplied ? `<button class="btn big" data-act="go" data-to="end">Til kåringen</button>` : `<button class="btn big" data-act="finalapply">Gjør opp regnskapet</button>`}</div>
    </div>`;
  },

  react() {
    const st = state.rxState, live = onlinePlayersReady();
    const presses = online.rx && online.rx.key === rxKey() ? online.rx.presses.slice() : [];
    presses.sort((a, b) => (a.early - b.early) || ((a.ms ?? 1e9) - (b.ms ?? 1e9)));
    let stage;
    if (st === "ready") stage = `<div class="rx"><div class="rx-big" style="color:var(--pumpkin)">Klar?</div><p class="lede" style="margin:0 auto">Når skjermen blir rød: ${live ? "trykk på mobilen" : "slå i bordet"} så fort du kan. Trykker du før, er det tjuvstart${state.shotMode ? " og ett shot" : ""}.</p><button class="btn big" data-act="rxstart">Start heat ${state.rxHeat + 1}</button></div>`;
    else if (st === "wait") stage = `<div class="rx rx-wait"><div class="rx-big">Vent …</div></div>`;
    else stage = `<div class="rx rx-go"><div class="rx-big">${live ? "Trykk!" : "Slå!"}</div></div>`;
    let after = "";
    if (st === "go" || st === "done") {
      if (live) after = `<div class="rx-list">${presses.length ? presses.map((p, i) => `<div class="rx-row ${p.early ? "early" : ""}" style="--tc:${tc(p.team)}"><span>${p.early ? "✗" : i + 1}</span><span><b>${esc(p.name)}</b> · ${esc(state.teams[p.team]?.name || "")}</span><span class="ms">${p.early ? "Tjuvstart" : p.ms + " ms"}</span></div>`).join("") : `<p class="lede">Venter på trykk …</p>`}</div>
        <div class="row">${st === "go" ? `<button class="btn big" data-act="rxapply">Del ut poeng og straff</button>` : ""}</div>`;
      else after = awardRow(200, { label: "Hvem slo først?" }) + `<div class="award"><div class="eyebrow">Tjuvstart?</div><div class="row">${state.teams.map((t, k) => `<button class="btn small blood" data-act="pour" data-i="${k}">${esc(t.name)} ${icon()}</button>`).join("")}</div></div>
        <div class="row"><button class="btn" data-act="rxnext">Neste heat</button></div>`;
    }
    return head("react", "Reflek", "sen", `Fem heats. Raskeste lag får 200, nest raskeste 100.`, ` · heat ${state.rxHeat + 1}`) + stage + after + `<div class="row spread"><span class="progress">${state.rxHeat} heats spilt</span>${nextBtn("react")}</div>`;
  },

  victim() {
    const prompt = VICTIM[state.vIdx % VICTIM.length], live = onlinePlayersReady();
    const votes = Object.values(online.votes[vKey()] || {});
    let body;
    if (state.vState === "result" && state.vResult) {
      const r = state.vResult;
      body = `<div class="devil-tag" style="text-align:center">Offeret er …</div><div class="winner"><h2>${r.names.map(esc).join(" & ")}</h2></div>
        ${r.tally && r.tally.length ? `<div class="tally">${r.tally.map(t => `<div><span>${esc(t.name)}</span><b>${t.n} ${t.n === 1 ? "stemme" : "stemmer"}</b></div>`).join("")}</div>` : ""}
        <div class="row"><button class="btn" data-act="vnext">Neste spørsmål</button></div>`;
    } else if (live) {
      body = `<p class="lede">Alle stemmer på mobilen. Du kan ikke stemme på deg selv … jo, det kan du faktisk.</p>
        <div class="value-big">${votes.length} av ${online.players.length} har stemt</div>
        <div class="row"><button class="btn big" data-act="vreveal" ${votes.length ? "" : "disabled"}>Avslør offeret</button><button class="btn ghost small" data-act="vnext">Hopp over</button></div>`;
    } else {
      body = `<p class="lede">Verten teller ned. På «pek!» peker alle samtidig på den de mener. Den som får flest fingre, drikker.</p>
        <div class="row"><button class="btn big" data-act="vcount">Tell ned 3 – 2 – 1</button></div>
        <div class="award"><div class="eyebrow">Hvilket lag er offeret på?</div><div class="row">${state.teams.map((t, k) => `<button class="btn small" style="background:${tc(k)}" data-act="vpick" data-k="${k}">${esc(t.name)}</button>`).join("")}</div></div>`;
    }
    return head("victim", "Kveldens ", "offer", "", ` · ${state.vIdx % VICTIM.length + 1} av ${VICTIM.length}`) + `<div class="card"><p class="q">${esc(prompt)}</p>${body}</div><div class="row spread"><span></span>${nextBtn("victim")}</div>`;
  },

  draw() {
    const st = state.dState, word = state.dIdx >= 0 ? DRAW_WORDS[state.dIdx] : "", dt = state.dTeam, img = (online.drawImg || {})[dt];
    const pick = `<div class="team-pick">${state.teams.map((t, k) => `<button data-act="dteam" data-k="${k}" aria-pressed="${k === dt}" style="border-color:${tc(k)};${k === dt ? `background:${tc(k)}` : ""}">${esc(t.name)}</button>`).join("")}</div>`;
    const live = onlinePlayersReady();
    let side;
    if (st === "ready") side = `<div class="eyebrow">Hvem tegner?</div>${pick}<p class="lede">${live ? "Laget som tegner får ordet og et lerret på mobilen. Tegningen dukker opp her mens de tegner. De andre lagene buzzer på mobilen." : "Laget som tegner bruker papir og penn. Tegneren ser ordet ved å holde inne knappen."} Ingen bokstaver eller tall!</p><button class="btn big" data-act="dstart">Trekk et monster</button>`;
    else if (st === "drawing") side = `<div class="eyebrow">${esc(state.teams[dt]?.name || "")} tegner</div>
      <div class="secret" id="secret">${esc(word)}</div>
      <button class="btn ghost small" data-hold="secret">Hold inne for å se ordet (bare tegneren!)</button>
      ${awardRow(200, { label: "Hvem gjettet riktig?" })}
      <div class="row"><button class="btn slime small" data-act="adj" data-i="${dt}" data-d="100">Tegneren får +100</button><button class="btn" data-act="dreveal">Vis ordet</button></div>`;
    else side = `<div class="eyebrow">Det var</div><div class="secret show">${esc(word)}</div>${pick}<button class="btn big" data-act="dstart">Neste monster</button>`;
    return head("draw", "Tegn ", "monsteret", "60 sekunder. Tegneren får ikke snakke, peke eller lage lyder.") + `
    <div class="draw-layout"><div class="draw-frame" style="--tc:${tc(dt)}">${img ? `<img id="draw-img" src="${img}" alt="Tegningen til ${esc(state.teams[dt]?.name || "")}">` : `<div class="ph">${st === "drawing" ? (live ? "Venter på den første streken …" : "Laget tegner på papir. Hold det opp!") : "Lerretet er tomt"}</div>`}</div>
    <div style="display:grid;gap:14px;min-width:0">${side}</div></div>
    <div class="row spread"><span></span>${nextBtn("draw")}</div>`;
  },

  lie() {
    const L = LIES[state.lIdx % LIES.length], st = state.lState, live = onlinePlayersReady();
    const qHtml = esc(L.q).replace("___", `<span class="blank">${st === "reveal" ? esc(L.a) : "&nbsp;"}</span>`);
    let body = "";
    if (st === "write") {
      if (live) { const sub = Object.values(online.votes[lwKey()] || {}); body = `<p class="lede">Alle skriver et falskt svar på mobilen som høres sant ut. Lurer du noen, får laget ditt 100 per person.</p><div class="value-big">${sub.length} av ${online.players.length} løgner er inne</div><div class="row"><button class="btn big" data-act="lvote">Til avstemning</button></div>`; }
      else body = `<p class="lede">Ett svar er sant. De andre er løgner. Lagene diskuterer og velger.</p><div class="row"><button class="btn big" data-act="lvote">Vis alternativene</button></div>`;
    } else {
      const res = state.lResult || {};
      body = `<div class="opts">${state.lOpts.map((o, i) => {
        const cls = st === "reveal" ? (o.real ? "real" : "fake") : "";
        const who = st === "reveal" ? `${o.real ? "Sannheten" : o.author ? `Løgn av ${esc(o.author)}` : "Showets løgn"}${(res[o.id] || []).length ? ` · valgt av ${res[o.id].map(esc).join(", ")}` : ""}` : "";
        return `<div class="opt ${cls}"><span class="letter">${"ABCDEFGHIJKLMNOP"[i]}</span><span class="lbl">${esc(o.label)}</span>${who ? `<span class="who">${who}</span>` : ""}</div>`;
      }).join("")}</div>`;
      if (st === "vote") body += live ? `<div class="value-big">${Object.keys(online.votes[lvKey()] || {}).length} har stemt</div><div class="row"><button class="btn big" data-act="lreveal">Avslør sannheten</button></div>`
        : `<div class="vote-grid">${state.teams.map((t, k) => `<div class="vote" style="border-left:4px solid ${tc(k)};grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(t.name)}</span><span class="row" style="gap:4px;flex-wrap:nowrap">${state.lOpts.map((o, i) => `<button class="${state.lMarks[k] === o.id ? "sel-t" : ""}" data-act="lmark" data-k="${k}" data-o="${esc(o.id)}">${"ABCDEFGH"[i]}</button>`).join("")}</span></div>`).join("")}</div><div class="row"><button class="btn big" data-act="lreveal">Avslør sannheten</button></div>`;
      else body += `<div class="row"><button class="btn" data-act="lnext">Neste løgn</button></div>`;
    }
    return head("lie", "Løgn fra ", "graven", live ? "Finn sannheten: +200. Lur andre med løgnen din: +100 per person." : `Finn sannheten: +200. Velger dere en løgn, blir det ${shotWord(1)}.`, ` · ${state.lIdx % LIES.length + 1} av ${LIES.length}`) + `<div class="card"><p class="q">${qHtml}</p>${body}</div><div class="row spread"><span></span>${nextBtn("lie")}</div>`;
  },

  auction() {
    const C = state.aCoffins, i = state.aIdx, cur = COFFINS[C[i]], H = state.aHigh;
    const coffins = `<div class="coffins">${C.map((k, n) => `<div class="coffin ${n === i && state.aState === "bid" ? "cur" : n < i || (n === i && state.aState === "sold") ? "open" : ""}">${n < i || (n === i && state.aState === "sold") ? T(COFFINS[k].short) : n + 1}</div>`).join("")}</div>`;
    let panel;
    if (i >= C.length) panel = `<div class="card"><p class="q">Alle kistene er solgt.</p><div class="row"><button class="btn" data-act="arefill">Grav opp seks nye kister</button>${nextBtn("auction")}</div></div>`;
    else if (state.aState === "bid") panel = `<div class="card">
      <div class="meta"><span>Kiste ${i + 1} av ${C.length}</span><b>${H ? "Høyeste bud" : "Ingen bud ennå"}</b></div>
      <div class="high" style="color:${H ? tc(H.team) : "var(--ash)"}">${H ? `${fmt(H.amount)} · ${esc(state.teams[H.team]?.name || "")}` : "Hvem byr?"}</div>
      <p class="lede">${onlinePlayersReady() ? "Lagene byr fra mobilen. Verten kan også by for et lag her." : "Lagene roper ut bud. Verten fører dem inn."} Budet betales uansett hva som ligger i kista. Et lag kan by opptil poengsummen sin, minst 200.</p>
      <div class="award-grid">${state.teams.map((t, k) => `<div class="award-team" style="border-left:4px solid ${tc(k)}"><span class="nm">${esc(t.name)}</span><button class="chipbtn plus" data-act="abid" data-k="${k}" data-d="50">+50</button><button class="chipbtn plus" data-act="abid" data-k="${k}" data-d="100">+100</button></div>`).join("")}</div>
      <div class="row"><button class="btn big blood" data-act="asold" ${H ? "" : "disabled"}>Første … andre … solgt!</button><button class="btn ghost small" data-act="askip">Ingen vil ha den</button></div></div>`;
    else panel = `<div class="card" style="border-color:${tc(H.team)}"><div class="eyebrow">${esc(state.teams[H.team]?.name || "")} kjøpte kiste ${i + 1} for ${fmt(H.amount)}</div><div class="devil-tag" style="color:var(--candle)">${esc(cur.title)}</div><p class="q" style="font-size:1.4rem">${esc(T(cur.text))}</p>
      ${state.aGive ? `<div class="row">${state.teams.map((t, k) => k === H.team ? "" : `<button class="btn hex small" data-act="agive" data-k="${k}">${esc(t.name)}</button>`).join("")}</div>` : ""}
      <div class="row"><button class="btn" data-act="anext" ${state.aGive ? "disabled" : ""}>Neste kiste</button></div></div>`;
    return head("auction", "Gravrøver&shy;", "auksjonen", "Seks kister er gravd opp. Noen er fulle av gull, andre av forbannelser.") + coffins + panel;
  },

  survive() {
    const units = state.sUnits, live = onlinePlayersReady();
    if (!units) return head("survive", "Siste ", "overlevende", "") + `<div class="card"><p class="lede">${live ? "Alle spillerne svarer på mobilen. Feil svar eller ikke noe svar, og du er ute." : "Hvert lag svarer med fingrene: én, to eller tre. Feil svar, og laget er ute."} Svarer alle feil på samme spørsmål, overlever alle. Når bare ett lag har folk igjen, vinner det 300${state.shotMode ? ", og alle som ryker ut tar ett shot" : ""}.</p>
      <div class="row"><button class="btn big" data-act="sbegin">Start</button></div></div><div class="row spread"><span></span>${nextBtn("survive")}</div>`;
    const q = SURVIVE[state.sIdx % SURVIVE.length], rev = state.sState === "reveal";
    const alive = units.filter(u => !state.sOut[u.id]);
    const chips = `<div class="chips">${units.map(u => `<span class="chip ${state.sOut[u.id] ? "out" : ""}" style="--tc:${tc(u.team)}">${esc(u.name)}</span>`).join("")}</div>`;
    const opts = `<div class="opts">${q.o.map((o, i) => `<div class="opt ${rev ? (i === q.c ? "real" : "fake") : ""}"><span class="letter">${"ABC"[i]}</span><span class="lbl">${esc(o)}</span></div>`).join("")}</div>`;
    let ctl;
    if (state.sDone) ctl = `<div class="devil-tag" style="color:var(--slime)">Overlevende: ${[...new Set(alive.map(u => u.team))].map(k => esc(state.teams[k]?.name || "")).join(" & ")}</div><div class="row"><button class="btn ghost" data-act="sreset">Spill på nytt</button>${nextBtn("survive")}</div>`;
    else if (!rev) ctl = (live ? `<div class="value-big">${Object.keys(online.votes[sKey()] || {}).length} av ${alive.length} har svart</div>`
      : `<div class="vote-grid">${alive.map(u => `<div class="vote" style="border-left:4px solid ${tc(u.team)};grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(u.name)}</span><span class="row" style="gap:4px;flex-wrap:nowrap">${q.o.map((_, i) => `<button class="${state.sAns[u.id] === i ? "sel-t" : ""}" data-act="sans" data-u="${esc(u.id)}" data-v="${i}">${"ABC"[i]}</button>`).join("")}</span></div>`).join("")}</div>`)

/* ================================================================== Hjulet */
function drawWheel() {
  const cv = $("#wheel"); if (!cv) return;
  const segs = wheelSegs(), SEG = Math.PI * 2 / segs.length;
  const x = cv.getContext("2d"), W = cv.width, R = W / 2 - 10, cx = W / 2, cy = W / 2;
  x.clearRect(0, 0, W, W);
  x.save(); x.translate(cx, cy); x.rotate(state.wheelRot);
  segs.forEach((s, i) => {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, i * SEG, (i + 1) * SEG); x.closePath();
    x.fillStyle = s.color; x.globalAlpha = i % 2 ? .85 : 1; x.fill(); x.globalAlpha = 1;
    x.strokeStyle = "#0d0810"; x.lineWidth = 6; x.stroke();
    x.save(); x.rotate(i * SEG + SEG / 2); x.textAlign = "right"; x.textBaseline = "middle";
    x.fillStyle = "#1a0f06"; x.font = `${segs.length > 12 ? 50 : 64}px Creepster, Impact, fantasy`; x.fillText(T(s.label), R - 30, 0); x.restore();
  });
  x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.lineWidth = 14; x.strokeStyle = "#0d0810"; x.stroke();
  x.restore();
  x.beginPath(); x.arc(cx, cy, 78, 0, Math.PI * 2); x.fillStyle = "#0d0810"; x.fill();
  x.font = "92px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("🎃", cx, cy + 6);
}
function segmentAtPointer(rot, n) {
  const SEG = Math.PI * 2 / n;
  const a = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
  return Math.floor(a / SEG);
}
let spinning = false;
function spin() {
  if (spinning) return; spinning = true;
  state.wheelSpin = (state.wheelSpin || 0) + 1;
  state.wheelResult = null; state.wheelApplied = false; render();
  const btn = $("#spin"); if (btn) btn.disabled = true;
  const n = wheelSegs().length;
  const start = state.wheelRot, target = start + Math.PI * 2 * (5 + Math.random() * 3) + Math.random() * Math.PI * 2;
  const dur = reduced() ? 300 : 5200, t0 = performance.now();
  let lastSeg = segmentAtPointer(start, n);
  const ease = t => 1 - Math.pow(1 - t, 4);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    state.wheelRot = start + (target - start) * ease(p); drawWheel();
    const s = segmentAtPointer(state.wheelRot, n); if (s !== lastSeg) { sfx.click(); lastSeg = s; }
    if (p < 1) return requestAnimationFrame(step);
    spinning = false; state.wheelRot %= Math.PI * 2;
    state.wheelResult = segmentAtPointer(state.wheelRot, n); save();
    const w = wheelSegs()[state.wheelResult];
    if ((w.v || 0) < 0 || ["shots", "all", "giveshot"].includes(w.kind)) { sfx.thunder(); lightning(); } else sfx.reveal();
    render();
  };
  requestAnimationFrame(step);
}

function onlineConnect(code) {

function onlineMsg(m) {

function applyVote(m) {

function phaseNow() {

  if (s === "tune" && !state.tuneReveal) return P({ mode: "buzz", key: `tune:${state.tuneIdx}:${g}`, text: "Hvilken melodi er dette?" });
  if (s === "tf") { const it = TF[state.tfIdx]; return state.tfReveal ? P({ mode: "tfresult", key: `tf:${state.tfIdx}`, text: it.s, correct: it.t }) : P({ mode: "tf", key: `tf:${state.tfIdx}`, text: it.s }); }
  if (s === "wheel" && state.wheelResult != null && !state.wheelApplied) { const w = wheelSegs()[state.wheelResult]; if (w && w.kind === "challenge") return P({ mode: "rate", key: `wheel:${state.wheelSpin || 0}`, team: state.wheelTeam, text: w.title }); }

  playtune: () => {

    if (len && eq) { eq.classList.add("on"); later(() => { if (Date.now() >= tuneEnd - 50) { const e2 = $(".eq"); if (e2) e2.classList.remove("on"); } }, len * 1000 + 100); }
  },
  stoptune: () => stopTune(),
  tunereveal: () => { state.tuneReveal = true; state.tuneDone[state.tuneIdx] = true; sfx.reveal(); save(); render(); },
  tunestep: d => tuneGo(state.tuneIdx + +d.d),
  tunego: d => tuneGo(+d.k),
  tfvote: d => { const k = +d.k, v = d.v === "1"; state.tfVotes[k] = state.tfVotes[k] === v ? null : v; save(); render(); },
  tfreveal: () => {
    const item = TF[state.tfIdx]; state.tfReveal = true; stopTimer();
    let any = false;
    state.teams.forEach((_, k) => { if (state.tfVotes[k] === item.t) { addScore(k, 100, true); any = true; } });
    (any ? sfx.correct : sfx.wrong)(); save(); render();
  },
  tfnext: () => { state.tfIdx = Math.min(TF.length - 1, state.tfIdx + 1); state.tfReveal = false; state.tfVotes = {}; stopTimer(); save(); render(); },
  potstart: () => potStart(),
  potcat: () => { let n; do { n = Math.floor(Math.random() * POTATO.length); } while (n === state.potCat && POTATO.length > 1); state.potCat = n; save(); render(); },
  pothit: d => { const k = +d.k; addScore(k, -200, true); pour(k, 1, `${state.teams[k].name} ble sprengt!`); state.potHits[k] = (state.potHits[k] || 0) + 1; state.potState = "done"; save(); render(); },
  potagain: () => { ACT.potcat(); state.potState = "ready"; save(); render(); },
  wheelteam: d => { if (spinning) return; state.wheelTeam = +d.k; state.wheelResult = null; save(); render(); },
  spin,
  wheelapply: () => {
    const w = wheelSegs()[state.wheelResult], ti = state.wheelTeam, t = state.teams[ti]; if (!w || !t) return;
    if (w.kind === "bonus") addScore(ti, w.v);
    else if (w.kind === "double") { const g = Math.max(0, Math.min(t.score, 500)); if (g) addScore(ti, g); else banner("Ingenting å doble!", "var(--blood)"); }
    else if (w.kind === "steal") {
      let L = -1, best = -Infinity; state.teams.forEach((x, k) => { if (k !== ti && x.score > best) { best = x.score; L = k; } });
      if (L >= 0) { addScore(L, -w.v, true); addScore(ti, w.v); banner(`${t.name} rana ${state.teams[L].name}`, "var(--hex)"); }
    }
    else if (w.kind === "shots") pour(ti, w.n);
    else if (w.kind === "all") pour(allTeams(), 1, state.shotMode ? "Skål! Alle drikker!" : "Alle tar en sur godteri!");
    state.wheelApplied = true; save(); render();
  },
  wheelgive: d => { pour(+d.k, 1); state.wheelApplied = true; save(); render(); },
  wheelaward: d => { if (+d.v) addScore(state.wheelTeam, +d.v); state.wheelApplied = true; save(); render(); },
  wheelswap: d => {
    const a = state.teams[state.wheelTeam], b = state.teams[+d.k]; const tmp = a.score; a.score = b.score; b.score = tmp;
    state.wheelApplied = true; sfx.stinger(); banner("Sjelene er byttet!", "var(--ghost)"); save(); render();
  },
  skull: d => { const k = +d.k; state.costume[k] = state.costume[k] || {}; state.costume[k][d.c] = state.costume[k][d.c] === +d.n ? 0 : +d.n; sfx.click(); save(); render(); },
  costumeapply: () => {
    const sums = state.teams.map((_, k) => COSTUME_CRIT.reduce((s, c) => s + ((state.costume[k] || {})[c.k] || 0), 0));
    sums.forEach((s, k) => { if (s) addScore(k, s * 20, true); });
    state.costumeApplied = true; save(); render(); sfx.fanfare();
    const best = sums.indexOf(Math.max(...sums));
    if (sums[best] > 0) { banner(`Kveldens kostyme: ${state.teams[best].name}!`, tc(best), 3200); rain(["💀", "👑", "🎃", "🦇"], 70); }
  },
  glass: d => pickGlass(+d.n),
  glassgive: d => { pour(+d.k, 1, `${state.teams[state.roul.lastTeam].name} gir ${shotWord(1)} til ${state.teams[+d.k].name}!`); state.roul.resolved = true; advanceRoulTeam(); },
  roulteam: d => { state.roul.team = +d.k; save(); render(); },
  refill: () => { state.roul = { glasses: newGlasses(), flipped: {}, team: state.roul.team, last: null, resolved: true }; sfx.pour(); save(); render(); },
  finalswap: () => { state.finalIdx = (state.finalIdx + 1) % FINALS.length; save(); render(); },
  finalq: () => { state.finalStage = "question"; save(); sfx.thunder(); lightning(); render(); startTimer(45); },
  finaltimer: () => startTimer(45),
  finalreveal: () => { state.finalStage = "reveal"; stopTimer(); sfx.reveal(); save(); render(); },
  finalmark: d => { const k = +d.k, v = d.v === "1"; state.finalMarks[k] = state.finalMarks[k] === v ? null : v; save(); render(); },
  finalapply: () => {
    const losers = [];
    state.teams.forEach((t, k) => {
      const w = wagerOf(k);
      if (state.finalMarks[k] === true) addScore(k, w, true);
      else if (state.finalMarks[k] === false) { addScore(k, -w, true); losers.push(k); }
    });
    state.finalApplied = true; sfx.fanfare(); save(); render();
    if (state.shotMode && losers.length) setTimeout(() => pour(losers, 1, "Feil i finalen: skål for tapet!"), 900);
  },
  tieopen: () => { state.tieOpen = true; state.tieReveal = false; sfx.thunder(); lightning(); save(); render(); },
  tiereveal: () => { state.tieReveal = true; sfx.reveal(); save(); render(); },
  tienext: () => { state.tieIdx++; state.tieReveal = false; save(); render(); },
  tiewin: d => { addScore(+d.k, 100); state.tieOpen = false; state.tieReveal = false; state.tieIdx++; save(); render(); rainCandy(); sfx.fanfare(); },
  lastshot: d => pour(+d.i, 1, `Siste skål til ${state.teams[+d.i].name}!`),
  celebrate: () => { rainCandy(); sfx.fanfare(); },
  /* Refleksen */
  rxstart: () => {
    const delay = 2000 + Math.random() * 4500, key = rxKey();
    online.rx = { key, presses: [] };
    state.rxState = "wait"; save(); render(); sfx.heartbeat(0); sfx.heartbeat(1.2);
    osend({ t: "reactArm", key, delay });
    later(() => { if (state.rxState !== "wait") return; state.rxState = "go"; save(); render(); sfx.boom(); lightning(); }, delay);
  },
  rxapply: () => {
    const ps = (online.rx && online.rx.key === rxKey() ? online.rx.presses : []);
    const ok = ps.filter(p => !p.early).sort((a, b) => a.ms - b.ms), early = ps.filter(p => p.early);
    const teamsInOrder = [...new Set(ok.map(p => p.team))];
    if (teamsInOrder[0] != null) addScore(teamsInOrder[0], 200);
    if (teamsInOrder[1] != null) addScore(teamsInOrder[1], 100, true);
    const byTeam = {}; early.forEach(p => byTeam[p.team] = (byTeam[p.team] || 0) + 1);
    Object.entries(byTeam).forEach(([k, n], j) => setTimeout(() => pour(+k, n, `Tjuvstart! ${state.teams[+k].name}: ${shotWord(n)}`), 700 + j * 900));
    if (ok[0]) banner(`${ok[0].name}: ${ok[0].ms} ms!`, tc(ok[0].team), 2200);
    state.rxState = "done"; save(); render();
    later(() => { state.rxHeat++; state.rxState = "ready"; save(); render(); }, 3500);
  },
  rxnext: () => { state.rxHeat++; state.rxState = "ready"; save(); render(); },
  /* Kveldens offer */
  vcount: () => { ["3", "2", "1", "PEK!"].forEach((t, i) => later(() => { banner(t, i === 3 ? "var(--blood)" : "var(--candle)", 900); (i === 3 ? sfx.boom : sfx.tick)(); if (i === 3) lightning(); }, i * 1000)); },
  vpick: d => { const k = +d.k; pour(k, 1, `Offeret er på ${state.teams[k].name}!`); state.vResult = { names: [state.teams[k].name], tally: [] }; state.vState = "result"; save(); render(); },
  vreveal: () => {
    const votes = Object.values(online.votes[vKey()] || {}); if (!votes.length) return;
    const count = {}; votes.forEach(v => count[v.value] = (count[v.value] || 0) + 1);
    const tally = Object.entries(count).map(([pid, n]) => ({ pid, n, name: playerName(pid), team: (online.players.find(p => p.pid === pid) || {}).team })).sort((a, b) => b.n - a.n);
    const victimPids = () => top.map(t => t.pid);
    const top = tally.filter(t => t.n === tally[0].n);
    state.vResult = { names: top.map(t => t.name), tally: tally.map(t => ({ name: t.name, n: t.n })) }; state.vState = "result"; save();
    sfx.thunder(); lightning(); quake(); render();
    const teams = [...new Set(top.map(t => t.team).filter(t => t != null))];
    setTimeout(() => pour(teams, 1, `${top.map(t => t.name).join(" og ")} er kveldens offer!`, victimPids()), 1200);
  },
  vnext: () => { state.vIdx = (state.vIdx + 1) % VICTIM.length; state.vState = "vote"; state.vResult = null; save(); render(); },
  /* Tegn monsteret */
  dteam: d => { state.dTeam = +d.k; save(); render(); },
  dstart: () => {
    let pool = DRAW_WORDS.map((_, i) => i).filter(i => !state.dUsed.includes(i)); if (!pool.length) { state.dUsed = []; pool = DRAW_WORDS.map((_, i) => i); }
    state.dIdx = pool[Math.floor(Math.random() * pool.length)]; state.dUsed.push(state.dIdx);
    state.dState = "drawing"; state.buzzGen++; online.drawImg = {}; save(); render(); sfx.stinger(); startTimer(60);
  },
  dreveal: () => { state.dState = "done"; stopTimer(); sfx.reveal(); save(); render(); },
  /* Løgn fra graven */
  lvote: () => {
    const L = LIES[state.lIdx % LIES.length], norm = x => String(x).trim().toLowerCase();
    const opts = [{ id: "real", label: L.a, real: true }], seen = new Set([norm(L.a)]);
    if (onlinePlayersReady()) Object.entries(online.votes[lwKey()] || {}).forEach(([pid, v]) => {
      const txt = String(v.value || "").trim().slice(0, 60); if (!txt || seen.has(norm(txt))) return;
      seen.add(norm(txt)); opts.push({ id: "p:" + pid, label: txt, pid, team: v.team, author: playerName(pid) });
    });
    for (const dcy of L.d) { if (opts.length >= 4 && onlinePlayersReady()) break; if (!seen.has(norm(dcy))) { seen.add(norm(dcy)); opts.push({ id: "d:" + dcy, label: dcy }); } }
    state.lOpts = shuffle(opts); state.lState = "vote"; state.lMarks = {}; save(); sfx.reveal(); render();
  },
  lmark: d => { state.lMarks[+d.k] = d.o; save(); render(); },
  lreveal: () => {
    const res = {}, opt = id => state.lOpts.find(o => o.id === id);
    if (onlinePlayersReady()) {
      const gain = {};
      Object.entries(online.votes[lvKey()] || {}).forEach(([pid, v]) => {
        const o = opt(String(v.value)); if (!o) return;
        (res[o.id] = res[o.id] || []).push(playerName(pid));
        if (o.real) gain[v.team] = (gain[v.team] || 0) + 200;
        else if (o.team != null && o.pid !== pid) gain[o.team] = (gain[o.team] || 0) + 100;
      });
      Object.entries(gain).forEach(([k, g]) => addScore(+k, g, true));
    } else {
      const fooled = [];
      state.teams.forEach((t, k) => { const o = opt(state.lMarks[k]); if (!o) return; (res[o.id] = res[o.id] || []).push(t.name); if (o.real) addScore(k, 200, true); else fooled.push(k); });
      if (fooled.length) setTimeout(() => pour(fooled, 1, "Svelget løgnen!"), 900);
    }
    state.lResult = res; state.lState = "reveal"; save(); sfx.correct(); lightning(); render();
  },
  lnext: () => { state.lIdx = (state.lIdx + 1) % LIES.length; state.lState = "write"; state.lOpts = null; state.lResult = null; state.lMarks = {}; save(); render(); },
  /* Gravrøverauksjonen */
  abid: d => { const k = +d.k, base = state.aHigh ? state.aHigh.amount : 0; if (!takeBid(k, base + +d.d)) banner(`${state.teams[k].name} har ikke råd`, "var(--blood)", 1200); render(); },
  asold: () => {
    const H = state.aHigh; if (!H) return;
    gavel(); state.aState = "sold"; const kind = state.aCoffins[state.aIdx]; save();
    setTimeout(() => {
      addScore(H.team, -H.amount, true);
      if (kind === "gold") addScore(H.team, 800);
      else if (kind === "silver") addScore(H.team, 400);
      else if (kind === "curse") { addScore(H.team, -300); sfx.thunder(); lightning(); }
      else if (kind === "shots") pour(H.team, 2);
      else if (kind === "refund") addScore(H.team, H.amount * 2);
      else if (kind === "zombie") addScore(H.team, 200);
      else if (kind === "give") state.aGive = true;
      else sfx.wrong();
      save(); render();
    }, 1300);
    render();
  },
  agive: d => { pour(+d.k, 2, `Giftflaske til ${state.teams[+d.k].name}!`); state.aGive = false; save(); render(); },
  askip: () => { state.aIdx++; state.aHigh = null; state.aState = "bid"; save(); render(); },
  anext: () => { state.aIdx++; state.aHigh = null; state.aState = "bid"; state.aGive = false; save(); render(); },
  arefill: () => { state.aRound++; state.aCoffins = newCoffins(); state.aIdx = 0; state.aHigh = null; state.aState = "bid"; save(); render(); },
  /* Siste overlevende */
  sbegin: () => {
    state.sUnits = onlinePlayersReady() ? online.players.filter(p => p.team >= 0).map(p => ({ id: p.pid, name: p.name, team: p.team })) : state.teams.map((t, k) => ({ id: "t" + k, name: t.name, team: k }));
    state.sOut = {}; state.sAns = {}; state.sState = "ask"; state.sDone = false; state.sLast = null; save(); sfx.stinger(); render();
  },
  sans: d => { state.sAns[d.u] = +d.v; save(); render(); },
  sreveal: () => {
    const q = SURVIVE[state.sIdx % SURVIVE.length], alive = state.sUnits.filter(u => !state.sOut[u.id]);
    const ans = {}; if (onlinePlayersReady()) Object.entries(online.votes[sKey()] || {}).forEach(([pid, v]) => ans[pid] = +v.value); else Object.assign(ans, state.sAns);
    const wrong = alive.filter(u => ans[u.id] !== q.c);
    stopTimer();
    if (wrong.length === alive.length) { state.sLast = "Alle svarte feil, så alle overlever. Denne gangen."; sfx.wrong(); }
    else {
      wrong.forEach(u => state.sOut[u.id] = true);
      state.sLast = wrong.length ? `Ute: ${wrong.map(u => u.name).join(", ")}` : "Alle svarte riktig!";
      if (wrong.length) { sfx.thunder(); lightning(); const byTeam = {}; wrong.forEach(u => byTeam[u.team] = (byTeam[u.team] || 0) + 1); if (state.shotMode) Object.entries(byTeam).forEach(([k, n], j) => setTimeout(() => pour(+k, n, `${state.teams[+k].name} mistet ${n === 1 ? "en" : n}!`), 600 + j * 900)); }
      else sfx.correct();
    }
    const left = state.sUnits.filter(u => !state.sOut[u.id]), teamsLeft = [...new Set(left.map(u => u.team))];
    if (teamsLeft.length <= 1 || state.sIdx >= SURVIVE.length - 1) { state.sDone = true; teamsLeft.forEach(k => addScore(k, 300, true)); setTimeout(() => { sfx.fanfare(); rainCandy(50); }, 800); }
    state.sState = "reveal"; save(); render();
  },
  snext: () => { state.sIdx++; state.sState = "ask"; state.sAns = {}; save(); render(); },
  sreset: () => { state.sUnits = null; state.sIdx = (state.sIdx + 1) % SURVIVE.length; save(); render(); },
  ghostfreq: d => { state.ghostFreq = d.f; save(); scheduleGhost(); render(); },
  ghostnow: () => ghostVisit(true),
  ghostclose: () => { fxs.ghost = null; renderOverlay(); },
  "ghostclose-bg": (d, el, e) => { if (e.target === el) ACT.ghostclose(); },
  ghostgive: d => { const g = fxs.ghost; if (!g) return; pour(+d.k, 1, `${teamName(g.give)} ga ${shotWord(1)} til ${teamName(+d.k)}!`); g.done = true; renderOverlay(); setTimeout(() => { if (fxs.ghost === g) ACT.ghostclose(); }, 2500); },
  droulette: () => { if (fxs.dr) return; fxs.ghost = null; openDr(false); },
  drspin: () => drSpin(),
  drclose: () => { if (drSpinning) return; fxs.dr = null; renderOverlay(); },
  "drclose-bg": (d, el, e) => { if (e.target === el) ACT.drclose(); },
  witch: () => drawWitch(),
  online: () => { if (!state.room) { onlineCreate(); return; } online.showQR = !online.showQR; renderOverlay(); },
  onlinecreate: () => onlineCreate(),
  onlinenew: () => { osend({ t: "clearPhotos" }); online.photos = {}; onlineCreate(); },
  onlineclose: () => { online.showQR = false; renderOverlay(); },
  "onlineclose-bg": (d, el, e) => { if (e.target === el) ACT.onlineclose(); },
  reopenbuzz: () => { state.buzzGen++; save(); syncOnline(); banner("Buzzeren er åpen!", "var(--ghost)"); },
  crowdcostume: () => {
    state.teams.forEach((_, k) => { const c = crowdCostume(k); if (c) { const v = Math.max(1, Math.min(5, Math.round(c.avg))); state.costume[k] = { scary: v, creative: v, effort: v }; } });
    save(); render();
  },
  witchclose: () => { state.witchCard = null; save(); renderOverlay(); },
  "witchclose-bg": (d, el, e) => { if (e.target === el) ACT.witchclose(); },
  witchact: () => {
    const c = state.witchCard; if (!c) return;
    if (c.act === "lastbonus") addScore(lastIdx(), 200);
    if (c.act === "lastbonus100") { addScore(lastIdx(), 100, true); pour(allTeams(), 1, "Gravøl! Alle drikker!"); }
    if (c.act === "robin") { const L = leaderIdx(), B = lastIdx(); if (L !== B) { addScore(L, -100, true); addScore(B, 100); } }
    c.done = true; save(); renderOverlay();
  },
  witchaward: d => { addScore(+d.k, 200); state.witchCard.done = true; save(); renderOverlay(); }
};
function emojiGo(k) { state.emojiIdx = Math.max(0, Math.min(EMOJI.length - 1, k)); state.emojiReveal = false; state.emojiHint = false; stopTimer(); save(); render(); }
function tuneGo(k) { stopTune(); state.tuneIdx = Math.max(0, Math.min(TUNES.length - 1, k)); state.tuneReveal = false; save(); render(); }
function syncDrone() { $("#btn-drone").setAttribute("aria-pressed", String(!!droneNodes)); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener("pointerdown", e => { const h = e.target.closest("[data-hold]"); if (h) { const el = document.getElementById(h.dataset.hold); if (el) el.classList.add("show"); } });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => document.addEventListener(ev, () => { const el = document.getElementById("secret"); if (el && state.dState === "drawing") el.classList.remove("show"); }, true));
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.team != null) { state.teams[+t.dataset.team].name = t.value || "Navnløse"; save(); renderScores(); }
  if (t.dataset.wager != null) { state.wagers[+t.dataset.wager] = t.value === "" ? 0 : +t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.round) { state.off = state.off || {}; if (t.checked) delete state.off[t.dataset.round]; else state.off[t.dataset.round] = true; save(); render(); return; }
  if (t.dataset.setting) { state[t.dataset.setting] = t.checked; if (t.dataset.setting === "shotMode") state.wheelResult = null; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (online.showQR) ACT.onlineclose(); else if (fxs.ghost) ACT.ghostclose(); else if (fxs.dr && !drSpinning) ACT.drclose(); else if (state.witchCard) ACT.witchclose(); else if (state.current) ACT.closeq(); return; }
  if (/^[1-6]$/.test(k)) { buzz(+k - 1); return; }
  if (k === " ") {
    e.preventDefault();
    const s = state.screen;
    if ((s === "board" || s === "board2") && state.current && !state.current.reveal) ACT.reveal();
    else if (s === "emoji" && !state.emojiReveal) ACT.emojireveal();
    else if (s === "tune") ACT.playtune();
    else if (s === "tf" && !state.tfReveal) ACT.tfreveal();
    else if (s === "potato" && state.potState === "ready") potStart();
    else if (s === "react" && state.rxState === "ready") ACT.rxstart();
    else if (s === "wheel" && !spinning) spin();
    else if (s === "final" && state.finalStage === "question") ACT.finalreveal();
    return;
  }
  if (k === "h") drawWitch();
  if (k === "b") ACT.reopenbuzz();
  if (k === "d") ACT.droulette();
  if (k === "g") ghostVisit(true);
  if (k === "j") jumpscare();
  if (k === "t") startTimer(20);
  if (k === "m") ACT.mute();
  if (k === "f") ACT.fullscreen();
  const step = k === "arrowright" ? 1 : k === "arrowleft" ? -1 : 0;
  if (step) {
    if (state.screen === "emoji") emojiGo(state.emojiIdx + step);
    if (state.screen === "tune") tuneGo(state.tuneIdx + step);
  }
});

/* ================================================================== Oppstart */
function start(seed) {
  state = load(seed && seed.state);
  state._confirmReset = false;
  if (state.screen === "intro") state.screen = "setup";
  if (!state.roul || !state.roul.glasses) state.roul = fresh().roul;
  fxInit(); render(); onlineInit(); scheduleGhost();
  if (state.screen === "end") rainCandy(60);
  window.claude?.hot?.snapshot?.(() => ({ state }));
  if (document.fonts) document.fonts.ready.then(() => { if (state.screen === "wheel") drawWheel(); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
