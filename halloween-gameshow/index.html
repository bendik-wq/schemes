<title>Spøkelsesshowet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English+SC&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: et TV-studio om natta. Topplinje med rundene, scenen i midten, poengtavla som en rampe nederst. */
:root {
  color-scheme: dark;
  --night: #0d0810;
  --crypt: #191120;
  --crypt-2: #241a2d;
  --crypt-3: #31243b;
  --bone: #f2e8d5;
  --ash: #a898ab;
  --pumpkin: #ff7b1c;
  --slime: #a6e05a;
  --blood: #e0435a;
  --hex: #a77bff;
  --ghost: #6fd0ea;
  --candle: #f2c94c;
  --wood: #3a2418;
  --wood-2: #24150d;
  --line: rgba(242, 232, 213, .13);
  --glass: rgba(242, 232, 213, .14);
  --ink-on-bright: #1a0f06;
  --f-display: "Creepster", "Impact", "Haettenschweiler", fantasy;
  --f-fell: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2a1630 0%, var(--night) 60%) fixed, var(--night);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#flash { position: fixed; inset: 0; background: var(--bone); opacity: 0; pointer-events: none; z-index: 50; }
#flash.on { animation: lightning .9s ease-out; }
@keyframes lightning { 0%{opacity:0} 6%{opacity:.85} 12%{opacity:.1} 20%{opacity:.6} 100%{opacity:0} }
body.quake .app { animation: quake .6s linear; }
@keyframes quake { 10%,50%,90% { transform: translate(-10px, 4px) rotate(-.5deg); } 30%,70% { transform: translate(10px, -4px) rotate(.5deg); } }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* Topplinje */
header.top { border-bottom: 1px solid var(--line); background: rgba(13, 8, 16, .75); backdrop-filter: blur(6px); }
.top-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand . tools" "nav nav nav"; align-items: center; gap: 8px 12px; padding-block: 10px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { grid-area: brand; justify-self: start; font-family: var(--f-display); font-size: 1.6rem; color: var(--pumpkin); letter-spacing: .04em; white-space: nowrap; background: none; border: 0; cursor: pointer; padding: 0; line-height: 1; }
nav.rounds { grid-area: nav; display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
nav.rounds::-webkit-scrollbar { display: none; }
.tab { font: 600 .85rem/1 var(--f-body); color: var(--ash); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--f-mono); font-size: .75rem; opacity: .7; }
.tab:hover { color: var(--bone); border-color: var(--line); }
.tab[aria-current="true"] { color: var(--ink-on-bright); background: var(--pumpkin); }
.tools { grid-area: tools; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: end; }
.icon-btn { font: 500 .8rem/1 var(--f-mono); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
.icon-btn:hover { background: var(--crypt-3); }
.icon-btn[aria-pressed="true"] { border-color: var(--slime); color: var(--slime); }
.icon-btn.witch { border-color: var(--hex); color: var(--hex); }
.icon-btn.scare { border-color: var(--blood); color: var(--blood); }
.timer-pill { font: 500 1rem/1 var(--f-mono); padding: 8px 12px; border-radius: 8px; background: var(--crypt-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: center; }
.timer-pill.low { background: var(--blood); color: var(--bone); border-color: var(--blood); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

/* Scenen */
main.stage { overflow-y: auto; overflow-x: hidden; }
.stage-inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--slime); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.round-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: .95; color: var(--bone); letter-spacing: .02em; }
.round-title .accent { color: var(--pumpkin); }
.lede { color: var(--ash); max-width: 62ch; margin: 0; }
.head { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.center { justify-content: center; }

.btn { font: 700 1rem/1 var(--f-body); border-radius: 12px; padding: 14px 20px; cursor: pointer; border: 2px solid transparent; color: var(--ink-on-bright); background: var(--pumpkin); transition: transform .12s ease, filter .12s; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--bone); }
.btn.slime { background: var(--slime); }
.btn.blood { background: var(--blood); color: var(--bone); }
.btn.hex { background: var(--hex); }
.btn.small { font-size: .85rem; padding: 9px 12px; border-radius: 9px; }
.btn.big { font-size: 1.2rem; padding: 18px 28px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible, label.toggle:focus-within { outline: 3px solid var(--candle); outline-offset: 2px; }

/* Oppsett */
.hero { display: grid; gap: 14px; padding-block: 12px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.4rem, 11vw, 8rem); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 40px rgba(255, 123, 28, .35); letter-spacing: .02em; }
.hero h1 span { display: block; color: var(--bone); font-size: .42em; text-shadow: none; letter-spacing: .08em; }
.setup-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 24px; min-width: 0; }
.panel { background: rgba(25, 17, 32, .85); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.1rem; font-weight: 800; }
.team-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 50%; }
.team-row input { font: 600 1rem var(--f-body); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.round-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.round-list li { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
.round-list .num { font-family: var(--f-display); font-size: 1.7rem; color: var(--pumpkin); line-height: 1; }
.round-list b { display: block; }
.round-list span { color: var(--ash); font-size: .9rem; }
.keys { font: .8rem/1.7 var(--f-mono); color: var(--ash); margin: 0; }
.keys kbd { font: inherit; color: var(--bone); background: var(--crypt-3); border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); }
.toggle { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; cursor: pointer; padding: 10px 12px; border-radius: 12px; background: var(--crypt-2); border: 1px solid var(--line); }
.toggle input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--crypt-3); position: relative; cursor: pointer; margin: 0; border: 1px solid var(--line); transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ash); transition: transform .15s, background .15s; }
.toggle input:checked { background: var(--pumpkin); }
.toggle input:checked::after { transform: translateX(18px); background: var(--bone); }
.toggle b { display: block; font-weight: 700; }
.toggle span { color: var(--ash); font-size: .88rem; }
.note { font-size: .85rem; color: var(--ash); margin: 0; }

/* Showåpning */
.intro { position: relative; min-height: min(70vh, 640px); display: grid; place-items: center; text-align: center; overflow: hidden; border-radius: 24px; background: radial-gradient(60% 50% at 50% 60%, rgba(255, 123, 28, .08), transparent 70%); }
.beam { position: absolute; bottom: -10%; width: 40%; height: 140%; background: linear-gradient(to top, rgba(242, 232, 213, .16), transparent 80%); clip-path: polygon(45% 100%, 55% 100%, 100% 0, 0 0); transform-origin: 50% 100%; pointer-events: none; }
.beam.l { left: 5%; animation: sweepL 6s ease-in-out infinite alternate; }
.beam.r { right: 5%; animation: sweepR 6s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(-28deg); } to { transform: rotate(18deg); } }
@keyframes sweepR { from { transform: rotate(28deg); } to { transform: rotate(-18deg); } }
.intro-stage { position: relative; display: grid; gap: 14px; justify-items: center; padding: 24px; }
.intro-line { font-family: var(--f-fell); font-size: clamp(1.6rem, 4.5vw, 3rem); line-height: 1.1; color: var(--bone); animation: fadeUp .9s ease-out both; }
.intro-title { font-family: var(--f-display); font-size: clamp(3.4rem, 13vw, 9rem); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 60px rgba(255, 123, 28, .55); animation: slamIn .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.intro-team { font-family: var(--f-display); font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; padding: 8px 22px; border-radius: 14px; color: var(--ink-on-bright); animation: slamIn .5s cubic-bezier(.2, 1.6, .4, 1) both; overflow-wrap: anywhere; max-width: 100%; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } }
@keyframes slamIn { from { opacity: 0; transform: scale(2.4) rotate(-4deg); } }

/* Skrekk-tavla */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; min-width: 640px; }
.cat { font: 800 .95rem/1.15 var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--candle); text-align: center; padding: 14px 8px; border-bottom: 2px solid var(--pumpkin); display: flex; align-items: end; justify-content: center; min-height: 3.6rem; text-wrap: balance; }
.board.b2 .cat { border-color: var(--blood); }
.tile { font-family: var(--f-display); font-size: clamp(1.8rem, 3.6vw, 2.8rem); color: var(--pumpkin); background: linear-gradient(180deg, var(--crypt-2), var(--crypt)); border: 1px solid var(--line); border-radius: 14px; aspect-ratio: 16 / 10; max-width: 100%; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
.board.b2 .tile { color: var(--blood); }
.tile:hover { transform: translateY(-3px) rotate(-.6deg); border-color: var(--pumpkin); box-shadow: 0 10px 30px rgba(255, 123, 28, .2); }
.tile.used { color: transparent; background: rgba(25, 17, 32, .4); cursor: default; border-style: dashed; transform: none; box-shadow: none; position: relative; }
.tile.used::after { content: "✝"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--crypt-3); font-family: var(--f-body); font-size: 1.6rem; }
.progress { font: .85rem var(--f-mono); color: var(--ash); }

/* Spørsmålskort */
.card { background: linear-gradient(180deg, rgba(36, 26, 45, .95), rgba(25, 17, 32, .95)); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); min-width: 0; }
.card.devil { border-color: var(--blood); box-shadow: 0 0 0 1px var(--blood), 0 0 80px rgba(224, 67, 90, .35); }
.devil-tag { font-family: var(--f-display); font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1; color: var(--blood); animation: rise .4s ease-out; }
.card .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 500 .85rem var(--f-mono); color: var(--ash); letter-spacing: .08em; text-transform: uppercase; }
.card .meta b { color: var(--pumpkin); font-weight: 500; }
.q { font: 800 clamp(1.5rem, 3.6vw, 2.6rem)/1.15 var(--f-body); text-wrap: balance; margin: 0; }
.answer { font: 700 clamp(1.2rem, 2.8vw, 1.8rem)/1.25 var(--f-body); color: var(--slime); padding: 16px 20px; border-radius: 14px; background: rgba(166, 224, 90, .08); border: 1px dashed rgba(166, 224, 90, .45); animation: rise .35s ease-out; }
.answer small { display: block; font: 400 .95rem/1.45 var(--f-body); color: var(--ash); margin-top: 6px; }
@keyframes rise { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.award { display: grid; gap: 10px; }
.award-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.award-team { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.award-team .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chipbtn { font: 600 .85rem/1 var(--f-mono); border-radius: 8px; padding: 9px 10px; border: 0; cursor: pointer; white-space: nowrap; }
.chipbtn.plus { background: var(--slime); color: var(--ink-on-bright); }
.chipbtn.minus { background: var(--crypt-3); color: var(--bone); }

/* Emoji */
.emoji-stage { font-size: clamp(3.4rem, 12vw, 8rem); line-height: 1.1; text-align: center; letter-spacing: .08em; padding-block: 10px; filter: drop-shadow(0 0 30px rgba(167, 123, 255, .35)); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.hint { text-align: center; color: var(--candle); font-weight: 600; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--crypt-3); border: 0; padding: 0; cursor: pointer; }
.dot.done { background: var(--hex); }
.dot.cur { background: var(--pumpkin); transform: scale(1.3); }

/* Lyden fra krypten */
.speaker { display: grid; place-items: center; gap: 18px; padding-block: 10px; }
.play { width: clamp(120px, 22vw, 170px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; background: var(--pumpkin); color: var(--ink-on-bright); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(255, 123, 28, .15), 0 0 60px rgba(255, 123, 28, .35); transition: transform .15s; }
.play:hover { transform: scale(1.05); }
.play svg { width: 42%; height: 42%; }
.eq { display: flex; gap: 6px; align-items: end; height: 56px; }
.eq i { width: 10px; height: 10%; border-radius: 3px; background: var(--hex); }
.eq.on i { animation: eq .5s ease-in-out infinite alternate; }
.eq.on i:nth-child(2n) { animation-duration: .38s; background: var(--pumpkin); }
.eq.on i:nth-child(3n) { animation-duration: .62s; background: var(--slime); }
@keyframes eq { from { height: 12%; } to { height: 100%; } }

/* Seansen */
.ouija { position: relative; width: min(100%, calc(52vh * 1.6)); margin-inline: auto; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 28px; background: radial-gradient(70% 60% at 50% 45%, var(--wood), var(--wood-2)); border: 2px solid rgba(242, 201, 76, .35); box-shadow: inset 0 0 80px rgba(0, 0, 0, .7), 0 30px 80px rgba(0, 0, 0, .5); overflow: hidden; }
.ouija .lt { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-fell); font-size: clamp(1rem, 3.4vw, 2.4rem); color: rgba(242, 232, 213, .78); transition: color .3s, text-shadow .3s; line-height: 1; }
.ouija .lt.small { font-size: clamp(.8rem, 2.2vw, 1.5rem); }
.ouija .lt.word { font-size: clamp(.9rem, 2.6vw, 1.8rem); letter-spacing: .1em; }
.ouija .lt.hot { color: var(--candle); text-shadow: 0 0 18px var(--candle), 0 0 40px var(--pumpkin); }
.ouija .sun, .ouija .moon { position: absolute; top: 6%; font-size: clamp(1.4rem, 4vw, 2.6rem); opacity: .7; }
.ouija .sun { left: 4%; } .ouija .moon { right: 4%; }
.planchette { position: absolute; width: clamp(64px, 11vw, 120px); aspect-ratio: 1 / 1.15; max-width: 100%; transform: translate(-50%, -42%); transition: left 1.1s cubic-bezier(.5, .05, .3, 1), top 1.1s cubic-bezier(.5, .05, .3, 1); border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%; background: radial-gradient(circle at 50% 42%, transparent 0 22%, rgba(242, 232, 213, .95) 23% 27%, rgba(230, 214, 186, .92) 28%); box-shadow: 0 12px 30px rgba(0, 0, 0, .6); pointer-events: none; z-index: 2; }
.planchette.idle { transition: left 1.6s ease-in-out, top 1.6s ease-in-out; }
.slots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.slot { width: clamp(30px, 5vw, 46px); height: clamp(40px, 6.4vw, 58px); border-bottom: 3px solid var(--ash); display: grid; place-items: center; font-family: var(--f-fell); font-size: clamp(1.4rem, 3.4vw, 2.2rem); color: var(--candle); }
.slot.on { border-color: var(--candle); animation: rise .4s ease-out; }
.value-big { font-family: var(--f-display); font-size: clamp(2rem, 5vw, 3rem); color: var(--slime); line-height: 1; }
.paused { padding: 14px 18px; border-radius: 14px; background: var(--crypt); border: 2px solid var(--tc, var(--line)); display: grid; gap: 10px; }

/* Sant eller skrøne */
.verdict { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 6rem); line-height: 1; text-align: center; animation: rise .35s ease-out; }
.verdict.true { color: var(--slime); }
.verdict.false { color: var(--blood); }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.vote { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.vote .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vote button { font: 600 .85rem/1 var(--f-body); border-radius: 8px; padding: 9px 10px; border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; }
.vote button.sel-t { background: var(--slime); color: var(--ink-on-bright); border-color: var(--slime); }
.vote button.sel-f { background: var(--blood); color: var(--bone); border-color: var(--blood); }
.vote.right { border-color: var(--slime); }
.vote.wrong { opacity: .55; }

/* Det forbannede gresskaret */
.potato { display: grid; place-items: center; gap: 18px; padding-block: 10px; text-align: center; }
.potato .pk { font-size: clamp(7rem, 24vw, 14rem); line-height: 1; filter: drop-shadow(0 0 40px rgba(255, 123, 28, .5)); }
.potato.live .pk { animation: throb var(--beat, .8s) ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.12) rotate(3deg); filter: drop-shadow(0 0 70px rgba(224, 67, 90, .8)); } }
.potato .boom { font-family: var(--f-display); font-size: clamp(5rem, 18vw, 11rem); color: var(--blood); line-height: .9; animation: slamIn .4s cubic-bezier(.2, 1.6, .4, 1) both; }
.cat-big { font: 800 clamp(1.6rem, 4.2vw, 2.8rem)/1.15 var(--f-body); text-wrap: balance; }

/* Hjulet */
.wheel-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.wheel-box { position: relative; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--bone); filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); z-index: 2; }
.team-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.team-pick button { font: 700 .9rem/1 var(--f-body); padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--bone); cursor: pointer; }
.team-pick button[aria-pressed="true"] { color: var(--ink-on-bright); }
.result { display: grid; gap: 12px; padding: 20px; border-radius: 18px; background: var(--crypt); border: 1px solid var(--line); animation: rise .35s ease-out; min-width: 0; }
.result h3 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: 1; color: var(--pumpkin); }
.result p { margin: 0; color: var(--bone); }

/* Kostymekåringen */

/* Bakgrunn: tåke, flaggermus og fallende godteri */
const fx = { c: $("#fx"), parts: [], bats: [], confetti: [] };
function fxInit() {
  const ctx = fx.c.getContext("2d");
  const resize = () => { fx.c.width = innerWidth * devicePixelRatio; fx.c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 26; i++) fx.parts.push({ x: Math.random() * innerWidth, y: innerHeight * (.55 + Math.random() * .5), r: 80 + Math.random() * 180, vx: .1 + Math.random() * .25, a: .03 + Math.random() * .05 });
  for (let i = 0; i < 4; i++) fx.bats.push(newBat());
  const still = reduced();
  let t = 0;
  function frame() {
    t += 1; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of fx.parts) {
      p.x += still ? 0 : p.vx; if (p.x - p.r > innerWidth) p.x = -p.r;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(190,170,210,${p.a})`); g.addColorStop(1, "rgba(190,170,210,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!still) {
      ctx.fillStyle = "rgba(8,4,10,.85)";
      for (const b of fx.bats) {
        b.x += b.vx; b.y += Math.sin(t * .05 + b.ph) * .6;
        if (b.x > innerWidth + 40 || b.x < -40) Object.assign(b, newBat());
        const flap = Math.sin(t * .35 + b.ph) * b.s * .6;
        ctx.beginPath(); ctx.moveTo(b.x, b.y);
        ctx.quadraticCurveTo(b.x - b.s * .6, b.y - flap - b.s * .4, b.x - b.s * 1.4, b.y - flap);
        ctx.quadraticCurveTo(b.x - b.s * .7, b.y - flap * .2, b.x, b.y + b.s * .2);
        ctx.quadraticCurveTo(b.x + b.s * .7, b.y - flap * .2, b.x + b.s * 1.4, b.y - flap);
        ctx.quadraticCurveTo(b.x + b.s * .6, b.y - flap - b.s * .4, b.x, b.y);
        ctx.fill();
      }
      for (let i = fx.confetti.length - 1; i >= 0; i--) {
        const c = fx.confetti[i]; c.y += c.vy; c.x += Math.sin((t + c.ph) * .03) * .8; c.rot += c.vr;
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.font = `${c.s}px serif`; ctx.fillText(c.ch, -c.s / 2, c.s / 2); ctx.restore();
        if (c.y > innerHeight + 40) fx.confetti.splice(i, 1);
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}

function jumpscare() {

  const box = document.createElement("div"); box.id = "scare"; if (!reduced()) box.classList.add("flash");
  const cv = document.createElement("canvas"); cv.width = 800; cv.height = 800; box.appendChild(cv); document.body.appendChild(box);

  x.fillStyle = g; x.beginPath(); x.ellipse(400, 400, 290, 360, 0, 0, Math.PI * 2); x.fill();
  // øyne
  [[290, 320], [510, 320]].forEach(([ex, ey]) => {
    x.fillStyle = "#000"; x.beginPath(); x.ellipse(ex, ey, 85, 105, ex < 400 ? .25 : -.25, 0, Math.PI * 2); x.fill();

  // munn

  x.fillStyle = "#e8e0c8";
  for (let i = 0; i < 9; i++) { const tx = 270 + i * 30; x.beginPath(); x.moveTo(tx, 505); x.lineTo(tx + 26, 505); x.lineTo(tx + 13, 560 + (i % 2) * 20); x.fill(); x.beginPath(); x.moveTo(tx, 718); x.lineTo(tx + 26, 718); x.lineTo(tx + 13, 665 - (i % 2) * 18); x.fill(); }

const timer = { end: 0, id: 0, onEnd: null };
function startTimer(sec, onEnd) {
  stopTimer(); timer.end = Date.now() + sec * 1000; timer.onEnd = onEnd || null;
  const el = $("#timer"); el.hidden = false; let last = -1;
  const step = () => {
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 5 && left > 0);
    const bt = $("#bigtimer"); if (bt) bt.textContent = el.textContent;
    if (left !== last) { if (left <= 5 && left > 0) sfx.tick(); last = left; }
    if (left === 0) { stopTimer(true); sfx.gong(); lightning(); if (timer.onEnd) timer.onEnd(); }
  };
  step(); timer.id = setInterval(step, 200);
}

  end() {
    const ranked = state.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);

    const totalShots = state.teams.reduce((s, t) => s + (t.shots || 0), 0);
    const costumeWin = state.costumeApplied ? state.teams.map((t, i) => ({ t, i, s: COSTUME_CRIT.reduce((a, c) => a + ((state.costume[i] || {})[c.k] || 0), 0) })).sort((a, b) => b.s - a.s)[0] : null;

}
const OPOS = ouijaPos();

function drawWheel() {
  const cv = $("#wheel"); if (!cv) return;
  const segs = wheelSegs(), SEG = Math.PI * 2 / segs.length;
  const x = cv.getContext("2d"), W = cv.width, R = W / 2 - 10, cx = W / 2, cy = W / 2;
  x.clearRect(0, 0, W, W);
  x.save(); x.translate(cx, cy); x.rotate(state.wheelRot);
  segs.forEach((s, i) => {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, i * SEG, (i + 1) * SEG); x.closePath();
    x.fillStyle = s.color; x.globalAlpha = i % 2 ? .85 : 1; x.fill(); x.globalAlpha = 1;
    x.strokeStyle = "#0d0810"; x.lineWidth = 6; x.stroke();
    x.save(); x.rotate(i * SEG + SEG / 2); x.textAlign = "right"; x.textBaseline = "middle";
    x.fillStyle = "#1a0f06"; x.font = `${segs.length > 12 ? 50 : 64}px Creepster, Impact, fantasy`; x.fillText(T(s.label), R - 30, 0); x.restore();
  });
  x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.lineWidth = 14; x.strokeStyle = "#0d0810"; x.stroke();
  x.restore();
  x.beginPath(); x.arc(cx, cy, 78, 0, Math.PI * 2); x.fillStyle = "#0d0810"; x.fill();
  x.font = "92px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("🎃", cx, cy + 6);
}
function segmentAtPointer(rot, n) {
  const SEG = Math.PI * 2 / n;
  const a = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
  return Math.floor(a / SEG);
}
let spinning = false;
function spin() {
  if (spinning) return; spinning = true;
  state.wheelSpin = (state.wheelSpin || 0) + 1;
  state.wheelResult = null; state.wheelApplied = false; render();
  const btn = $("#spin"); if (btn) btn.disabled = true;
  const n = wheelSegs().length;
  const start = state.wheelRot, target = start + Math.PI * 2 * (5 + Math.random() * 3) + Math.random() * Math.PI * 2;
  const dur = reduced() ? 300 : 5200, t0 = performance.now();
  let lastSeg = segmentAtPointer(start, n);
  const ease = t => 1 - Math.pow(1 - t, 4);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    state.wheelRot = start + (target - start) * ease(p); drawWheel();
    const s = segmentAtPointer(state.wheelRot, n); if (s !== lastSeg) { sfx.click(); lastSeg = s; }
    if (p < 1) return requestAnimationFrame(step);
    spinning = false; state.wheelRot %= Math.PI * 2;
    state.wheelResult = segmentAtPointer(state.wheelRot, n); save();
    const w = wheelSegs()[state.wheelResult];
    if ((w.v || 0) < 0 || ["shots", "all", "giveshot"].includes(w.kind)) { sfx.thunder(); lightning(); } else sfx.reveal();
    render();
  };
  requestAnimationFrame(step);
}

function onlineMsg(m) {

function phaseNow() {

  }
  if (s === "emoji" && !state.emojiReveal) return P({ mode: "buzz", key: `emoji:${state.emojiIdx}:${g}`, text: EMOJI[state.emojiIdx].e });
  if (s === "tune" && !state.tuneReveal) return P({ mode: "buzz", key: `tune:${state.tuneIdx}:${g}`, text: "Hvilken melodi er dette?" });
  if (s === "seance" && (state.seState === "running" || state.seState === "paused")) return P({ mode: "buzz", key: `se:${state.seIdx}:${g}`, text: SEANCE[state.seIdx].q });
  if (s === "tf") { const it = TF[state.tfIdx]; return state.tfReveal ? P({ mode: "tfresult", key: `tf:${state.tfIdx}`, text: it.s, correct: it.t }) : P({ mode: "tf", key: `tf:${state.tfIdx}`, text: it.s }); }
  if (s === "wheel" && state.wheelResult != null && !state.wheelApplied) { const w = wheelSegs()[state.wheelResult]; if (w && w.kind === "challenge") return P({ mode: "rate", key: `wheel:${state.wheelSpin || 0}`, team: state.wheelTeam, text: w.title }); }
  if (s === "costume" && !state.costumeApplied) return P({ mode: "costume", key: "costume" });
  if (s === "final") return state.finalStage === "wager" ? P({ mode: "wager", key: `final:${state.finalIdx}`, max: state.teams.map(t => Math.max(t.score, 300)) }) : P({ mode: "watch", text: FINALS[state.finalIdx].q });
  if (s === "end") return P({ mode: "end" });
  return P({ mode: "watch" });
}
function syncOnline() {
  if (!online.connected) return;
  const teams = JSON.stringify(state.teams.map(t => ({ name: t.name, score: t.score, shots: t.shots || 0 })));
  if (teams !== online.lastTeams) { online.lastTeams = teams; osend({ t: "teams", teams: JSON.parse(teams) }); }
  const ph = JSON.stringify(phaseNow());
  if (ph !== online.lastPhase) { online.lastPhase = ph; osend({ t: "phase", phase: JSON.parse(ph) }); }
}
function crowdRate() {
  const v = Object.values(online.votes[`wheel:${state.wheelSpin || 0}`] || {}); if (!v.length) return null;
  const avg = v.reduce((a, b) => a + (+b.value || 0), 0) / v.length;
  return { avg: Math.round(avg), n: v.length, round: Math.round(avg / 50) * 50 };
}
function crowdCostume(k) {
  const v = Object.values(online.votes.costume || {}).filter(x => x.sub === k); if (!v.length) return null;
  return { avg: Math.round(v.reduce((a, b) => a + (+b.value || 0), 0) / v.length * 10) / 10, n: v.length };
}
const joinUrl = () => `${location.origin}/spill?rom=${state.room}`;
function qrSvg(text) {
  if (typeof qrcode !== "function") return "";
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) { return ""; }
}
function rosterHtml() {
  if (!online.players.length) return `<div>Ingen spillere ennå. Skann koden for å bli med.</div>`;
  return state.teams.map((t, k) => { const ps = online.players.filter(p => p.team === k); return `<div><b style="color:${tc(k)}">${esc(t.name)}</b> · ${ps.length ? ps.map(p => esc(p.name)).join(", ") : "ingen ennå"}</div>`; }).join("");
}
function onlinePanel() {
  if (!online.on) return `<section class="panel"><h2>Mobilspill</h2><p class="note">Vil dere buzze, stemme og sende kostymebilder fra mobilen? Åpne showet på <a href="${ONLINE_HOME}" target="_blank" rel="noopener" style="color:var(--ghost)">${ONLINE_HOME.replace("https://", "")}</a>. Der får gjestene en QR-kode å skanne.</p></section>`;
  if (!state.room) return `<section class="panel"><h2>Mobilspill</h2><p class="note">Gjestene skanner en QR-kode og bruker mobilen som buzzer, stemmer på sant/skrøne, sender innsats i finalen og laster opp kostymebilder. Når noen må drikke, blinker telefonen deres rødt.</p><button class="btn" style="background:var(--ghost)" data-act="onlinecreate">Åpne rom for mobiler</button></section>`;
  return `<section class="panel"><h2>Mobilspill · rom ${esc(state.room)}</h2>
    <div class="row" style="align-items:start;flex-wrap:nowrap"><div class="qr-box" style="width:140px;padding:8px">${qrSvg(joinUrl())}</div>
    <div style="display:grid;gap:8px;min-width:0"><span class="join-url">${esc(joinUrl())}</span><div class="roster">${rosterHtml()}</div></div></div>
    <div class="row"><button class="btn small" style="background:var(--ghost)" data-act="online">Vis stor QR-kode</button><span class="progress">${online.connected ? `${online.players.length} tilkoblet` : "Kobler til …"}</span></div></section>`;
}
function qrOverlay() {
  return `<div class="overlay" data-act="onlineclose-bg"><div class="qr-card" role="dialog" aria-label="Bli med fra mobilen">
    <div class="qr-box">${qrSvg(joinUrl())}</div>
    <div style="display:grid;gap:14px;min-width:0">
      <div class="eyebrow" style="color:var(--ghost)">Skann og bli med</div>
      <div class="room-code">${esc(state.room || "")}</div>
      <span class="join-url">${esc(joinUrl())}</span>
      <div class="roster">${rosterHtml()}</div>
      <div class="row"><button class="btn small" style="background:var(--ghost)" data-act="reopenbuzz">Åpne buzzeren igjen (B)</button><button class="btn ghost small" data-act="onlinenew">Nytt rom</button><button class="btn ghost small" data-act="onlineclose">Lukk</button></div>
    </div>
  </div></div>`;
}
function renderOnlineBtn() {
  const b = $("#btn-online"); if (!b) return;
  b.hidden = !online.on;
  b.classList.toggle("live", online.connected);
  b.textContent = state.room ? `${state.room} · ${online.players.length}` : "Mobilspill";
}

/* ================================================================== Handlinger */
const ACT = {
  go: d => go(d.to),
  start: () => go("intro"),
  mute: () => { state.muted = !state.muted; if (state.muted) { stopTune(); if (droneNodes) toggleDrone(); } save(); render(); syncDrone(); },
  drone: () => { toggleDrone(); syncDrone(); },
  fullscreen: () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} },
  scare: () => jumpscare(),
  buzz: d => buzz(+d.i),
  adj: d => addScore(+d.i, +d.d),
  pour: d => pour(+d.i, 1),
  wrong: d => { state.buzzGen++; addScore(+d.i, -(+d.d)); if (+d.s) setTimeout(() => pour(+d.i, +d.s), 350); },
  timer: d => startTimer(+d.s),
  addteam: () => { const used = new Set(state.teams.map(t => t.name)); state.teams.push({ name: NAME_POOL.find(n => !used.has(n)) || "Lag " + (state.teams.length + 1), score: 0, shots: 0 }); save(); render(); },
  rmteam: d => { state.teams.splice(+d.i, 1); state.wagers = {}; state.tfVotes = {}; state.finalMarks = {}; state.costume = {}; if (state.wheelTeam >= state.teams.length) state.wheelTeam = 0; if (state.roul.team >= state.teams.length) state.roul.team = 0; save(); render(); },
  randname: d => { const used = new Set(state.teams.map(t => t.name)); const pool = NAME_POOL.filter(n => !used.has(n)); state.teams[+d.i].name = pool[Math.floor(Math.random() * pool.length)] || state.teams[+d.i].name; save(); render(); },
  zero: () => { state.teams.forEach(t => { t.score = 0; t.shots = 0; }); save(); render(); },
  reset: () => {
    if (!state._confirmReset) { state._confirmReset = true; render(); setTimeout(() => { if (state._confirmReset) { state._confirmReset = false; if (state.screen === "setup") render(); } }, 4000); return; }
    const keep = { muted: state.muted, shotMode: state.shotMode, wrongShot: state.wrongShot, devilOn: state.devilOn, teams: state.teams.map(t => ({ name: t.name, score: 0, shots: 0 })) };
    state = Object.assign(fresh(), keep); save(); render();
  },
  open: d => {
    const b = d.b, key = `${d.c}-${d.q}`, devil = state.devilOn && (state.devils[b] || []).includes(key);
    state.current = { b, c: +d.c, i: +d.q, reveal: false, devil }; state.used[`${b}:${key}`] = true; save();
    if (devil) { sfx.thunder(); lightning(); quake(); banner("Djevelens dobbel!", "var(--blood)"); } else sfx.stinger();
    render();
  },
  reveal: () => { if (state.current) { state.current.reveal = true; stopTimer(); sfx.reveal(); save(); render(); } },
  closeq: () => {
    const b = state.current?.b; state.current = null; stopTimer(); save(); render();
    if (b && Object.keys(state.used).filter(k => k.startsWith(b + ":")).length === 25) banner("Tavla er tom!", "var(--slime)");
  },
  emojihint: () => { state.emojiHint = true; save(); render(); },
  emojireveal: () => { state.emojiReveal = true; state.emojiDone[state.emojiIdx] = true; stopTimer(); sfx.reveal(); save(); render(); },
  emojistep: d => emojiGo(state.emojiIdx + +d.d),
  emojigo: d => emojiGo(+d.k),
  playtune: () => {
    const len = playTune(TUNES[state.tuneIdx]); const eq = $(".eq");
    if (len && eq) { eq.classList.add("on"); later(() => { if (Date.now() >= tuneEnd - 50) { const e2 = $(".eq"); if (e2) e2.classList.remove("on"); } }, len * 1000 + 100); }
  },
  stoptune: () => stopTune(),
  tunereveal: () => { state.tuneReveal = true; state.tuneDone[state.tuneIdx] = true; sfx.reveal(); save(); render(); },
  tunestep: d => tuneGo(state.tuneIdx + +d.d),
  tunego: d => tuneGo(+d.k),
  sestart: () => seStart(),
  sepause: () => { clearPending(); state.seState = "paused"; state.seBuzz = null; save(); render(); },
  seresume: () => seStart(),
  seright: () => { const b = state.seBuzz, v = seValue(); addScore(b, v); state.seState = "solved"; state.seDone[state.seIdx] = true; save(); render(); placePlanchette(); rainCandy(30); },
  sewrong: () => { state.buzzGen++; const b = state.seBuzz; addScore(b, -100); if (state.shotMode) setTimeout(() => pour(b, 1), 300); state.seBuzz = null; seStart(); },
  sereveal: () => { clearPending(); state.seState = "revealed"; state.seDone[state.seIdx] = true; save(); render(); placePlanchette(); sfx.gong(); },
  sestep: d => seGo(state.seIdx + +d.d),
  sego: d => seGo(+d.k),
  tfvote: d => { const k = +d.k, v = d.v === "1"; state.tfVotes[k] = state.tfVotes[k] === v ? null : v; save(); render(); },
  tfreveal: () => {
    const item = TF[state.tfIdx]; state.tfReveal = true; stopTimer();
    let any = false;
    state.teams.forEach((_, k) => { if (state.tfVotes[k] === item.t) { addScore(k, 100, true); any = true; } });
    (any ? sfx.correct : sfx.wrong)(); save(); render();
  },
  tfnext: () => { state.tfIdx = Math.min(TF.length - 1, state.tfIdx + 1); state.tfReveal = false; state.tfVotes = {}; stopTimer(); save(); render(); },
  potstart: () => potStart(),
  potcat: () => { let n; do { n = Math.floor(Math.random() * POTATO.length); } while (n === state.potCat && POTATO.length > 1); state.potCat = n; save(); render(); },
  pothit: d => { const k = +d.k; addScore(k, -200, true); pour(k, 1, `${state.teams[k].name} ble sprengt!`); state.potHits[k] = (state.potHits[k] || 0) + 1; state.potState = "done"; save(); render(); },
  potagain: () => { ACT.potcat(); state.potState = "ready"; save(); render(); },
  wheelteam: d => { if (spinning) return; state.wheelTeam = +d.k; state.wheelResult = null; save(); render(); },
  spin,
  wheelapply: () => {
    const w = wheelSegs()[state.wheelResult], ti = state.wheelTeam, t = state.teams[ti]; if (!w || !t) return;
    if (w.kind === "bonus") addScore(ti, w.v);
    else if (w.kind === "double") { const g = Math.max(0, Math.min(t.score, 500)); if (g) addScore(ti, g); else banner("Ingenting å doble!", "var(--blood)"); }
    else if (w.kind === "steal") {
      let L = -1, best = -Infinity; state.teams.forEach((x, k) => { if (k !== ti && x.score > best) { best = x.score; L = k; } });
      if (L >= 0) { addScore(L, -w.v, true); addScore(ti, w.v); banner(`${t.name} rana ${state.teams[L].name}`, "var(--hex)"); }
    }
    else if (w.kind === "shots") pour(ti, w.n);
    else if (w.kind === "all") pour(allTeams(), 1, state.shotMode ? "Skål! Alle drikker!" : "Alle tar en sur godteri!");
    state.wheelApplied = true; save(); render();
  },
  wheelgive: d => { pour(+d.k, 1); state.wheelApplied = true; save(); render(); },
  wheelaward: d => { if (+d.v) addScore(state.wheelTeam, +d.v); state.wheelApplied = true; save(); render(); },
  wheelswap: d => {
    const a = state.teams[state.wheelTeam], b = state.teams[+d.k]; const tmp = a.score; a.score = b.score; b.score = tmp;
    state.wheelApplied = true; sfx.stinger(); banner("Sjelene er byttet!", "var(--ghost)"); save(); render();
  },
  skull: d => { const k = +d.k; state.costume[k] = state.costume[k] || {}; state.costume[k][d.c] = state.costume[k][d.c] === +d.n ? 0 : +d.n; sfx.click(); save(); render(); },
  costumeapply: () => {
    const sums = state.teams.map((_, k) => COSTUME_CRIT.reduce((s, c) => s + ((state.costume[k] || {})[c.k] || 0), 0));
    sums.forEach((s, k) => { if (s) addScore(k, s * 20, true); });
    state.costumeApplied = true; save(); render(); sfx.fanfare();
    const best = sums.indexOf(Math.max(...sums));
    if (sums[best] > 0) { banner(`Kveldens kostyme: ${state.teams[best].name}!`, tc(best), 3200); rain(["💀", "👑", "🎃", "🦇"], 70); }
  },
  glass: d => pickGlass(+d.n),
  glassgive: d => { pour(+d.k, 1, `${state.teams[state.roul.lastTeam].name} gir ${shotWord(1)} til ${state.teams[+d.k].name}!`); state.roul.resolved = true; advanceRoulTeam(); },
  roulteam: d => { state.roul.team = +d.k; save(); render(); },
  refill: () => { state.roul = { glasses: newGlasses(), flipped: {}, team: state.roul.team, last: null, resolved: true }; sfx.pour(); save(); render(); },
  finalswap: () => { state.finalIdx = (state.finalIdx + 1) % FINALS.length; save(); render(); },
  finalq: () => { state.finalStage = "question"; save(); sfx.thunder(); lightning(); render(); startTimer(45); },
  finaltimer: () => startTimer(45),
  finalreveal: () => { state.finalStage = "reveal"; stopTimer(); sfx.reveal(); save(); render(); },
  finalmark: d => { const k = +d.k, v = d.v === "1"; state.finalMarks[k] = state.finalMarks[k] === v ? null : v; save(); render(); },
  finalapply: () => {
    const losers = [];
    state.teams.forEach((t, k) => {
      const w = wagerOf(k);
      if (state.finalMarks[k] === true) addScore(k, w, true);
      else if (state.finalMarks[k] === false) { addScore(k, -w, true); losers.push(k); }
    });
    state.finalApplied = true; sfx.fanfare(); save(); render();
    if (state.shotMode && losers.length) setTimeout(() => pour(losers, 1, "Feil i finalen: skål for tapet!"), 900);
  },
  tieopen: () => { state.tieOpen = true; state.tieReveal = false; sfx.thunder(); lightning(); save(); render(); },
  tiereveal: () => { state.tieReveal = true; sfx.reveal(); save(); render(); },
  tienext: () => { state.tieIdx++; state.tieReveal = false; save(); render(); },
  tiewin: d => { addScore(+d.k, 100); state.tieOpen = false; state.tieReveal = false; state.tieIdx++; save(); render(); rainCandy(); sfx.fanfare(); },
  lastshot: d => pour(+d.i, 1, `Siste skål til ${state.teams[+d.i].name}!`),
  celebrate: () => { rainCandy(); sfx.fanfare(); },
  witch: () => drawWitch(),
  online: () => { if (!state.room) { onlineCreate(); return; } online.showQR = !online.showQR; renderOverlay(); },
  onlinecreate: () => onlineCreate(),
  onlinenew: () => { osend({ t: "clearPhotos" }); online.photos = {}; onlineCreate(); },
  onlineclose: () => { online.showQR = false; renderOverlay(); },
  "onlineclose-bg": (d, el, e) => { if (e.target === el) ACT.onlineclose(); },
  reopenbuzz: () => { state.buzzGen++; save(); syncOnline(); banner("Buzzeren er åpen!", "var(--ghost)"); },
  crowdcostume: () => {
    state.teams.forEach((_, k) => { const c = crowdCostume(k); if (c) { const v = Math.max(1, Math.min(5, Math.round(c.avg))); state.costume[k] = { scary: v, creative: v, effort: v }; } });
    save(); render();
  },
  witchclose: () => { state.witchCard = null; save(); renderOverlay(); },
  "witchclose-bg": (d, el, e) => { if (e.target === el) ACT.witchclose(); },
  witchact: () => {
    const c = state.witchCard; if (!c) return;
    if (c.act === "lastbonus") addScore(lastIdx(), 200);
    if (c.act === "lastbonus100") { addScore(lastIdx(), 100, true); pour(allTeams(), 1, "Gravøl! Alle drikker!"); }
    if (c.act === "robin") { const L = leaderIdx(), B = lastIdx(); if (L !== B) { addScore(L, -100, true); addScore(B, 100); } }
    c.done = true; save(); renderOverlay();
  },
  witchaward: d => { addScore(+d.k, 200); state.witchCard.done = true; save(); renderOverlay(); }
};
function emojiGo(k) { state.emojiIdx = Math.max(0, Math.min(EMOJI.length - 1, k)); state.emojiReveal = false; state.emojiHint = false; stopTimer(); save(); render(); }
function tuneGo(k) { stopTune(); state.tuneIdx = Math.max(0, Math.min(TUNES.length - 1, k)); state.tuneReveal = false; save(); render(); }
function seGo(k) { clearPending(); state.seIdx = Math.max(0, Math.min(SEANCE.length - 1, k)); state.seShown = 0; state.seState = "idle"; state.seBuzz = null; save(); render(); }
function syncDrone() { $("#btn-drone").setAttribute("aria-pressed", String(!!droneNodes)); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.team != null) { state.teams[+t.dataset.team].name = t.value || "Navnløse"; save(); renderScores(); }
  if (t.dataset.wager != null) { state.wagers[+t.dataset.wager] = t.value === "" ? 0 : +t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.setting) { state[t.dataset.setting] = t.checked; if (t.dataset.setting === "shotMode") state.wheelResult = null; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (online.showQR) ACT.onlineclose(); else if (state.witchCard) ACT.witchclose(); else if (state.current) ACT.closeq(); return; }
  if (/^[1-6]$/.test(k)) { buzz(+k - 1); return; }
  if (k === " ") {
    e.preventDefault();
    const s = state.screen;
    if ((s === "board" || s === "board2") && state.current && !state.current.reveal) ACT.reveal();
    else if (s === "emoji" && !state.emojiReveal) ACT.emojireveal();
    else if (s === "tune") ACT.playtune();
    else if (s === "seance" && state.seState === "idle") seStart();
    else if (s === "tf" && !state.tfReveal) ACT.tfreveal();
    else if (s === "potato" && state.potState === "ready") potStart();
    else if (s === "wheel" && !spinning) spin();
    else if (s === "final" && state.finalStage === "question") ACT.finalreveal();
    return;
  }
  if (k === "h") drawWitch();
  if (k === "b") ACT.reopenbuzz();
  if (k === "j") jumpscare();
  if (k === "t") startTimer(20);
  if (k === "m") ACT.mute();
  if (k === "f") ACT.fullscreen();
  const step = k === "arrowright" ? 1 : k === "arrowleft" ? -1 : 0;
  if (step) {
    if (state.screen === "emoji") emojiGo(state.emojiIdx + step);
    if (state.screen === "tune") tuneGo(state.tuneIdx + step);
    if (state.screen === "seance") seGo(state.seIdx + step);
  }
});

/* ================================================================== Oppstart */
function start(seed) {
  state = load(seed && seed.state);
  state._confirmReset = false;
  if (state.screen === "intro") state.screen = "setup";
  if (!state.roul || !state.roul.glasses) state.roul = fresh().roul;
  fxInit(); render(); onlineInit();
  if (state.screen === "end") rainCandy(60);
  window.claude?.hot?.snapshot?.(() => ({ state }));
  if (document.fonts) document.fonts.ready.then(() => { if (state.screen === "wheel") drawWheel(); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
