<title>Spøkelsesshowet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: et TV-studio om natta. Topplinje med rundene, scenen i midten, poengtavla som en rampe nederst. */
:root {
  color-scheme: dark;
  --night: #0d0810;
  --crypt: #191120;
  --crypt-2: #241a2d;
  --crypt-3: #31243b;
  --bone: #f2e8d5;
  --ash: #a898ab;
  --pumpkin: #ff7b1c;
  --slime: #a6e05a;
  --blood: #e0435a;
  --hex: #a77bff;
  --ghost: #6fd0ea;
  --candle: #f2c94c;
  --line: rgba(242, 232, 213, .13);
  --ink-on-bright: #1a0f06;
  --f-display: "Creepster", "Impact", "Haettenschweiler", fantasy;
  --f-body: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2a1630 0%, var(--night) 60%) fixed, var(--night);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#flash { position: fixed; inset: 0; background: var(--bone); opacity: 0; pointer-events: none; z-index: 50; }
#flash.on { animation: lightning .9s ease-out; }
@keyframes lightning { 0%{opacity:0} 6%{opacity:.85} 12%{opacity:.1} 20%{opacity:.6} 100%{opacity:0} }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* Topplinje */
header.top { border-bottom: 1px solid var(--line); background: rgba(13, 8, 16, .75); backdrop-filter: blur(6px); }
.top-inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { font-family: var(--f-display); font-size: 1.6rem; color: var(--pumpkin); letter-spacing: .04em; white-space: nowrap; background: none; border: 0; cursor: pointer; padding: 0; line-height: 1; }
nav.rounds { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
nav.rounds::-webkit-scrollbar { display: none; }
.tab { font: 600 .85rem/1 var(--f-body); color: var(--ash); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--f-mono); font-size: .75rem; opacity: .7; }
.tab:hover { color: var(--bone); border-color: var(--line); }
.tab[aria-current="true"] { color: var(--ink-on-bright); background: var(--pumpkin); }
.tools { display: flex; gap: 6px; align-items: center; }
.icon-btn { font: 500 .8rem/1 var(--f-mono); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
.icon-btn:hover { background: var(--crypt-3); }
.icon-btn[aria-pressed="true"] { border-color: var(--slime); color: var(--slime); }
.timer-pill { font: 500 1rem/1 var(--f-mono); padding: 8px 12px; border-radius: 8px; background: var(--crypt-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: center; }
.timer-pill.low { background: var(--blood); color: var(--bone); border-color: var(--blood); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

/* Scenen */
main.stage { overflow-y: auto; overflow-x: hidden; }
.stage-inner { grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: grid; gap: 24px; }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--slime); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.round-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: .95; color: var(--bone); letter-spacing: .02em; }
.round-title .accent { color: var(--pumpkin); }
.lede { color: var(--ash); max-width: 62ch; margin: 0; }
.head { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { font: 700 1rem/1 var(--f-body); border-radius: 12px; padding: 14px 20px; cursor: pointer; border: 2px solid transparent; color: var(--ink-on-bright); background: var(--pumpkin); transition: transform .12s ease, filter .12s; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--bone); }
.btn.slime { background: var(--slime); }
.btn.blood { background: var(--blood); color: var(--bone); }
.btn.small { font-size: .85rem; padding: 9px 12px; border-radius: 9px; }
.btn.big { font-size: 1.2rem; padding: 18px 28px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }

/* Oppsett */
.hero { display: grid; gap: 14px; padding-block: 12px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.4rem, 11vw, 8rem); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 40px rgba(255, 123, 28, .35); letter-spacing: .02em; }
.hero h1 span { display: block; color: var(--bone); font-size: .42em; text-shadow: none; letter-spacing: .08em; }
.setup-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: rgba(25, 17, 32, .85); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.1rem; font-weight: 800; }
.team-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 50%; }
.team-row input { font: 600 1rem var(--f-body); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.round-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.round-list li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
.round-list .num { font-family: var(--f-display); font-size: 1.8rem; color: var(--pumpkin); line-height: 1; }
.round-list b { display: block; }
.round-list span { color: var(--ash); font-size: .92rem; }
.keys { font: .8rem/1.6 var(--f-mono); color: var(--ash); }
.keys kbd { font: inherit; color: var(--bone); background: var(--crypt-3); border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); }

/* Skrekk-tavla */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; min-width: 640px; }
.cat { font: 800 .95rem/1.15 var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--candle); text-align: center; padding: 14px 8px; border-bottom: 2px solid var(--pumpkin); display: flex; align-items: end; justify-content: center; min-height: 3.6rem; text-wrap: balance; }
.tile { font-family: var(--f-display); font-size: clamp(1.8rem, 3.6vw, 2.8rem); color: var(--pumpkin); background: linear-gradient(180deg, var(--crypt-2), var(--crypt)); border: 1px solid var(--line); border-radius: 14px; aspect-ratio: 16 / 10; max-width: 100%; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-3px) rotate(-.6deg); border-color: var(--pumpkin); box-shadow: 0 10px 30px rgba(255, 123, 28, .2); }
.tile.used { color: transparent; background: rgba(25, 17, 32, .4); cursor: default; border-style: dashed; transform: none; box-shadow: none; position: relative; }
.tile.used::after { content: "✝"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--crypt-3); font-family: var(--f-body); font-size: 1.6rem; }
.progress { font: .85rem var(--f-mono); color: var(--ash); }

/* Spørsmålskort */
.card { background: linear-gradient(180deg, rgba(36, 26, 45, .95), rgba(25, 17, 32, .95)); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
.card .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 500 .85rem var(--f-mono); color: var(--ash); letter-spacing: .08em; text-transform: uppercase; }
.card .meta b { color: var(--pumpkin); font-weight: 500; }
.q { font: 800 clamp(1.5rem, 3.6vw, 2.6rem)/1.15 var(--f-body); text-wrap: balance; margin: 0; }
.answer { font: 700 clamp(1.2rem, 2.8vw, 1.8rem)/1.25 var(--f-body); color: var(--slime); padding: 16px 20px; border-radius: 14px; background: rgba(166, 224, 90, .08); border: 1px dashed rgba(166, 224, 90, .45); animation: rise .35s ease-out; }
.answer small { display: block; font: 400 .95rem/1.45 var(--f-body); color: var(--ash); margin-top: 6px; }
@keyframes rise { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.award { display: grid; gap: 10px; }
.award-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.award-team { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.award-team .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chipbtn { font: 600 .85rem/1 var(--f-mono); border-radius: 8px; padding: 9px 10px; border: 0; cursor: pointer; }
.chipbtn.plus { background: var(--slime); color: var(--ink-on-bright); }
.chipbtn.minus { background: var(--crypt-3); color: var(--bone); }
.chipbtn.on { outline: 2px solid var(--bone); }

/* Emoji */
.emoji-stage { font-size: clamp(3.4rem, 12vw, 8rem); line-height: 1.1; text-align: center; letter-spacing: .08em; padding-block: 10px; filter: drop-shadow(0 0 30px rgba(167, 123, 255, .35)); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.hint { text-align: center; color: var(--candle); font-weight: 600; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--crypt-3); border: 0; padding: 0; cursor: pointer; }
.dot.done { background: var(--hex); }
.dot.cur { background: var(--pumpkin); transform: scale(1.3); }

/* Sant eller skrøne */
.verdict { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 6rem); line-height: 1; text-align: center; animation: rise .35s ease-out; }
.verdict.true { color: var(--slime); }
.verdict.false { color: var(--blood); }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.vote { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); }
.vote .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vote button { font: 600 .85rem/1 var(--f-body); border-radius: 8px; padding: 9px 10px; border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); cursor: pointer; }
.vote button.sel-t { background: var(--slime); color: var(--ink-on-bright); border-color: var(--slime); }
.vote button.sel-f { background: var(--blood); color: var(--bone); border-color: var(--blood); }
.vote.right { border-color: var(--slime); }
.vote.wrong { opacity: .55; }

/* Hjulet */
.wheel-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.wheel-box { position: relative; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--bone); filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); z-index: 2; }
.team-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.team-pick button { font: 700 .9rem/1 var(--f-body); padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--bone); cursor: pointer; }
.team-pick button[aria-pressed="true"] { color: var(--ink-on-bright); }
.result { display: grid; gap: 12px; padding: 20px; border-radius: 18px; background: var(--crypt); border: 1px solid var(--line); animation: rise .35s ease-out; }
.result h3 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: 1; color: var(--pumpkin); }
.result p { margin: 0; color: var(--bone); }

/* Finale */
.wager-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.wager { padding: 14px; border-radius: 14px; background: var(--crypt); border: 1px solid var(--line); display: grid; gap: 8px; }
.wager .nm { font-weight: 800; }
.wager .sub { font: .8rem var(--f-mono); color: var(--ash); }
.wager input { font: 500 1.4rem var(--f-mono); color: var(--bone); background: var(--crypt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.big-timer { font: 500 clamp(4rem, 14vw, 9rem)/1 var(--f-mono); text-align: center; font-variant-numeric: tabular-nums; color: var(--candle); }

/* Kåring */
.podium { display: grid; gap: 12px; }
.winner { text-align: center; display: grid; gap: 8px; padding-block: 10px; }
.winner .crown { font-size: 3.4rem; animation: float 3s ease-in-out infinite; }
.winner h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3rem, 10vw, 6.5rem); line-height: .9; color: var(--pumpkin); text-shadow: 0 0 50px rgba(255, 123, 28, .45); overflow-wrap: anywhere; }
.rank { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 14px; background: var(--crypt); border: 1px solid var(--line); }
.rank .pos { font-family: var(--f-display); font-size: 2rem; color: var(--ash); }
.rank .nm { font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
.rank .sc { font: 500 1.4rem var(--f-mono); font-variant-numeric: tabular-nums; }
.rank:first-child { border-color: var(--pumpkin); }
.rank:first-child .pos { color: var(--pumpkin); }

/* Poengtavla */
footer.scores { border-top: 1px solid var(--line); background: rgba(13, 8, 16, .9); backdrop-filter: blur(6px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.scores-inner { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 8px; overflow-x: auto; padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.score { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 2px 8px; padding: 8px 10px 8px 14px; border-radius: 12px; background: var(--crypt); border: 1px solid var(--line); overflow: visible; }
.score::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--tc); }
.score .nm { font: 700 .85rem/1.2 var(--f-body); color: var(--ash); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.score .pts { font: 500 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--bone); }
.score .adj { grid-row: 1 / span 2; grid-column: 2; display: grid; gap: 4px; align-content: center; }
.score .adj button { font: 500 .75rem/1 var(--f-mono); border: 1px solid var(--line); background: var(--crypt-2); color: var(--bone); border-radius: 6px; padding: 5px 7px; cursor: pointer; }
.score.leader .pts { color: var(--candle); }
.score.buzzed { border-color: var(--tc); box-shadow: 0 0 0 2px var(--tc), 0 0 30px var(--tc); }
.score.up { animation: bumpUp .6s ease-out; }
.score.down { animation: bumpDown .6s ease-out; }
@keyframes bumpUp { 30% { transform: translateY(-6px); background: rgba(166, 224, 90, .18); } }
@keyframes bumpDown { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); background: rgba(224, 67, 90, .2); } 60% { transform: translateX(-3px); } }
.floater { position: absolute; right: 12px; top: -8px; font: 500 1.1rem var(--f-mono); pointer-events: none; animation: floatUp 1.1s ease-out forwards; }
.floater.pos { color: var(--slime); }
.floater.neg { color: var(--blood); }
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

/* Buzz-banner */
.buzz-banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 40; padding: 18px 30px; border-radius: 18px; font-family: var(--f-display); font-size: clamp(2rem, 7vw, 4.4rem); line-height: 1; color: var(--ink-on-bright); box-shadow: 0 20px 60px rgba(0, 0, 0, .6); animation: slam .35s cubic-bezier(.2, 1.6, .4, 1); text-align: center; max-width: calc(100% - 32px); overflow-wrap: anywhere; }
@keyframes slam { from { transform: translateX(-50%) scale(.4) rotate(-6deg); opacity: 0; } }

@media (max-width: 820px) {
  .setup-grid, .wheel-layout { grid-template-columns: minmax(0, 1fr); }
  .brand { font-size: 1.3rem; }
  .tools .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="top-inner">
      <button class="brand" data-act="go" data-to="setup" title="Til oppsett">Spøkelsesshowet</button>
      <nav class="rounds" id="nav" aria-label="Runder"></nav>
      <div class="tools">
        <span class="timer-pill" id="timer" hidden>0:20</span>
        <button class="icon-btn" id="btn-sound" data-act="mute" aria-pressed="true" title="Lydeffekter (M)">Lyd</button>
        <button class="icon-btn hide-sm" id="btn-drone" data-act="drone" aria-pressed="false" title="Uhyggelig bakgrunnslyd">Stemning</button>
        <button class="icon-btn hide-sm" data-act="fullscreen" title="Fullskjerm (F)">Fullskjerm</button>
      </div>
    </div>
  </header>
  <main class="stage" id="stage"><div class="stage-inner" id="view"></div></main>
  <footer class="scores"><div class="scores-inner" id="scores" aria-live="polite"></div></footer>
</div>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ Innhold */
const TEAM_COLORS = ["var(--pumpkin)", "var(--slime)", "var(--hex)", "var(--blood)", "var(--ghost)", "var(--candle)"];
const NAME_POOL = ["Gresskarhodene", "Vampyrklubben", "Heksegjengen", "Zombie-ekspressen", "Spøkelsesjegerne", "Varulvene fra Valdres", "Huldrelaget", "Fossegrimene", "Draugen & co", "Nøkkens nevøer", "Benrangel-bandet", "De udøde revisorene", "Kostebil-kartellet", "Sølvkule-sjappa"];

const ROUNDS = [
  { id: "board", n: 1, name: "Skrekk-tavla", desc: "Fem kategorier, 25 spørsmål. Velg en rute, svar riktig og ta poengene. Feil svar koster like mye." },
  { id: "emoji", n: 2, name: "Emoji-krypten", desc: "Gjett skrekkfilmen fra emojiene. Første lag som roper riktig tar 200. Hint halverer." },
  { id: "tf", n: 3, name: "Sant eller skrøne", desc: "Lynrunde. Alle lag svarer samtidig. Riktig gir 100." },
  { id: "wheel", n: 4, name: "Gresskarlotteriet", desc: "Snurr hjulet. Bonuser, forbannelser, tyveri og pinlige utfordringer." },
  { id: "final", n: 5, name: "Den siste vandringen", desc: "Sats poengene på ett siste spørsmål. Alt kan snu." }
];

const BOARD = [
  { cat: "Skrekkfilm", qs: [
    { q: "I hvilken film skriver en liten gutt «REDRUM» på døra?", a: "The Shining (1980)", x: "Les baklengs: MURDER." },
    { q: "Hva heter morderen med hockeymaske i «Fredag den 13.»-filmene?", a: "Jason Voorhees", x: "I den aller første filmen er det faktisk moren hans som er morderen." },
    { q: "Hvilken regissør laget «Psycho» (1960)?", a: "Alfred Hitchcock" },
    { q: "Hva spør morderen offeret om i telefonen i starten av «Scream»?", a: "«Hva er din favoritt-skrekkfilm?»", x: "«What's your favorite scary movie?»" },
    { q: "Hva heter den fiktive småbyen i Maine der Stephen Kings «It» utspiller seg?", a: "Derry" }
  ]},

let ac = null, droneNodes = null;
function audio() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, dur, { type = "sine", vol = .18, at = 0, to = null, vib = 0 } = {}) {
  if (state.muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  if (vib) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = 6; lg.gain.value = vib; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur); }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol = .5, freq = 400) {
  if (state.muted) return; const a = audio(); if (!a) return;
  const len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  correct() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, { type: "triangle", at: i * .08, vol: .16 })); },
  wrong() { tone(150, .55, { type: "sawtooth", to: 60, vol: .14 }); tone(155, .55, { type: "sawtooth", to: 62, vol: .1 }); },
  buzz() { tone(330, .12, { type: "square", vol: .1 }); tone(330, .14, { type: "square", vol: .1, at: .16 }); },
  stinger() { tone(260, 1.4, { to: 780, vib: 18, vol: .14 }); tone(780, 1, { at: 1.3, to: 220, vib: 22, vol: .12 }); },
  thunder() { noise(2.2, .9, 300); },
  tick() { tone(1400, .04, { type: "square", vol: .05 }); },
  click() { tone(900, .03, { type: "square", vol: .04 }); },
  gong() { tone(98, 2.4, { vol: .25 }); tone(147, 2, { vol: .12 }); tone(196, 1.6, { type: "triangle", vol: .06 }); },
  reveal() { tone(392, .18, { type: "triangle" }); tone(587, .4, { type: "triangle", at: .12 }); },
  fanfare() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .32, { type: "sawtooth", at: i * .14, vol: .07 })); }
};
function toggleDrone() {
  const a = audio(); if (!a) return;
  if (droneNodes) { droneNodes.g.gain.setTargetAtTime(0, a.currentTime, .4); const n = droneNodes; setTimeout(() => n.oscs.forEach(o => o.stop()), 1500); droneNodes = null; return false; }
  const g = a.createGain(), f = a.createBiquadFilter(); g.gain.value = 0; f.type = "lowpass"; f.frequency.value = 380;
  const oscs = [55, 55.6, 82.4, 110.9].map((fr, i) => { const o = a.createOscillator(); o.type = i < 2 ? "sawtooth" : "sine"; o.frequency.value = fr; o.connect(f); o.start(); return o; });
  const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = .08; lg.gain.value = 220; l.connect(lg).connect(f.frequency); l.start(); oscs.push(l);
  f.connect(g).connect(a.destination); g.gain.setTargetAtTime(.07, a.currentTime, 1.2);
  droneNodes = { g, oscs }; return true;
}

/* Bakgrunn: tåke, flaggermus og (ved seier) fallende gresskar */
const fx = { c: $("#fx"), parts: [], bats: [], confetti: [] };
function fxInit() {
  const ctx = fx.c.getContext("2d");
  const resize = () => { fx.c.width = innerWidth * devicePixelRatio; fx.c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 26; i++) fx.parts.push({ x: Math.random() * innerWidth, y: innerHeight * (.55 + Math.random() * .5), r: 80 + Math.random() * 180, vx: .1 + Math.random() * .25, a: .03 + Math.random() * .05 });
  for (let i = 0; i < 4; i++) fx.bats.push(newBat());
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  function frame() {
    t += 1; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of fx.parts) {
      p.x += still ? 0 : p.vx; if (p.x - p.r > innerWidth) p.x = -p.r;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(190,170,210,${p.a})`); g.addColorStop(1, "rgba(190,170,210,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!still) {
      ctx.fillStyle = "rgba(8,4,10,.85)";
      for (const b of fx.bats) {
        b.x += b.vx; b.y += Math.sin(t * .05 + b.ph) * .6;
        if (b.x > innerWidth + 40 || b.x < -40) Object.assign(b, newBat());
        const flap = Math.sin(t * .35 + b.ph) * b.s * .6;
        ctx.beginPath(); ctx.moveTo(b.x, b.y);
        ctx.quadraticCurveTo(b.x - b.s * .6, b.y - flap - b.s * .4, b.x - b.s * 1.4, b.y - flap);
        ctx.quadraticCurveTo(b.x - b.s * .7, b.y - flap * .2, b.x, b.y + b.s * .2);
        ctx.quadraticCurveTo(b.x + b.s * .7, b.y - flap * .2, b.x + b.s * 1.4, b.y - flap);
        ctx.quadraticCurveTo(b.x + b.s * .6, b.y - flap - b.s * .4, b.x, b.y);
        ctx.fill();
      }
      for (let i = fx.confetti.length - 1; i >= 0; i--) {
        const c = fx.confetti[i]; c.y += c.vy; c.x += Math.sin((t + c.ph) * .03) * .8; c.rot += c.vr;
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.font = `${c.s}px serif`; ctx.fillText(c.ch, -c.s / 2, c.s / 2); ctx.restore();
        if (c.y > innerHeight + 40) fx.confetti.splice(i, 1);
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}
function newBat() { const left = Math.random() < .5; return { x: left ? -30 : innerWidth + 30, y: 60 + Math.random() * innerHeight * .4, vx: (left ? 1 : -1) * (1.2 + Math.random() * 1.6), s: 8 + Math.random() * 10, ph: Math.random() * 10 }; }
function rainCandy(n = 90) {
  const set = ["🎃", "🦇", "👻", "🍬", "💀", "🕷️", "🍭"];
  for (let i = 0; i < n; i++) fx.confetti.push({ ch: set[i % set.length], x: Math.random() * innerWidth, y: -40 - Math.random() * innerHeight, vy: 1.5 + Math.random() * 3, s: 18 + Math.random() * 22, rot: 0, vr: (Math.random() - .5) * .1, ph: Math.random() * 100 });
}

/* ------------------------------------------------------------------ Timer */
const timer = { end: 0, id: 0, onEnd: null };
function startTimer(sec, onEnd) {
  stopTimer(); timer.end = Date.now() + sec * 1000; timer.onEnd = onEnd || null;
  const el = $("#timer"); el.hidden = false; let last = -1;
  const step = () => {
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 5 && left > 0);
    const bt = $("#bigtimer"); if (bt) bt.textContent = el.textContent;
    if (left !== last) { if (left <= 5 && left > 0) sfx.tick(); last = left; }
    if (left === 0) { stopTimer(true); sfx.gong(); lightning(); if (timer.onEnd) timer.onEnd(); return; }
  };
  step(); timer.id = setInterval(step, 200);
}
function stopTimer(keep) { clearInterval(timer.id); timer.id = 0; const el = $("#timer"); el.classList.remove("low"); if (!keep) el.hidden = true; }

}

/* ------------------------------------------------------------------ Hjulet */
const SEG = Math.PI * 2 / WHEEL.length;
function drawWheel() {
  const cv = $("#wheel"); if (!cv) return;
  const x = cv.getContext("2d"), W = cv.width, R = W / 2 - 10, cx = W / 2, cy = W / 2;
  x.clearRect(0, 0, W, W);
  x.save(); x.translate(cx, cy); x.rotate(state.wheelRot);
  WHEEL.forEach((s, i) => {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, i * SEG, (i + 1) * SEG); x.closePath();
    x.fillStyle = s.color; x.globalAlpha = i % 2 ? .85 : 1; x.fill(); x.globalAlpha = 1;
    x.strokeStyle = "#0d0810"; x.lineWidth = 6; x.stroke();
    x.save(); x.rotate(i * SEG + SEG / 2); x.textAlign = "right"; x.textBaseline = "middle";
    x.fillStyle = "#1a0f06"; x.font = "64px Creepster, Impact, fantasy"; x.fillText(s.label, R - 34, 0); x.restore();
  });
  x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.lineWidth = 14; x.strokeStyle = "#0d0810"; x.stroke();
  x.restore();
  // Gresskar i midten
  x.beginPath(); x.arc(cx, cy, 78, 0, Math.PI * 2); x.fillStyle = "#0d0810"; x.fill();
  x.font = "92px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("🎃", cx, cy + 6);
}
function segmentAtPointer(rot) {
  const a = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
  return Math.floor(a / SEG);
}
let spinning = false;
function spin() {
  if (spinning) return; spinning = true;
  state.wheelResult = null; state.wheelApplied = false; render();
  const btn = $("#spin"); if (btn) btn.disabled = true;
  const start = state.wheelRot, target = start + Math.PI * 2 * (5 + Math.random() * 3) + Math.random() * Math.PI * 2;
  const dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 5200, t0 = performance.now();
  let lastSeg = segmentAtPointer(start);
  const ease = t => 1 - Math.pow(1 - t, 4);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    state.wheelRot = start + (target - start) * ease(p); drawWheel();
    const s = segmentAtPointer(state.wheelRot); if (s !== lastSeg) { sfx.click(); lastSeg = s; }
    if (p < 1) return requestAnimationFrame(step);
    spinning = false; state.wheelRot %= Math.PI * 2;
    state.wheelResult = segmentAtPointer(state.wheelRot); save();
    const w = WHEEL[state.wheelResult];
    if (w.v < 0) { sfx.thunder(); lightning(); } else sfx.reveal();
    render();
  };
  requestAnimationFrame(step);
}

const ACT = {
  go: d => go(d.to),
  start: () => { sfx.stinger(); setTimeout(() => { sfx.thunder(); lightning(); }, 900); go("board"); },
  mute: () => { state.muted = !state.muted; save(); render(); if (state.muted && droneNodes) { toggleDrone(); syncDrone(); } },
  drone: () => { toggleDrone(); syncDrone(); },
  fullscreen: () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} },
  buzz: d => buzz(+d.i),
  adj: d => addScore(+d.i, +d.d),
  timer: d => startTimer(+d.s),
  addteam: () => { const used = new Set(state.teams.map(t => t.name)); state.teams.push({ name: NAME_POOL.find(n => !used.has(n)) || "Lag " + (state.teams.length + 1), score: 0 }); save(); render(); },
  rmteam: d => { state.teams.splice(+d.i, 1); state.wagers = {}; state.tfVotes = {}; state.finalMarks = {}; if (state.wheelTeam >= state.teams.length) state.wheelTeam = 0; save(); render(); },
  randname: d => { const used = new Set(state.teams.map(t => t.name)); const pool = NAME_POOL.filter(n => !used.has(n)); state.teams[+d.i].name = pool[Math.floor(Math.random() * pool.length)] || state.teams[+d.i].name; save(); render(); },
  zero: () => { state.teams.forEach(t => t.score = 0); save(); render(); },
  reset: () => {
    if (!state._confirmReset) { state._confirmReset = true; render(); setTimeout(() => { if (state._confirmReset) { state._confirmReset = false; if (state.screen === "setup") render(); } }, 4000); return; }
    const muted = state.muted; state = fresh(); state.muted = muted; save(); render();
  },
  open: d => { state.current = { c: +d.c, i: +d.q, reveal: false }; state.used[d.c + "-" + d.q] = true; save(); sfx.stinger(); render(); },
  reveal: () => { if (state.current) { state.current.reveal = true; stopTimer(); sfx.reveal(); save(); render(); } },
  closeq: () => {
    state.current = null; stopTimer(); save(); render();
    if (Object.keys(state.used).length === 25) banner("Tavla er tom!", "var(--slime)");
  },
  emojihint: () => { state.emojiHint = true; save(); render(); },
  emojireveal: () => { state.emojiReveal = true; state.emojiDone[state.emojiIdx] = true; stopTimer(); sfx.reveal(); save(); render(); },
  emojistep: d => { emojiGo(state.emojiIdx + +d.d); },
  emojigo: d => emojiGo(+d.k),
  tfvote: d => { const k = +d.k, v = d.v === "1"; state.tfVotes[k] = state.tfVotes[k] === v ? undefined : v; save(); render(); },
  tfreveal: () => {
    const item = TF[state.tfIdx]; state.tfReveal = true; stopTimer();
    let any = false;
    state.teams.forEach((_, k) => { if (state.tfVotes[k] === item.t) { addScore(k, 100, true); any = true; } });
    (any ? sfx.correct : sfx.wrong)(); save(); render();
  },
  tfnext: () => { state.tfIdx = Math.min(TF.length - 1, state.tfIdx + 1); state.tfReveal = false; state.tfVotes = {}; stopTimer(); save(); render(); },
  wheelteam: d => { if (spinning) return; state.wheelTeam = +d.k; state.wheelResult = null; save(); render(); },
  spin,
  wheelapply: () => {
    const w = WHEEL[state.wheelResult], ti = state.wheelTeam, t = state.teams[ti]; if (!w || !t) return;
    if (w.kind === "bonus") addScore(ti, w.v);
    else if (w.kind === "double") addScore(ti, Math.max(0, Math.min(t.score, 500)) || 0, false);
    else if (w.kind === "steal") {
      let L = -1, best = -Infinity; state.teams.forEach((x, k) => { if (k !== ti && x.score > best) { best = x.score; L = k; } });
      if (L >= 0) { addScore(L, -w.v, true); addScore(ti, w.v); banner(`${t.name} rana ${state.teams[L].name}`, "var(--hex)"); }
    }
    state.wheelApplied = true; save(); render();
  },
  wheelaward: d => { if (+d.v) addScore(state.wheelTeam, +d.v); state.wheelApplied = true; save(); render(); },
  wheelswap: d => {
    const a = state.teams[state.wheelTeam], b = state.teams[+d.k]; const tmp = a.score; a.score = b.score; b.score = tmp;
    state.wheelApplied = true; sfx.stinger(); banner("Sjelene er byttet!", "var(--ghost)"); save(); render();
  },
  finalswap: () => { state.finalIdx = (state.finalIdx + 1) % FINALS.length; save(); render(); },
  finalq: () => { state.finalStage = "question"; save(); sfx.thunder(); lightning(); render(); startTimer(45, () => {}); },
  finaltimer: () => startTimer(45),
  finalreveal: () => { state.finalStage = "reveal"; stopTimer(); sfx.reveal(); save(); render(); },
  finalmark: d => { const k = +d.k, v = d.v === "1"; state.finalMarks[k] = state.finalMarks[k] === v ? undefined : v; save(); render(); },
  finalapply: () => {
    state.teams.forEach((t, k) => {
      const w = Math.max(0, Math.min(+state.wagers[k] || 0, Math.max(t.score, 300)));
      if (state.finalMarks[k] === true) addScore(k, w, true); else if (state.finalMarks[k] === false) addScore(k, -w, true);
    });
    state.finalApplied = true; sfx.fanfare(); save(); render();
  },
  celebrate: () => { rainCandy(); sfx.fanfare(); }
};
function emojiGo(k) {
  state.emojiIdx = Math.max(0, Math.min(EMOJI.length - 1, k)); state.emojiReveal = false; state.emojiHint = false; stopTimer(); save(); render();
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.team != null) { state.teams[+t.dataset.team].name = t.value || "Navnløse"; save(); renderScores(); }
  if (t.dataset.wager != null) { state.wagers[+t.dataset.wager] = t.value === "" ? 0 : +t.value; save(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (/^[1-6]$/.test(k)) { buzz(+k - 1); return; }
  if (k === " ") {
    e.preventDefault();
    if (state.screen === "board" && state.current && !state.current.reveal) ACT.reveal();
    else if (state.screen === "emoji" && !state.emojiReveal) ACT.emojireveal();
    else if (state.screen === "tf" && !state.tfReveal) ACT.tfreveal();
    else if (state.screen === "final" && state.finalStage === "question") ACT.finalreveal();
    return;
  }
  if (k === "t") startTimer(20);
  if (k === "m") ACT.mute();
  if (k === "f") ACT.fullscreen();
  if (k === "escape" && state.current) ACT.closeq();
  if (k === "arrowright" && state.screen === "emoji") emojiGo(state.emojiIdx + 1);
  if (k === "arrowleft" && state.screen === "emoji") emojiGo(state.emojiIdx - 1);
});

/* ------------------------------------------------------------------ Oppstart */
function start(seed) {
  state = load(seed && seed.state);
  state._confirmReset = false;
  fxInit(); render();
  if (state.screen === "end") rainCandy(60);
  window.claude?.hot?.snapshot?.(() => ({ state }));
  if (document.fonts) document.fonts.ready.then(() => { if (state.screen === "wheel") drawWheel(); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
